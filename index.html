<!doctype html>
<html lang="zh-CN" data-type="software">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>电路 · 刷题室</title>
<style>
:root {
  color-scheme: light;
  --paper: #faf9f5;
  --surface: #fffefa;
  --ink: #29251f;
  --muted: #665e52;
  --line: #dfdad1;
  --accent: #9c432b;
  --serif: "Iowan Old Style", "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", Georgia, "SimSun", serif;
  --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.65 var(--sans); }
main { max-width: 1120px; margin: auto; padding: 42px 24px 56px; }
h1, h2, h3, p { margin: 0; }
h1 { font: 500 clamp(32px, 5vw, 48px)/1.2 var(--serif); }
h2, h3 { font-size: 16px; }
small, .eyebrow, .messageMeta span { color: var(--muted); }
.eyebrow { font-size: 13px; margin-bottom: 6px; }
.roomHeader { border-bottom: 1px solid var(--line); padding-bottom: 22px; margin-bottom: 24px; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.roomTitle { margin-right: auto; }
.roomLayout { display: grid; grid-template-columns: 224px minmax(0, 1fr); gap: 26px; align-items: start; }
.roomSidebar { min-width: 0; padding: 16px; background: #f2efe8; border: 1px solid var(--line); border-radius: 12px; }
.roomStatus { margin: 12px 0; font-size: 13px; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-weight: 600; }
label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
button, select, input { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
button { padding: 8px 13px; cursor: pointer; }
button:not(:disabled):hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: white; }
button:disabled { opacity: .45; cursor: default; }
select, input { min-width: 0; width: 100%; padding: 7px 8px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.roomChat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.chatHeading { padding: 14px 24px; border-bottom: 1px solid var(--line); }
.chatMark, .avatar { display: none; }
#results { padding: 22px 24px; }
.messageCard, .messageBody { min-width: 0; overflow-wrap: anywhere; }
.messageMeta { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 10px; }
.messageMeta span { font-size: 13px; }
#prompt { font: 500 20px/1.7 var(--serif); }
#feedback { margin-top: 18px; padding: 14px; border-radius: 9px; background: #f2f5ed; }
#feedback[data-kind="质疑"] { background: #fbefeb; }
#humanForm { padding: 12px 24px; gap: 8px; border-top: 1px solid var(--line); }
#choices b { background: #eee9e0; }
#choices button[data-selected=true] { background: #f9e9df; border-color: var(--accent); }
#examConfig { margin-top: 12px; display: grid; gap: 10px; }
#examStatus { padding: 10px 24px; border-bottom: 1px solid var(--line); background: #f7f1e8; font-variant-numeric: tabular-nums; }
#examError { color: #a52e29; }
.math { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; }
.fraction { display: inline-flex; vertical-align: middle; flex-direction: column; align-items: stretch; text-align: center; line-height: 1.18; margin: .12em .14em; max-width: 100%; }
.fraction > span { padding: .12em .24em; }
.fraction > span:first-child { border-bottom: 1px solid currentColor; }
.math sub, .math sup { font-size: .72em; line-height: 0; }
@media (max-width: 740px) {
  main { padding: 20px 12px 32px; }
  .roomTitle { flex-basis: 100%; margin-bottom: 5px; }
  .roomLayout { gap: 12px; }
  .chatHeading, #results, #humanForm, #examStatus { padding-inline: 14px; }
  #prompt { font-size: 18px; }
}

#meetingRoom #results{height:auto;min-height:310px;overflow:visible}
#results .messageCard{width:100%}
#choices{display:grid;gap:8px;margin-top:14px}
#choices button{display:flex;align-items:center;gap:10px;text-align:left;border-radius:12px;min-height:44px;overflow-wrap:anywhere}
#choices b{flex:none;min-width:27px;text-align:center;background:#eee9e0;border-radius:7px}
#choices button[data-grade=correct]{background:#d6f4e2;border-color:#248154;color:#10442b;box-shadow:inset 4px 0 #248154}
#choices button[data-grade=wrong]{background:#ffdedb;border-color:#b83a34;color:#701e1a;box-shadow:inset 4px 0 #b83a34}
#choices .choiceCopy{display:block;min-width:0}
#choices .gradeBadge{display:table;margin-top:3px;border-radius:6px;padding:1px 8px;color:white;background:#176641;font-size:12px;font-weight:750}
#choices [data-grade=wrong] .gradeBadge{background:#a52e29}
#feedback #grade{font-size:15px;color:#176641}
#feedback[data-kind="质疑"] #grade{color:#a52e29}
#choices button:disabled{opacity:1;cursor:default}
#humanForm{display:flex;flex-wrap:wrap;align-items:center}
#next{margin-left:auto}
#questionGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;max-height:256px;overflow:auto;padding:4px}
#questionGrid button{padding:5px;min-height:42px}
#questionGrid [aria-current=true]{outline:2px solid var(--accent)}
#filters{display:grid;gap:9px}
progress{width:100%;height:8px;accent-color:var(--accent)}
@media(max-width:740px){#meetingRoom .roomLayout{grid-template-columns:minmax(0,1fr)}#meetingRoom .roomSidebar{max-height:none;overflow:visible}#filters{grid-template-columns:repeat(2,minmax(0,1fr))}#meetingRoom button,#meetingRoom select{min-height:44px}#meetingRoom select{font-size:16px}}
</style>
<main>
<section class="panel" id="meetingRoom">
<div class="roomHeader"><div class="bar"><div class="roomTitle"><div class="eyebrow">电路 · 课内测验</div><h1>电路刷题室</h1></div><button id="order" class="primary" aria-pressed="true">顺序练习</button><button id="random" aria-pressed="false">随机练习</button><button id="wrong" aria-pressed="false">错题重练</button><button id="examMode" aria-pressed="false">随机组卷</button></div></div>
<div class="roomLayout">
<aside class="roomSidebar" aria-label="练习设置">
<div id="filters"><label>章节<select id="chapter"><option value="0">全部章节</option><option value="1">第 1 章 · 电路模型和电路定律</option><option value="2">第 2 章 · 电阻电路的等效变换</option><option value="3">第 3 章 · 电阻电路的一般分析</option><option value="4">第 4 章 · 电路定理</option><option value="6">第 6 章 · 储能元件</option><option value="7">第 7 章 · 一阶电路的时域分析</option><option value="8">第 8 章 · 相量法</option><option value="9">第 9 章 · 正弦稳态电路的分析</option><option value="10">第 10 章 · 含有耦合电感的电路</option><option value="11">第 11 章 · 电路的频率响应</option><option value="12">第 12 章 · 三相电路</option><option value="14">第 14 章 · 线性动态电路的复频域分析</option></select></label><label>难度<select id="difficulty"><option value="">全部难度</option><option>低</option><option>中</option><option>高</option></select></label></div>
<form id="examConfig" hidden>
<label>题目数量<input id="examCount" type="number" min="1" max="1050" value="20" required></label>
<label>限时（分钟）<input id="examMinutes" type="number" min="1" max="999" value="30" required></label>
<small id="examAvailable"></small>
<small id="examError" role="alert" hidden></small>
<button id="startExam" class="primary" type="submit">开始答卷</button>
</form>
<div class="roomStatus"><p id="stats"></p><progress id="progress" max="1050" value="0" aria-label="题库完成进度"></progress></div>
<details><summary>答题卡</summary><div id="questionGrid"></div></details>
</aside>
<div class="roomChat">
<div class="chatHeading"><div class="chatMark" aria-hidden="true">•••</div><div><h3>单项选择</h3><small id="position"></small></div></div>
<div id="examStatus" hidden></div>
<div id="results">
<article id="question"><div class="avatar" style="--avatar-hue:196" aria-hidden="true">题</div><div class="messageCard"><div class="messageMeta"><h3 id="label"></h3><span id="topic"></span></div><div class="messageBubble messageBody"><p id="prompt" tabindex="-1"></p><div id="choices" aria-label="答案选项"></div></div></div></article>
<article id="feedback" data-kind="表决" role="status" hidden><div class="avatar" style="--avatar-hue:153" aria-hidden="true">解</div><div class="messageCard"><div class="messageMeta"><h3 id="grade"></h3></div><div class="messageBubble messageBody"><p id="explanation"></p></div></div></article>
<article id="empty" data-kind="系统" hidden><div class="messageBubble" id="emptyText"></div></article>
</div>
<div id="humanForm" class="liquidGlass"><button id="prev">上一题</button><button id="retry" hidden>重答本题</button><button id="submitExam" hidden>交卷</button><button id="next" class="primary">下一题</button></div>
</div>
</div>
</section>
</main>
<script id="bank" type="application/json">[{"id":1001,"c":1,"n":1,"code":"01-001","t":"电路和电路模型","p":"电路模型是由若干（ ）组成的。","o":["实际器件","理想化元件","导线和开关","电源和负载"],"a":1,"d":"低","e":"电路模型是将实际电路中的器件用其理想化模型符号表示，由若干理想化元件组成。"},{"id":1002,"c":1,"n":2,"code":"01-002","t":"电路和电路模型","p":"将实际电路中的各个器件用其模型符号表示后画出的图，称为（ ）。","o":["电路模型图","安装图","布线图","原理框图"],"a":0,"d":"低","e":"将实际电路中各个器件用其模型符号表示，这样画出的图称为实际电路的电路模型图。"},{"id":1003,"c":1,"n":3,"code":"01-003","t":"电路和电路模型","p":"任何实际电路都不可缺少的组成部分是（ ）。","o":["电阻、电容、电感","电源、负载、导线","开关、熔断器、导线","晶体管、电阻、电容"],"a":1,"d":"低","e":"电源、负载、导线是任何实际电路都不可缺少的三个组成部分。"},{"id":1004,"c":1,"n":4,"code":"01-004","t":"电路和电路模型","p":"电路的主要作用可概括为（ ）。","o":["仅进行能量的传输与转换","仅实现信号的传递与处理","进行能量的传输与转换，以及实现信号的传递与处理","仅进行电能的存储"],"a":2,"d":"低","e":"电路的主要作用可概括为两个方面：进行能量的传输与转换；实现信号的传递与处理。"},{"id":1005,"c":1,"n":5,"code":"01-005","t":"电路和电路模型","p":"当实际电路的几何尺寸远小于其工作时电磁波的波长时，该电路可视为（ ）。","o":["分布参数电路","集中参数电路","非线性电路","时变电路"],"a":1,"d":"低","e":"电路几何尺寸远小于其工作时电磁波波长的电路称为集中参数电路。"},{"id":1006,"c":1,"n":6,"code":"01-006","t":"电路和电路模型","p":"下列关于集中参数电路的说法中，正确的是（ ）。","o":["电磁能量在电路各处的传播需要考虑时间延迟","可以认为传送到电路各处的电磁能量是同时到达的","适用于高频长距离传输线","导线的电阻、电感和电容特性必须分开考虑"],"a":1,"d":"中","e":"如果实际电路的几何尺寸远小于其工作时电磁波的波长，可以认为传送到电路各处的电磁能量是同时到达的。"},{"id":1007,"c":1,"n":7,"code":"01-007","t":"电路和电路模型","p":"完全由线性元件、独立源或线性受控源构成的电路称为（ ）。","o":["非线性电路","线性电路","时变电路","分布参数电路"],"a":1,"d":"低","e":"线性电路是指完全由线性元件、独立源或线性受控源构成的电路。"},{"id":1008,"c":1,"n":8,"code":"01-008","t":"电路和电路模型","p":"含有非线性元件的电路称为（ ）。","o":["线性电路","时不变电路","非线性电路","集中参数电路"],"a":2,"d":"低","e":"非线性电路是指含有非线性元件的电路。"},{"id":1009,"c":1,"n":9,"code":"01-009","t":"电路和电路模型","p":"电路中的耗能现象集中于（ ）。","o":["电阻元件","电容元件","电感元件","电源元件"],"a":0,"d":"低","e":"在集中参数电路中，耗能都集中于电阻元件，电能只集中于电容元件，磁能只集中于电感元件。"},{"id":1010,"c":1,"n":10,"code":"01-010","t":"电路和电路模型","p":"电容元件反映的电路特征是（ ）。","o":["消耗电能","储存电能","储存磁能","发出电能"],"a":1,"d":"低","e":"理想电容元件只储存电能，可以用理想电容来反映其储存电能的特征。"},{"id":1011,"c":1,"n":11,"code":"01-011","t":"电流和电压的参考方向","p":"电流与电压为关联参考方向是指（ ）。","o":["电流参考方向与电压参考方向一致","电流参考方向与电压参考方向相反","电流实际方向与电压实际方向一致","电流实际方向与电压实际方向相反"],"a":0,"d":"低","e":"关联参考方向是指电流参考方向与电压参考方向一致，即电流从电压的正极流入。"},{"id":1012,"c":1,"n":12,"code":"01-012","t":"电流和电压的参考方向","p":"当电路中电流的参考方向与电流的真实方向相反时，该电流（ ）。","o":["一定为正值","一定为负值","不能肯定是正值或负值","有时是正值、有时为负值"],"a":1,"d":"低","e":"当实际方向和参考方向一致时i > 0，不一致时i \u003c 0。"},{"id":1013,"c":1,"n":13,"code":"01-013","t":"电流和电压的参考方向","p":"已知空间有a、b两点，电压Uab = 10 V，a点电位为Va = 4 V，则b点电位Vb为（ ）。","o":["6 V","−6 V","14 V","10 V"],"a":1,"d":"中","e":"Uab = Va− Vb，因此Vb = Va− Uab = 4 − 10 = −6 V。"},{"id":1014,"c":1,"n":14,"code":"01-014","t":"电流和电压的参考方向","p":"电路中a点电位为5 V，b点电位为−3 V，则电压Uab为（ ）。","o":["8 V","−8 V","2 V","−2 V"],"a":0,"d":"中","e":"Uab = Va− Vb = 5 − (−3) = 8 V。"},{"id":1015,"c":1,"n":15,"code":"01-015","t":"电流和电压的参考方向","p":"非关联参考方向是指（ ）。","o":["电流从电压的正极流入","电流从电压的负极流入","电流参考方向与电压参考方向相同","电流和电压都取正值"],"a":1,"d":"低","e":"非关联参考方向是指电流参考方向与电压参考方向不同，即电流从电压的负极流入。"},{"id":1016,"c":1,"n":16,"code":"01-016","t":"电流和电压的参考方向","p":"关于电流的参考方向，下列说法正确的是（ ）。","o":["参考方向就是实际方向","参考方向是任意假定的方向","参考方向一旦选定就不能改变","电流为负值时说明电流不存在"],"a":1,"d":"低","e":"分析电路时，我们可以假定一个电流和电压的方向，称之为参考方向。"},{"id":1017,"c":1,"n":17,"code":"01-017","t":"电流和电压的参考方向","p":"电流的实际方向通常规定为（ ）。","o":["负电荷移动的方向","正电荷移动的方向","电子移动的方向","与电压降方向相反"],"a":1,"d":"低","e":"电流的实际方向规定为正电荷移动的方向。"},{"id":1018,"c":1,"n":18,"code":"01-018","t":"电流和电压的参考方向","p":"电压的实际方向规定为（ ）。","o":["电位升高的方向","电位降低的方向","电流流动的方向","与参考方向一致的方向"],"a":1,"d":"低","e":"电压的实际方向规定为电位降低的方向，即从高电位指向低电位。"},{"id":1019,"c":1,"n":19,"code":"01-019","t":"电流和电压的参考方向","p":"在电路分析中，引入参考方向的概念是因为（ ）。","o":["实际方向无法确定","电流和电压的实际方向可能随时间变化","使电路计算更加复杂","参考方向就是实际方向"],"a":1,"d":"中","e":"在交流电路或某些复杂电路中，电流和电压的实际方向可能随时间变化，引入参考方向便于统一分析和计算。"},{"id":1020,"c":1,"n":20,"code":"01-020","t":"电流和电压的参考方向","p":"某元件两端电压的参考方向为上正下负，电流参考方向从上端流入，则（ ）。","o":["该元件的电压电流为关联参考方向","该元件的电压电流为非关联参考方向","无法判断是否关联","电压一定为正"],"a":0,"d":"中","e":"电流从上端（正极）流入，与电压参考方向一致，属于关联参考方向。"},{"id":1021,"c":1,"n":21,"code":"01-021","t":"电流和电压的参考方向","p":"若某元件u和i采用非关联参考方向，且u = 5 V，i = 2 A，则该元件（ ）。","o":["吸收功率10 W" 接负载时，其两端电压为（ ），输出电流为（ ）。","o":["零，其源电流值","其源电压值，零","零，零","不确定，其源电流值"],"a":3,"d":"高","e":"理想电流源开路时输出电流仍为源电流值，但两端电压由外电路决定，开路时电压不确定（趋于无穷大）。"},{"id":1065,"c":1,"n":65,"code":"01-065","t":"电压源和电流源","p":"实际电流源不接负载（开路）时，其内部（ ）。","o":["有电流，有功率损耗","无电流，无功率损耗","有电流，无功率损耗","无电流，有功率损耗"],"a":0,"d":"中","e":"实际电流源由理想电流源与内阻并联构成。开路时外部回路断开，理想电流源输出的电流全部经内阻闭合，因此内部有电流，并在内阻上产生I2R功率损耗；理想电流源则不允许开路。"},{"id":1066,"c":1,"n":66,"code":"01-066","t":"电压源和电流源","p":"多个电压源并联时，必须满足（ ）。","o":["电压源电压相等","电压源电流相等","电压源极性一致","电压源电压相等且极性一致"],"a":3,"d":"中","e":"理想电压源并联的条件是电压值相等且极性一致，否则违反 KVL。"},{"id":1067,"c":1,"n":67,"code":"01-067","t":"电压源和电流源","p":"多个电流源串联时，必须满足（ ）。","o":["电流源电流相等","电流源方向一致","电流源电流相等且方向一致","无任何条件"],"a":2,"d":"中","e":"理想电流源串联的条件是电流值相等且方向一致，否则违反 KCL。"},{"id":1068,"c":1,"n":68,"code":"01-068","t":"电压源和电流源","p":"理想电压源与理想电流源串联后，其等效电路为（ ）。","o":["电压源","电流源","电阻","无法等效"],"a":1,"d":"高","e":"电压源与电流源串联时，对外电路而言电流由电流源决定，等效为电流源。"},{"id":1069,"c":1,"n":69,"code":"01-069","t":"电压源和电流源","p":"理想电压源与理想电流源并联后，其等效电路为（ ）。","o":["电压源","电流源","电阻","无法等效"],"a":0,"d":"高","e":"电压源与电流源并联时，对外电路而言电压由电压源决定，等效为电压源。"},{"id":1070,"c":1,"n":70,"code":"01-070","t":"电压源和电流源","p":"实际电压源可以用一个理想电压源与一个电阻（ ）来表示。","o":["并联","串联","混联","无关"],"a":1,"d":"中","e":"实际电压源模型为理想电压源与内阻串联。"},{"id":1071,"c":1,"n":71,"code":"01-071","t":"电压源和电流源","p":"实际电流源可以用一个理想电流源与一个电阻（ ）来表示。","o":["并联","串联","混联","无关"],"a":0,"d":"中","e":"实际电流源模型为理想电流源与内阻并联。"},{"id":1072,"c":1,"n":72,"code":"01-072","t":"电压源和电流源","p":"关于理想电压源，下列说法正确的是（ ）。","o":["其端电压随负载变化","其输出电流由外电路决定","其端电压由外电路决定","其输出电流恒定不变"],"a":1,"d":"中","e":"理想电压源的端电压恒定，但输出电流由外电路决定。"},{"id":1073,"c":1,"n":73,"code":"01-073","t":"电压源和电流源","p":"关于理想电流源，下列说法正确的是（ ）。","o":["其输出电流随负载变化","其端电压由外电路决定","其输出电流由外电路决定","其端电压恒定不变"],"a":1,"d":"中","e":"理想电流源的输出电流恒定，但端电压由外电路决定。"},{"id":1074,"c":1,"n":74,"code":"01-074","t":"电压源和电流源","p":"电压源在电路中起（ ）作用，电流源在电路中起（ ）作用。","o":["负载，电源","电源，电源","电源，负载","负载，负载"],"a":1,"d":"低","e":"电压源和电流源都是电源元件，在电路中通常起电源作用，但也可以吸收功率充当负载（如充电状态）。"},{"id":1075,"c":1,"n":75,"code":"01-075","t":"电压源和电流源","p":"某理想电压源电压为10 V，接一个5 Ω电阻，则输出电流为（ ）。","o":["0.5 A","2 A","5 A","50 A"],"a":1,"d":"低","e":"I = U/ R = 10 / 5 = 2 A。"},{"id":1076,"c":1,"n":76,"code":"01-076","t":"电压源和电流源","p":"某理想电流源电流为2 A，接一个10 Ω电阻，则电阻两端电压为（ ）。","o":["0.2 V","5 V","20 V","12 V"],"a":2,"d":"低","e":"U = I × R = 2 × 10 = 20 V。"},{"id":1077,"c":1,"n":77,"code":"01-077","t":"电压源和电流源","p":"理想电压源的伏安特性曲线在u − i平面上是一条（ ）。","o":["平行于i轴的直线","平行于u轴的直线","过原点的直线","曲线"],"a":0,"d":"中","e":"理想电压源的电压不随电流变化，在u − i平面上是一条平行于i轴的直线（i为横轴时）。"},{"id":1078,"c":1,"n":78,"code":"01-078","t":"电压源和电流源","p":"理想电流源的伏安特性曲线在u − i平面上是一条（ ）。","o":["平行于i轴的直线","平行于u轴的直线","过原点的直线","曲线"],"a":1,"d":"中","e":"理想电流源的电流不随电压变化，在u − i平面上是一条平行于u轴的直线。"},{"id":1079,"c":1,"n":79,"code":"01-079","t":"电压源和电流源","p":"一个理想电压源与一个电阻串联后，对外电路而言（ ）。","o":["等效为一个理想电压源","等效为一个理想电流源","等效为一个实际电压源","等效为一个电阻"],"a":2,"d":"中","e":"理想电压源与电阻串联构成实际电压源模型。"},{"id":1080,"c":1,"n":80,"code":"01-080","t":"电压源和电流源","p":"一个理想电流源与一个电阻并联后，对外电路而言（ ）。","o":["等效为一个理想电压源","等效为一个理想电流源","等效为一个实际电流源","等效为一个电阻"],"a":2,"d":"中","e":"理想电流源与电阻并联构成实际电流源模型。"},{"id":1081,"c":1,"n":81,"code":"01-081","t":"受控电源","p":"受控电源的电压或电流受（ ）控制。","o":["外电路电压","电路中某处的电压或电流","电源自身的温度","时间"],"a":1,"d":"低","e":"受控电源的电压或电流受电路中另一处的电压或电流控制，不是独立电源。"},{"id":1082,"c":1,"n":82,"code":"01-082","t":"受控电源","p":"电压控制电压源（VCVS）的英文缩写是（ ）。","o":["VCVS","VCCS","CCVS","CCCS"],"a":0,"d":"低","e":"VCVS = Voltage Controlled Voltage Source，即电压控制电压源。"},{"id":1083,"c":1,"n":83,"code":"01-083","t":"受控电源","p":"电压控制电流源（VCCS）的英文缩写是（ ）。","o":["VCVS","VCCS","CCVS","CCCS"],"a":1,"d":"低","e":"VCCS = Voltage Controlled Current Source，即电压控制电流源。"},{"id":1084,"c":1,"n":84,"code":"01-084","t":"受控电源","p":"电流控制电压源（CCVS）的英文缩写是（ ）。","o":["VCVS","VCCS","CCVS","CCCS"],"a":2,"d":"低","e":"CCVS = Current Controlled Voltage Source，即电流控制电压源。"},{"id":1085,"c":1,"n":85,"code":"01-085","t":"受控电源","p":"电流控制电流源（CCCS）的英文缩写是（ ）。","o":["VCVS","VCCS","CCVS","CCCS"],"a":3,"d":"低","e":"CCCS = Current Controlled Current Source，即电流控制电流源。"},{"id":1086,"c":1,"n":86,"code":"01-086","t":"受控电源","p":"受控电源共有（ ）种类型。","o":["2","3","4","5"],"a":2,"d":"低","e":"根据控制量和受控量的不同，受控源分为四种类型：VCVS、VCCS、CCVS、CCCS。"},{"id":1087,"c":1,"n":87,"code":"01-087","t":"受控电源","p":"受控源在电路分析中通常作为（ ）处理。","o":["独立电源","电阻元件","受控源保留在电路中，列方程时作为已知量处理","短路"],"a":2,"d":"中","e":"受控源不能像独立源那样单独作用，在列写电路方程时需保留其受控关系，作为受控于电路中某电压或电流的已知量处理。"},{"id":1088,"c":1,"n":88,"code":"01-088","t":"受控电源","p":"某 VCVS 的电压控制系数μ = 2，控制电压为5 V，则受控电压源的电压为（ ）。","o":["2 V","5 V","10 V","2.5 V"],"a":2,"d":"中","e":"受控电压源电压 = μ × 控制电压 = 2 × 5 = 10 V。"},{"id":1089,"c":1,"n":89,"code":"01-089","t":"受控电源","p":"某 CCCS 的电流控制系数β = 3，控制电流为2 A，则受控电流源的电流为（ ）。","o":["2 A","3 A","6 A","1.5 A"],"a":2,"d":"中","e":"受控电流源电流 = β × 控制电流 = 3 × 2 = 6 A。"},{"id":1090,"c":1,"n":90,"code":"01-090","t":"受控电源","p":"关于受控源与独立源的区别，下列说法正确的是（ ）。","o":["受控源可以独立产生电压或电流","独立源不受电路中其他电压电流的控制","受控源在电路分析中可作为独立源单独作用","独立源的数值受受控源控制"],"a":1,"d":"中","e":"独立源能独立产生电压或电流，不受电路中其他量控制；受控源则受电路中某处的电压或电流控制。"},{"id":1091,"c":1,"n":91,"code":"01-091","t":"基尔霍夫定律","p":"基尔霍夫电流定律（KCL）的内容是：在电路中任一节点，流入该节点的电流之和（ ）流出该节点的电流之和。","o":["大于","小于","等于","无关"],"a":2,"d":"低","e":"KCL 指出，在电路中的任一节点，流入该节点的电流之和等于流出该节点的电流之和。"},{"id":1092,"c":1,"n":92,"code":"01-092","t":"基尔霍夫定律","p":"基尔霍夫电压定律（KVL）的内容是：沿闭合回路的各段电压的代数和为（ ）。","o":["无穷大","零","正数","负数"],"a":1,"d":"低","e":"KVL 指出，沿闭合回路的电压代数和为零。"},{"id":1093,"c":1,"n":93,"code":"01-093","t":"基尔霍夫定律","p":"KCL 的数学表达式为（ ）。","o":["∑ I = 0","∑ U = 0","∑ I × R = 0","∑ U × I = 0"],"a":0,"d":"低","e":"KCL 的数学表达式为∑ I = 0，即流入节点的电流之和等于流出节点的电流之和。"},{"id":1094,"c":1,"n":94,"code":"01-094","t":"基尔霍夫定律","p":"KVL 的数学表达式为（ ）。","o":["∑ I = 0","∑ U = 0","∑ I × R = 0","∑ U × I = 0"],"a":1,"d":"低","e":"KVL 的数学表达式为∑ U = 0，即沿闭合回路的电压代数和为零。"},{"id":1095,"c":1,"n":95,"code":"01-095","t":"基尔霍夫定律","p":"KCL 应用于电路中的（ ），KVL 应用于电路中的（ ）。","o":["回路，节点","节点，回路","节点，节点","回路，回路"],"a":1,"d":"低","e":"KCL 应用于节点，KVL 应用于回路。"},{"id":1096,"c":1,"n":96,"code":"01-096","t":"基尔霍夫定律","p":"某节点有 3 条支路，已知两条支路电流分别为流入2 A、流出5 A，则第三条支路电流（ ）。","o":["流入3 A","流出3 A","流入7 A","流出7 A"],"a":0,"d":"中","e":"根据 KCL，∑ I = 0，设流出为正，则流入2 A记为-2，流出5 A记为+5，则第三条支路电流 = −(−2 + 5) = −3 A，即流入3 A。"},{"id":1097,"c":1,"n":97,"code":"01-097","t":"基尔霍夫定律","p":"某闭合回路中有三个元件，已知两个元件的电压分别为6 V和−2 V（沿回路方向），则第三个元件的电压为（ ）。","o":["4 V","−4 V","8 V","−8 V"],"a":1,"d":"中","e":"根据 KVL，∑ U = 0，6 + (−2) + U3 = 0，U3 = −4 V。"},{"id":1098,"c":1,"n":98,"code":"01-098","t":"基尔霍夫定律","p":"KCL 的实质是（ ）。","o":["能量守恒","电荷守恒","磁通守恒","功率守恒"],"a":1,"d":"中","e":"KCL 反映了电荷守恒定律，即流入节点的电荷等于流出节点的电荷，节点上不能积累电荷。"},{"id":1099,"c":1,"n":99,"code":"01-099","t":"基尔霍夫定律","p":"KVL 的实质是（ ）。","o":["电荷守恒","能量守恒","磁通守恒","电流守恒"],"a":1,"d":"中","e":"KVL 反映了能量守恒定律，即单位正电荷沿闭合回路一周，电场力做功的代数和为零。"},{"id":1100,"c":1,"n":100,"code":"01-100","t":"基尔霍夫定律","p":"关于 KCL 和 KVL 的适用条件，下列说法正确的是（ ）。","o":["仅适用于线性电路","仅适用于直流电路","仅适用于集中参数电路","适用于任何集中参数电路，与元件性质无关"],"a":3,"d":"中","e":"KCL 和 KVL 适用于任何集中参数电路，无论电路是线性的还是非线性的，直流的还是交流的，都与元件性质无关。"},{"id":2001,"c":2,"n":1,"code":"02-001","t":"电路的等效变换","p":"两个二端电路等效的条件是（ ）","o":["两个电路的结构完全相同","两个电路具有相同的伏安特性","两个电路包含相同的元件数量","两个电路的功率相等"],"a":1,"d":"低","e":"电路等效是指两个二端电路端口具有相同的电压、电流关系（即相同的 VCR），与内部结构无关。"},{"id":2002,"c":2,"n":2,"code":"02-002","t":"电路的等效变换","p":"电路等效变换的对象是（ ）","o":["外电路中的电压、电流和功率","变换部分内部的电压、电流","变换部分内部消耗的功率","变换部分内部的元件参数"],"a":0,"d":"中","e":"等效变换的对象是外电路（未变化部分）中的电压、电流和功率，对变换部分内部是不等效的。"},{"id":2003,"c":2,"n":3,"code":"02-003","t":"电路的等效变换","p":"对A电路而言，B电路与C电路等效意味着（ ）","o":["B与C内部的功率相等","B与C的端口伏安特性相同","B与C的元件参数相同","B与C的电路结构相同"],"a":1,"d":"低","e":"两个二端电路等效的核心条件是端口伏安特性完全相同。"},{"id":2004,"c":2,"n":4,"code":"02-004","t":"电路的等效变换","p":"关于等效变换，以下说法正确的是（ ）","o":["等效变换后，外电路中的电流会发生改变","等效变换后，变换部分内部的电压、电流也保持不变","等效变换的目的是简化电路，方便求解","等效变换要求两个电路的结构必须相似"],"a":2,"d":"低","e":"等效变换的目的是简化电路，方便求出需要的结果。等效是对外电路而言的，内部并不等效。"},{"id":2005,"c":2,"n":5,"code":"02-005","t":"电路的等效变换","p":"二端网络是指（ ）","o":["具有两个元件的电路","向外引出两个端钮，且从一个端子流入的电流等于从另一端子流出的电流的电路","只有两个节点的电路","具有两条支路的电路"],"a":1,"d":"低","e":"二端网络的定义是向外引出两个端钮，且满足电流连续性条件（流入电流等于流出电流）。"},{"id":2006,"c":2,"n":6,"code":"02-006","t":"电路的等效变换","p":"两个二端电路等效，意味着它们（ ）","o":["内部所有元件的电压、电流都相等","端口具有相同的电压、电流关系","消耗的功率相等","包含的电源数量相等"],"a":1,"d":"低","e":"等效的核心在于端口伏安特性相同，而非内部参数或功率相等。"},{"id":2007,"c":2,"n":7,"code":"02-007","t":"电路的等效变换","p":"等效变换的“等效”指的是（ ）","o":["变换前后电路内部完全一样","变换前后对任意外部电路的作用效果相同","变换前后电路的功率相同","变换前后电路的元件参数相同"],"a":1,"d":"中","e":"等效变换是对外电路而言的，即变换前后对外部电路的作用效果相同。"},{"id":2008,"c":2,"n":8,"code":"02-008","t":"电路的等效变换","p":"以下关于等效变换的说法，错误的是（ ）","o":["等效变换可以简化电路结构","等效变换后，变换部分内部的电压和电流可能改变","等效变换要求两个二端网络的伏安特性完全相同","等效变换后，外电路的响应也会改变"],"a":3,"d":"中","e":"等效变换后，外电路的电压、电流和功率均保持不变，否则就不叫等效。"},{"id":2009,"c":2,"n":9,"code":"02-009","t":"电路的等效变换","p":"“输入电阻”通常是指（ ）","o":["电路中某个电阻的阻值","从电路输入端看进去的等效电阻","电路中的总电阻","电源的内阻"],"a":1,"d":"低","e":"输入电阻是从端口看进去的等效电阻，等于端口电压与端口电流之比。"},{"id":2010,"c":2,"n":10,"code":"02-010","t":"电路的等效变换","p":"含源二端网络的输入电阻定义为（ ）","o":["端口电压与电流之比（独立源置零后）","端口电压与电流之比（独立源保留）","开路电压与短路电流之比","电路总电阻"],"a":0,"d":"中","e":"求含源二端网络的输入电阻时，先将独立源置零（电压源短路、电流源开路）化为无源网络，再由端口电压与端口电流之比求得；独立源保留时端口电压与电流之比随外电路改变，不是输入电阻。"},{"id":2011,"c":2,"n":11,"code":"02-011","t":"电阻的串联和并联","p":"两个电阻R1 = 4 Ω、R2 = 6 Ω串联，等效电阻为（ ）","o":["2.4 Ω","10 Ω","24 Ω","1.5 Ω"],"a":1,"d":"低","e":"串联等效电阻等于各电阻之和，R = R1 + R2 = 4 + 6 = 10 Ω。"},{"id":2012,"c":2,"n":12,"code":"02-012","t":"电阻的串联和并联","p":"两个电阻R1 = 4 Ω、R2 = 6 Ω并联，等效电阻为（ ）","o":["10 Ω","24 Ω","2.4 Ω","1.5 Ω"],"a":2,"d":"低","e":"并联等效电阻 R = (R1R2) / (R1 + R2) = 24 / 10 = 2.4 Ω。"},{"id":2013,"c":2,"n":13,"code":"02-013","t":"电阻的串联和并联","p":"电阻串联时，各电阻上的电流（ ）","o":["与电阻成正比","与电阻成反比","相等","之和为总电流"],"a":2,"d":"低","e":"串联电路只有一条通路，流过各串联电阻的电流相同。"},{"id":2014,"c":2,"n":14,"code":"02-014","t":"电阻的串联和并联","p":"电阻并联时，各电阻两端的电压（ ）","o":["与电阻成正比","与电阻成反比","相等","之和为总电压"],"a":2,"d":"低","e":"并联电路各支路承受同一电压。"},{"id":2015,"c":2,"n":15,"code":"02-015","t":"电阻的串联和并联","p":"电阻串联电路中，各电阻分得的电压与电阻值（ ）","o":["成反比","成正比","无关","成平方关系"],"a":1,"d":"低","e":"分压公式 uk = (Rk/ R)u，各电阻电压与电阻值成正比。"},{"id":2016,"c":2,"n":16,"code":"02-016","t":"电阻的串联和并联","p":"电阻并联电路中，各电阻分得的电流与电阻值（ ）","o":["成正比","成反比","无关","成平方关系"],"a":1,"d":"低","e":"分流公式 ik = (G k/ G)i，电流与电导成正比，即与电阻成反比。"},{"id":2017,"c":2,"n":17,"code":"02-017","t":"电阻的串联和并联","p":"两个电阻R1 = 6 Ω、R2 = 12 Ω串联接在18 V电源上，R1两端的电压为（ ）","o":["12 V","6 V","9 V","18 V"],"a":1,"d":"低","e":"分压公式 u1 = (R1/ (R1 + R2)) × U = (6 / 18) × 18 = 6 V。"},{"id":2018,"c":2,"n":18,"code":"02-018","t":"电阻的串联和并联","p":"两个电阻R1 = 4 Ω、R2 = 6 Ω并联，总电流为5 A，则流过R1的电流为（ ）","o":["3 A","2 A","2.5 A","4 A"],"a":0,"d":"低","e":"分流公式 i1 = (R2/ (R1 + R2)) × I = (6 / 10) × 5 = 3 A。"},{"id":2019,"c":2,"n":19,"code":"02-019","t":"电阻的串联和并联","p":"n个电阻串联，等效电导与各电导的关系是（ ）","o":["G = G1 + G2 + … +Gn","1/G = 1/G1 + 1/G2 + … +1/Gn","G = G1G2…Gn","G = G1 = G2 = … = Gn"],"a":1,"d":"中","e":"串联等效电阻R = ∑ Rk，而G = 1 / R，故1 / G = ∑(1 / G k)。"},{"id":2020,"c":2,"n":20,"code":"02-020","t":"电阻的串联和并联","p":"n个电阻并联，等效电导等于（ ）","o":["各电导之和","各电导之积","各电阻之和","各电阻之积"],"a":0,"d":"低","e":"并联等效电导 G = G 1 + G 2 + … +G n。"},{"id":2021,"c":2,"n":21,"code":"02-021","t":"电阻的串联和并联","p":"电阻串联时，各电阻消耗的功率与电阻值（ ）","o":["成反比","成正比","无关","成平方反比"],"a":1,"d":"中","e":"串联电流相同，P = I2R，功率与电阻成正比。"},{"id":2022,"c":2,"n":22,"code":"02-022","t":"电阻的串联和并联","p":"电阻并联时，各电阻消耗的功率与电阻值（ ）","o":["成正比","成反比","无关","成平方正比"],"a":1,"d":"中","e":"并联电压相同，P = U 2/ R，功率与电阻成反比。"},{"id":2023,"c":2,"n":23,"code":"02-023","t":"电阻的串联和并联","p":"等效电阻消耗的功率与各串联电阻消耗功率的关系是（ ）","o":["大于各功率之和","小于各功率之和","等于各功率之和","与各功率之和无关"],"a":2,"d":"中","e":"等效电阻消耗的功率等于各串联（或并联）电阻消耗功率的总和，这是功率守恒的体现。"},{"id":2024,"c":2,"n":24,"code":"02-024","t":"电阻的串联和并联","p":"两个相同的电阻R串联，等效电阻为（ ）","o":["R","2R","R/2","R²"],"a":1,"d":"低","e":"串联等效电阻 R + R = 2R。"},{"id":2025,"c":2,"n":25,"code":"02-025","t":"电阻的串联和并联","p":"两个相同的电阻R并联，等效电阻为（ ）","o":["R","2R","R/2","R²"],"a":2,"d":"低","e":"并联等效电阻 (R × R) / (R + R) = R / 2。"},{"id":2026,"c":2,"n":26,"code":"02-026","t":"电阻的串联和并联","p":"三个电阻R1 = 2 Ω、R2 = 3 Ω、R3 = 6 Ω串联，等效电阻为（ ）","o":["11 Ω","1 Ω","36 Ω","6 Ω"],"a":0,"d":"低","e":"串联等效电阻为各电阻之和：2 + 3 + 6 = 11 Ω。"},{"id":2027,"c":2,"n":27,"code":"02-027","t":"电阻的串联和并联","p":"三个电阻R1 = 2 Ω、R2 = 3 Ω、R3 = 6 Ω并联，等效电阻为（ ）","o":["11 Ω","1 Ω", ,"n":89,"code":"02-089","t":"实际电源的两种模型及其等效变换","p":"实际电流源等效变换为实际电压源时，等效电压Us等于（ ）","o":["IsRs","Is/Rs","Rs/Is","Is + Rs"],"a":0,"d":"中","e":"等效电压源电压 Us = IsRs，内阻不变。"},{"id":2090,"c":2,"n":90,"code":"02-090","t":"实际电源的两种模型及其等效变换","p":"电源等效变换时，电压源正极对应电流源的（ ）","o":["电流流入端","电流流出端","任意端","接地端"],"a":1,"d":"中","e":"等效变换时，电压源的正极性与电流源电流流出方向相对应。"},{"id":2091,"c":2,"n":91,"code":"02-091","t":"实际电源的两种模型及其等效变换","p":"关于电源等效变换，以下说法正确的是（ ）","o":["等效变换对电源内部也等效","等效变换只对外电路等效","理想电压源和理想电流源可以相互等效","等效变换会改变电阻值"],"a":1,"d":"中","e":"电源等效变换只是对外电路等效，对电源内部不等效；理想电压源和电流源之间无等效关系。"},{"id":2092,"c":2,"n":92,"code":"02-092","t":"实际电源的两种模型及其等效变换","p":"实际电压源的内阻为2 Ω，开路电压为10 V，等效为电流源时电流为（ ）","o":["5 A","10 A","20 A","2 A"],"a":0,"d":"中","e":"Is = Us/ Rs = 10 / 2 = 5 A。"},{"id":2093,"c":2,"n":93,"code":"02-093","t":"实际电源的两种模型及其等效变换","p":"实际电流源的内阻为4 Ω，电流为3 A，等效为电压源时电压为（ ）","o":["12 V","0.75 V","7 V","3 V"],"a":0,"d":"中","e":"Us = IsRs = 3 × 4 = 12 V。"},{"id":2094,"c":2,"n":94,"code":"02-094","t":"实际电源的两种模型及其等效变换","p":"理想电压源和理想电流源之间（ ）","o":["可以相互等效变换","不存在等效变换关系","在特定条件下可以等效","电压源等效为短路"],"a":1,"d":"中","e":"理想电压源内阻为零，理想电流源内阻为无穷大，两者之间不存在等效变换的条件。"},{"id":2095,"c":2,"n":95,"code":"02-095","t":"实际电源的两种模型及其等效变换","p":"电源等效变换时，内阻Rs（ ）","o":["改变数值","保持不变","变为零","变为无穷大"],"a":1,"d":"中","e":"实际电压源和实际电流源等效变换时，内阻数值保持不变。"},{"id":2096,"c":2,"n":96,"code":"02-096","t":"输入电阻","p":"输入电阻是指（ ）","o":["电路中最大的电阻","从端口看进去的等效电阻","电源的内阻","负载电阻"],"a":1,"d":"低","e":"输入电阻是从二端网络端口看进去的等效电阻，等于端口电压与端口电流之比。"},{"id":2097,"c":2,"n":97,"code":"02-097","t":"输入电阻","p":"求含源二端网络的输入电阻时，应将独立源（ ）","o":["保留不变","电压源短路、电流源开路","电压源开路、电流源短路","全部短路"],"a":1,"d":"中","e":"求含源网络的输入电阻（等效电阻）时，独立电压源置零（短路），独立电流源置零（开路）。"},{"id":2098,"c":2,"n":98,"code":"02-098","t":"输入电阻","p":"求纯电阻网络的输入电阻时，通常采用（ ）","o":["节点电压法","电阻串并联等效化简","叠加定理","戴维南定理"],"a":1,"d":"低","e":"纯电阻网络通过串并联等效（必要时 Y-Δ 变换）即可求得输入电阻。"},{"id":2099,"c":2,"n":99,"code":"02-099","t":"输入电阻","p":"某二端网络的端口电压为12 V，流入电流为3 A，则该网络的输入电阻为（ ）","o":["36 Ω","4 Ω","0.25 Ω","15 Ω"],"a":1,"d":"低","e":"输入电阻 Ri = U/ I = 12 / 3 = 4 Ω。"},{"id":2100,"c":2,"n":100,"code":"02-100","t":"输入电阻","p":"关于输入电阻，以下说法正确的是（ ）","o":["输入电阻一定大于电路中任一电阻","输入电阻是端口电压与端口电流的比值","输入电阻与外部电路有关","输入电阻一定小于电路中任一电阻"],"a":1,"d":"中","e":"输入电阻的定义是端口电压与端口电流之比，其大小由网络内部结构和参数决定，与外部电路无关。"},{"id":3001,"c":3,"n":1,"code":"03-001","t":"电路的图","p":"关于电路的“图”的概念，下列说法正确的是（ ）","o":["电路的图是指电路的实际几何布局图","电路的图由支路和节点组成，支路用线段表示，节点用圆点表示","电路的图中，支路的方向是固定不可选的","电路的图只适用于平面电路"],"a":1,"d":"低","e":"电路的图（拓扑图）是节点和支路的集合，支路用线段表示，节点用圆点表示。支路的方向可以任意指定，参考方向与实际方向一致时电流为正，否则为负。图的概念对平面电路和非平面电路都适用。"},{"id":3002,"c":3,"n":2,"code":"03-002","t":"电路的图","p":"下列关于有向图的说法中，错误的是（ ）","o":["有向图的支路电流参考方向可以任意假定","有向图的支路电压参考方向通常与电流参考方向取关联方向","有向图中各支路的方向一旦确定就不能更改","支路方向的不同选择不会影响最终求解结果的正确性"],"a":2,"d":"低","e":"有向图中支路的方向是人为假定的参考方向，可以根据方便任意选取，不同的参考方向选择不会改变最终结果的正确性，只是可能导致中间计算结果的符号不同。"},{"id":3003,"c":3,"n":3,"code":"03-003","t":"电路的图","p":"对于具有 4 个节点、6 条支路的连通电路，其树支数和连支数分别为（ ）","o":["4 和 2","3 和 3","2 和 4","4 和 6"],"a":1,"d":"低","e":"连通电路的树支数等于独立节点数，即n − 1 = 4 − 1 = 3；连支数等于独立回路数，即b − n + 1 = 6 − 4 + 1 = 3。"},{"id":3004,"c":3,"n":4,"code":"03-004","t":"电路的图","p":"关于树的概念，下列说法正确的是（ ）","o":["树是包含电路中所有支路的连通图","树是连通图的一个子图，包含所有节点但不包含回路","一个连通图只有唯一的一棵树","树中一定包含回路"],"a":1,"d":"低","e":"树是连通图的一个子图，它包含图中的全部节点，但不包含任何回路。一个连通图可以选出多种不同的树，树支数为 n − 1，连支数为b − n + 1。"},{"id":3005,"c":3,"n":5,"code":"03-005","t":"电路的图","p":"对于一个具有 5 个节点、8 条支路的连通电路，独立回路数为（ ）","o":["3","4","5","8"],"a":1,"d":"低","e":"独立回路数等于连支数，即b − n + 1 = 8 − 5 + 1 = 4。"},{"id":3006,"c":3,"n":6,"code":"03-006","t":"电路的图","p":"下列关于平面电路和非平面电路的说法，正确的是（ ）","o":["非平面电路不存在独立回路","平面电路的网孔数等于独立回路数","非平面电路不能用回路电流法分析","平面电路不能用节点电压法分析"],"a":1,"d":"中","e":"平面电路可以画在平面上而不出现支路交叉，其网孔数恰好等于独立回路数b − n + 1。非平面电路没有网孔的概念， 但仍有独立回路，因此不能用网孔电流法而可以用回路电流法，A错误。节点电压法对两者均适用。"},{"id":3007,"c":3,"n":7,"code":"03-007","t":"电路的图","p":"在电路拓扑图中，从任一节点出发，经过若干支路和节点后回到出发节点的路径称为（ ）","o":["路径","回路","树","割集"],"a":1,"d":"低","e":"回路是电路拓扑图中的一个基本概念，指从某一节点出发，经过若干支路和节点后回到出发节点的闭合路径。"},{"id":3008,"c":3,"n":8,"code":"03-008","t":"电路的图","p":"一个连通图具有n个节点，则其任一棵树的树支数为（ ）","o":["n","n − 1","n + 1","b − n + 1"],"a":1,"d":"低","e":"树包含连通图的全部n个节点且不含回路，树中恰好有n − 1条支路，这些支路称为树支。"},{"id":3009,"c":3,"n":9,"code":"03-009","t":"电路的图","p":"关于基本回路的概念，下列说法正确的是（ ）","o":["基本回路是指包含所有树支的回路","每一条连支和若干树支可以构成一个基本回路","基本回路的数量等于树支数","基本回路中不包含任何连支"],"a":1,"d":"中","e":"基本回路是指只包含一条连支和若干树支的回路。每一条连支对应一个基本回路，因此基本回路的数量等于连支数， 即b − n + 1。"},{"id":3010,"c":3,"n":10,"code":"03-010","t":"电路的图","p":"对于具有 3 个节点、4 条支路的连通电路，下列参数中数值不相等的是（ ）","o":["树支数和支路数","连支数和独立节点数","独立节点数和独立回路数","树支数和连支数"],"a":0,"d":"中","e":"节点数n = 3，支路数b = 4。树支数= n − 1 = 2，连支数= b − n + 1 = 2，独立节点数= n − 1 = 2，独立回路数= b − n + 1 = 2。A项树支数 2 与支路数 4 不相等；B、C、D三项中的两个量均为 2，彼此相等。因此数值不相等的是A。"},{"id":3011,"c":3,"n":11,"code":"03-011","t":"电路的图","p":"有向图的支路方向指的是（ ）","o":["支路中电流的实际方向","支路中电流的参考方向","支路电压的实际极性","支路中电压源的方向"],"a":1,"d":"低","e":"有向图中支路的方向是人为指定的电流参考方向，并非实际方向。当求解出的电流为正值时，实际方向与参考方向一致；为负值时则相反。"},{"id":3012,"c":3,"n":12,"code":"03-012","t":"电路的图","p":"关于电路的拓扑约束，下列说法正确的是（ ）","o":["拓扑约束与支路元件的伏安特性有关","拓扑约束仅取决于电路的连接方式","拓扑约束只包括 KVL","拓扑约束只适用于线性电路"],"a":1,"d":"低","e":"拓扑约束即 KCL 和 KVL，它们只取决于电路的连接方式（拓扑结构），与支路中元件的类型和参数无关，对线性和非线性电路都适用。"},{"id":3013,"c":3,"n":13,"code":"03-013","t":"电路的图","p":"对于具有 4 个节点、7 条支路的非平面连通电路，下列说法正确的是（ ）","o":["网孔电流法仍然适用","独立回路数为 4","树支数为 4","独立回路数为 3"],"a":1,"d":"中","e":"非平面电路不存在网孔概念，因此网孔电流法不适用，A错误。独立回路数为b − n + 1 = 7 − 4 + 1 = 4，B正确，D 错误。树支数为n − 1 = 4 − 1 = 3，C项给出 4，错误。"},{"id":3014,"c":3,"n":14,"code":"03-014","t":"电路的图","p":"在电路拓扑分析中，割集是指（ ）","o":["包含所有支路的集合","把连通图分成两个分离部分的支路最小集合","包含所有节点的集合","包含一条连支和若干树支的闭合路径"],"a":1,"d":"中","e":"割集是把一个连通图分割成两个分离部分所需的最少支路集合。这是图论中的基本概念，与回路的概念对偶。"},{"id":3015,"c":3,"n":15,"code":"03-015","t":"电路的图","p":"对于具有 6 个节点、10 条支路的连通电路，下列说法正确的是（ ）","o":["树支数为 6","连支数为 4","独立回路数为 5","独立回路数为 4"],"a":2,"d":"低","e":"树支数= n − 1 = 6 − 1 = 5，A项给出 6，错误；连支数= b − n + 1 = 10 − 6 + 1 = 5，B项给出 4，错误；独立回路数等于连支数，为 5，C正确，D错误。"},{"id":3016,"c":3,"n":16,"code":"03-016","t":"KCL 和 KVL 的独立方程数","p":"对于具有n个节点、b条支路的连通电路，可以列出的独立 KCL 方程数为（ ）","o":["n","n − 1","n + 1","b − n + 1"],"a":1,"d":"低","e":"对于具有n个节点的连通电路，可以列出n − 1个独立的 KCL 方程。因为所有n个节点的 KCL 方程之和恒为零，其中任意一个方程都可由其余n − 1个导出，因此独立方程数为n − 1。"},{"id":3017,"c":3,"n":17,"code":"03-017","t":"KCL 和 KVL 的独立方程数","p":"对于具有n个节点、b条支路的连通电路，可以列出的独立 KVL 方程数为（ ）","o":["n − 1","b","b − n + 1","b + n − 1"],"a":2,"d":"低","e":"个独立的 KVL 方程。 独立 KVL 方程数等于独立回路数，也等于连支数，即b − n + 1。每一条连支和若干树支构成一个基本回路，对应一"},{"id":3018,"c":3,"n":18,"code":"03-018","t":"KCL 和 KVL 的独立方程数","p":"在有n个节点、b条支路的连通电路中，可以列出独立 KCL 方程和独立 KVL 方程的个数分别为（ ）","o":["n；b","b − n + 1；n + 1","n − 1；b − 1","n − 1；b − n + 1"],"a":3,"d":"低","e":"连通电路中，独立 KCL 方程为n − 1个，独立 KVL 方程为b − n + 1个，两者之和为b，恰好等于支路数。"},{"id":3019,"c":3,"n":19,"code":"03-019","t":"KCL 和 KVL 的独立方程数","p":"一个具有5个节点、8条支路的连通电路，其独立KCL方程数和独立KVL方程数分别为（ ）","o":["5 和 8","4 和 4","5 和 3","4 和 5"],"a":1,"d":"低","e":"独立 KCL 方程数= n − 1 = 5 − 1 = 4，独立 KVL 方程数= b − n + 1 = 8 − 5 + 1 = 4。"},{"id":3020,"c":3,"n":20,"code":"03-020","t":"KCL 和 KVL 的独立方程数","p":"对于具有 3 个节点、5 条支路的连通电路，独立 KCL 方程数为（ ）","o":["1","2","3","4"],"a":1,"d":"低","e":"独立 KCL 方程数= n − 1 = 3 − 1 = 2。"},{"id":3021,"c":3,"n":21,"code":"03-021","t":"KCL 和 KVL 的独立方程数","p":"KCL 方程反映的是电路中（ ）","o":["回路中各支路电压的代数和为零","任一节点处各支路电流的代数和为零","各支路电流之间的线性关系","各支路电压与电流的关系"],"a":1,"d":"低","e":"KCL（基尔霍夫电流定律）指出，对于电路中任一节点，流入该节点的电流之和等于流出该节点的电流之和，即各支路电流的代数和为零。"},{"id":3022,"c":3,"n":22,"code":"03-022","t":"KCL 和 KVL 的独立方程数","p":"KVL 方程反映的是电路中（ ）","o":["任一节点处各支路电流的代数和为零","任一回路中各支路电压的代数和为零","各支路电流之间的线性关系","各支路电压之间的非线性关系"],"a":1,"d":"低","e":"KVL（基尔霍夫电压定律）指出，对于电路中任一闭合回路，沿该回路绕行一周，各支路电压的代数和恒为零。"},{"id":3023,"c":3,"n":23,"code":"03-023","t":"KCL 和 KVL 的独立方程数","p":"下列关于 KCL 和 KVL 独立方程数的说法，正确的是（ ）","o":["KCL 和 KVL 的独立方程数之和等于支路数b","KCL 的独立方程数等于节点数n","KVL 的独立方程数等于支路数b","KCL 和 KVL 的独立方程数之和等于节点数n"],"a":0,"d":"中","e":"方程的依据。 独立 KCL 方程数（n − 1）加上独立 KVL 方程数（b − n + 1）等于b，恰好等于支路数，这正是支路电流法要列写b个"},{"id":3024,"c":3,"n":24,"code":"03-024","t":"KCL 和 KVL 的独立方程数","p":"若电路的支路数为b，节点数为n，则独立的 KCL 方程数为（ ）","o":["n","n − 1","b − n","b − n + 1"],"a":1,"d":"低","e":"对于n个节点的电路，独立的 KCL 方程数为n − 1，因为第n个节点的 KCL 方程可由前n − 1个方程导出。"},{"id":3025,"c":3,"n":25,"code":"03-025","t":"KCL 和 KVL 的独立方程数","p":"对于具有 4 个节点、6 条支路的电路，用支路电流法求解时需要列写的方程总数为（ ）","o":["4 个","6 个","3 个","5 个"],"a":1,"d":"低","e":"支路电流法以支路电流为未知量，需要列写b个方程（b条支路对应b个未知电流），即n − 1个 KCL 方程加上b − n + 1 个 KVL 方程，总数等于b = 6。"},{"id":3026,"c":3,"n":26,"code":"03-026","t":"KCL 和 KVL 的独立方程数","p":"在用支路电流法求解电路时，KCL 方程通常对（ ）列写（ ）","o":["所有节点；n个","除参考节点外的其余节点；n − 1个","所有回路；b − n + 1个","网孔；b个"],"a":1,"d":"低","e":"支路电流法中，KCL 方程对除参考节点外的n − 1个独立节点列写，这样可以保证所列方程线性无关。"},{"id":3027,"c":3,"n":27,"code":"03-027","t":"KCL 和 KVL 的独立方程数","p":"独立 KVL 方程数与下列哪个量相等（ ）","o":["节点数","支路数","连支数","树支数"],"a":2,"d":"中","e":"独立 KVL 方程。 独立 KVL 方程数等于独立回路数，也等于连支数b − n + 1，因为每条连支与若干树支构成一个基本回路，对应一个"},{"id":3028,"c":3,"n":28,"code":"03-028","t":"KCL 和 KVL 的独立方程数","p":"对于一个具有n个节点的电路，其 KCL 独立方程数为n − 1，这是因为（ ）","o":["有一个节点的电流恒为零","所有n个节点的 KCL 方程之和恒为零，其中任一个方程可由其余n − 1个导出","参考节点的电流不需要求解","有源节点的 KCL 方程不独立"],"a":1,"d":"中","e":"将所有n个节点的 KCL 方程相加，每个支路电流会同时出现一次正号和一次负号（流入一个节点、流出另一个节点）， 总和恒为零。因此n个方程中只有n − 1个是独立的。"},{"id":3029,"c":3,"n":29,"code":"03-029","t":"KCL 和 KVL 的独立方程数","p":"若某电路有 8 条支路、5 个节点，则独立的 KVL 方程数为（ ）","o":["3","4","5","8"],"a":1,"d":"低","e":"独立 KVL 方程数= b − n + 1 = 8 − 5 + 1 = 4。"},{"id":3030,"c":3,"n":30,"code":"03-030","t":"KCL 和 KVL 的独立方程数","p":"关于 KCL 和 KVL 方程的独立性，下列说法正确的是（ ）","o":["对任意n个节点列写的 KCL 方程都是独立的","对任意b − n + 1个回路列写的 KVL 方程都是独立的","只有对独立节点列写的 KCL 方程和对独立回路列写的 KVL 方程才是独立的","KCL 方程和 KVL 方程之间也存在线性相关"],"a":2,"d":"中","e":"KCL 方程必须对独立节点列写（通常取n − 1个节点），KVL 方程必须对独立回路列写（通常取b − n + 1个基本回路）， 否则方程之间可能线性相关，导致无法求解。"},{"id":3031,"c":3,"n":31,"code":"03-031","t":"KCL 和 KVL 的独立方程数","p":"对于具有 6 个节点、12 条支路的电路，独立 KCL 方程数为（ ）","o":["5","6","7","12"],"a":0,"d":"低","e":"独立 KCL 方程数= n − 1 = 6 − 1 = 5。"},{"id":3032,"c":3,"n":32,"code":"03-032","t":"KCL 和 KVL 的独立方程数","p":"对于具有 4 个节点、8 条支路的电路，独立 KVL 方程数为（ ）","o":["3","4","5","8"],"a":2,"d":"低","e":"独立 KVL 方程数= b − n + 1 = 8 − 4 + 1 = 5。"},{"id":3033,"c":3,"n":33,"code":"03-033","t":"KCL 和 KVL 的独立方程数","p":"关于 KCL 和 KVL 方程与支路伏安特性的关系，下列说法正确的是（ ）","o":["KCL 和 KVL 方程必须借助支路伏安特性才能列写","KCL 和 KVL 方程都必须结合支路伏安特性才能求解电路","KCL 方程与伏安特性有关，KVL 方程与伏安特性无关","KVL 方程与伏安特性有关，KCL 方程与伏安特性无关"],"a":1,"d":"中","e":"KCL 和 KVL 方程本身只反映电路的拓扑结构约束，列写时不需要支路伏安特性，A错误。但要完整求解电路，还必须结合支路元件的伏安特性（VCR），才能得到b个独立方程求解b个未知量，B正确。C、D两项把两者的依赖关系割裂开来， 均错误。"},{"id":3034,"c":3,"n":34,"code":"03-034","t":"KCL 和 KVL 的独立方程数","p":"用支路电流法求解电路时，独立方程的总数为（ ）","o":["b个","n个","n − 1个","b − n + 1个"],"a":0,"d":"低","e":"支路电流法以b条支路的电流为未知量，需要b个独立方程：n − 1个 KCL 方程加上b − n + 1个 KVL 方程（其中 KVL 方程中代入元件的 VCR），总共b个。"},{"id":3035,"c":3,"n":35,"code":"03-035","t":"KCL 和 KVL 的独立方程数","p":"若某电路有 3 个节点、6 条支路，则独立的 KCL 方程数和 KVL 方程数分别为（ ）","o":["3 和 3","2 和 4","2 和 3","3 和 4"],"a":1,"d":"低","e":"独立 KCL 方程数= n − 1 = 2，独立 KVL 方程数= b − n + 1 = 6 − 3 + 1 = 4。"},{"id":3036,"c":3,"n":36,"code":"03-036","t":"支路电流法","p":"以客观存在的支路电流为未知量，直接应用 KCL 定律和 KVL 定律求解电路的方法，称为 （ ）","o":["支路电流法","回路电流法","节点电压法","支路电压法"],"a":0,"d":"低","e":"支路电流法以各支路电流为独立变量，直接根据 KCL 和 KVL 列出方程求解电路，是最基本的电路分析方法。"},{"id":3037,"c":3,"n":37,"code":"03-037","t":"支路电流法","p":"支路电流法是以（ ）为变量列写节点电流方程及（ ）方程","o":["支路电流；回路电压","支路电压；节点电流","回路电流；回路电压","节点电压；节点电流"],"a":0,"d":"低","e":"支路电流法以支路电流为未知量，列写 KCL 节点电流方程和 KVL 回路电压方程。"},{"id":3038,"c":3,"n":38,"code":"03-038","t":"支路电流法","p":"用支路电流法求解电路时，若电路有b条支路、n个节点，则需要列写的 KCL 方程数为（ ）","o":["n","n − 1","b − n + 1","b"],"a":1,"d":"低","e":"支路电流法中 KCL 方程对除参考节点外的n − 1个独立节点列写，因此 KCL 方程数为n − 1。"},{"id":3039,"c":3,"n":39,"code":"03-039","t":"支路电流法","p":"用支路电流法求解电路时，KVL 方程应以（ ）为绕行回路列写（ ）","o":["网孔；b − n + 1个","基本回路；b − n + 1个","任意回路；b个","所有回路；b − n + 1个"],"a":1,"d":"中","e":"支路电流法中 KVL 方程应对独立回路（通常取基本回路）列写，共b − n + 1个。基本回路是只含一条连支和若干树支的回路，保证 KVL 方程线性无关。"},{"id":3040,"c":3,"n":40,"code":"03-040","t":"支路电流法","p":"支路电流法的主要缺点是（ ）","o":["只适用于平面电路","方程数量较多，求解复杂电路时计算量大","不能用于含受控源的电路","只能求解线性电路"],"a":1,"d":"中","e":"支路电流法需要列写b个方程，当电路支路数较多时方程数量大，求解复杂。这是支路电流法的主要缺点，也是引入网孔电流法、节点电压法等更高效方法的原因。"},{"id":3041,"c":3,"n":41,"code":"03-041","t":"支路电流法","p":"用支路电流法求解电路时，各支路电流的参考方向（ ）","o":["必须与实际方向一致","可以任意假定","必须全部指向同一方向","必须与电压方向一致"],"a":1,"d":"低","e":"在支路电流法中，各支路电流的参考方向可以任意假定。若求解结果为负值，说明实际电流方向与参考方向相反，不影响最终结果的正确性。"},{"id":3042,"c":3,"n":42,"code":"03-042","t":"支路电流法","p":"对于一个具有 2 个节点、3 条支路的并联电路，用支路电流法求解时需要列写的独立 KCL 方程数为（ ）","o":["1","2","3","0"],"a":0,"d":"低","e":"独立 KCL 方程数= n − 1 = 2 − 1 = 1。具有 2 个节点的电路中，只有 1 个独立的 KCL 方程。"},{"id":3043,"c":3,"n":43,"code":"03-043","t":"支路电流法","p":"用支路电流法列写 KVL 方程时，若回路中各支路电压的参考方向与绕行方向相反，则该电压项取（ ）","o":["正号","负号","零","取决于元件类型"],"a":1,"d":"低","e":"KVL 方程中，沿回路绕行方向，支路电压参考方向与绕行方向一致时取正号，相反时取负号。"},{"id":3044,"c":3,"n":44,"code":"03-044","t":"支路电流法","p":"支路电流法适用于（ ）","o":["仅线性电路","仅非线性电路","线性电路和非线性电路均适用","仅含独立源的电路"],"a":2,"d":"中","e":"支路电流法直接基于 KCL 和 KVL，这两个定律对线性电路和非线性电路都适用。对于非线性电路，只需将支路的非线性伏安特性代入 KVL 方程即可。"},{"id":3045,"c":3,"n":45,"code":"03-045","t":"支路电流法","p":"用支路电流法求解电路时，若某支路电流的计算结果为负值，说明（ ）","o":["计算过程一定有错误","该支路电流的实际方向与假设的参考方向相反","该支路电流为零","该支路元件损坏"],"a":1,"d":"低","e":"电流的正负只表示实际方向与参考方向的关系。负值说明实际电流方向与假定的参考方向相反。"},{"id":3046,"c":3,"n":46,"code":"03-046","t":"支路电流法","p":"对于具有 3 个节点、5 条支路的电路，用支路电流法求解时，KCL 方程数和 KVL 方程数分别为（ ）","o":["3 和 2","2 和 3","3 和 5","2 和 5"],"a":1,"d":"低","e":"KCL 方程数= n − 1 = 3 − 1 = 2，KVL 方程数= b − n + 1 = 5 − 3 + 1 = 3。"},{"id":3047,"c":3,"n":47,"code":"03-047","t":"支路电流法","p":"支路电流法中，KCL 方程是依据（ ）列写的","o":["基尔霍夫电压定律","基尔霍夫电流定律","欧姆定律","叠加定理"],"a":1,"d":"低","e":"支路电流法中 KCL 方程依据基尔霍夫电流定律列写，KVL 方程依据基尔霍夫电压定律列写。"},{"id":3048,"c":3,"n":48,"code":"03-048","t":"支路电流法","p":"用支路电流法求解含受控源的电路时，下列处理方法正确的是（ ）","o":["受控源不能出现在电路中","先将受控源的控制量用支路电流表示，再代入方程","将受控源视为独立源处理后不需要补充方程","受控源所在支路的电流不需要求解"],"a":1,"d":"中","e":"用支路电流法求解含受控源的电路时，先将受控源视为独立源列写方程，再将控制量用支路电流表示，代入方程中消去控制量，即可求解。"},{"id":3049,"c":3,"n":49,"code":"03-049","t":"支路电流法","p":"电路有 4 个节点、6 条支路，用支路电流法求解时需要列写的方程总数为（ ）","o":["4 个","6 个","9 个","3 个"],"a":1,"d":"低","e":"（6 − 4 + 1 = 3）。 支路电流法需要b个方程（b条支路对应b个未知电流），即 6 个方程：3 个 KCL 方程（4 − 1 = 3）和 3 个 KVL 方程"},{"id":3050,"c":3,"n":50,"code":"03-050","t":"支路电流法","p":"下列关于支路电流法的说法中，正确的是（ ）","o":["支路电流法只能用于平面电路","支路电流法的方程数与支路数无关","支路电流法直接以支路电流为求解变量","支路电流法不需要列写 KVL 方程"],"a":2,"d":"低","e":"支路电流法直接以支路电流为未知量，适用于平面和非平面电路，需要同时列写 KCL 和 KVL 方程，方程总数为b个。"},{"id":3051,"c":3,"n":51,"code":"03-051","t":"支路电流法","p":"用支路电流法求解电路时，KVL 方程中代入元件 VCR 后，方程中的未知量仍为（ ）","o":["支路电压","支路电流","节点电压","回路电流"],"a":1,"d":"中","e":"支路电流法中，KVL 方程代入元件 VCR（如u = Ri）后，方程中的未知量统一为支路电流，与 KCL 方程中的未知量一致，从而可以联立求解。"},{"id":3052,"c":3,"n":52,"code":"03-052","t":"支路电流法","p":"对于含有理想电流源支路的电路，用支路电流法求解时（ ）","o":["不需要对该支路列写任何方程","该支路的电流已知，可减少一个未知量","该支路的电压已知","需要将该支路从电路中移除"],"a":1,"d":"中","e":"含理想电流源支路时，该支路的电流为已知量（即电流源的电流值），因此可以减少一个未知量，只需列写其余支路的 KCL 和 KVL 方程。"},{"id":3053,"c":3,"n":53,"code":"03-053","t":"支路电流法","p":"支路电流法中的“2b法”是指（ ）","o":["以支路电流和支路电压共2b个变量列写2b个方程的方法","以 2 倍支路电流为变量的方法","两次使用支路电流法的方法","将b条支路分成两组求解的方法"],"a":0,"d":"高","e":"2b法以b条支路的电流和b条支路的电压共2b个量为未知量，需要2b个独立方程：独立的 KCL 方程n − 1个、独立的 KVL 方程b − n + 1个，合计b个，再加上b个支路 VCR 方程，恰好2b个（若把b个 KCL、b个 KVL 和b个 VCR 全部写出，则为 3b个方程，其中独立的只有2b个）。支路电流法是在2b法的基础上消去b个支路电压后得到的方法。"},{"id":3054,"c":3,"n":54,"code":"03-054","t":"支路电流法","p":"用支路电流法求解电路，若电路中有 4 条支路，则需要求解的未知量个数为（ ）","o":["2","4","6","8"],"a":1,"d":"低","e":"支路电流法以b条支路的电流为未知量，因此未知量个数等于支路数b = 4。"},{"id":3055,"c":3,"n":55,"code":"03-055","t":"支路电流法","p":"关于支路电流法 KCL 方程的列写，下列说法正确的是（ ）","o":["应包含所有节点的 KCL 方程","应包含除参考节点外的n − 1个节点的 KCL 方程","应包含b − n + 1个节点的 KCL 方程","KCL 方程可以与 KVL 方程互换"],"a":1,"d":"低","e":"支路电流法中 KCL 方程应包含n − 1个独立节点的方程，对应除参考节点外的其余节点。KCL 和 KVL 方程不能互换， 它们分别基于不同的物理定律。"},{"id":3056,"c":3,"n":56,"code":"03-056","t":"网孔电流法","p":"网孔电流法基于（ ）","o":["基尔霍夫电流定律","基尔霍夫电压定律","置换定理","戴维南定理"],"a":1,"d":"低","e":"网孔电流法以网孔电流为未知量，对每个网孔列写 KVL 方程，因此基于基尔霍夫电压定律。"},{"id":3057,"c":3,"n":57,"code":"03-057","t":"网孔电流法","p":"网孔电流法适用于（ ）","o":["仅平面电路","仅非平面电路","平面电路和非平面电路均适用","仅含独立源的电路"],"a":0,"d":"低","e":"网孔是平面电路特有的概念，网孔电流法仅适用于平面电路。对于非平面电路，可以用回路电流法。"},{"id":3058,"c":3,"n":58,"code":"03-058","t":"网孔电流法","p":"对于一个具有n个节点、b条支路的平面电路，用网孔电流法求解时需要列写（ ）","o":["n − 1个 KCL 方程","b − n − 1个 KVL 方程","n − 1个 KVL 方程","b − n + 1个 KVL 方程"],"a":3,"d":"低","e":"网孔电流法以网孔电流为未知量，指定各网孔的绕行方向，根据 KVL 列出b − (n − 1)个网孔的 KVL 方程，即b − n + 1个方程。"},{"id":3059,"c":3,"n":59,"code":"03-059","t":"网孔电流法","p":"关于网孔电流法的自阻和互阻，下列说法正确的是（ ）","o":["自阻是网孔本身的电阻之和，恒为正","自阻可正可负","互阻恒为正","互阻恒为负"],"a":0,"d":"中","e":"自阻是网孔中所有电阻的总和，恒为正。互阻是两个相邻网孔之间的公共电阻，其符号取决于两网孔电流通过公共电阻的方向：方向相同时互阻为正，方向相反时为负。"},{"id":3060,"c":3,"n":60,"code":"03-060","t":"网孔电流法","p":"在网孔电流法中，当所有网孔电流均取顺时针（或逆时针）方向时，互阻（ ）","o":["恒为正","恒为负","可正可负","恒为零"],"a":1,"d":"中","e":"当所有网孔电流均取同一绕行方向时，相邻网孔在公共电阻上的电流方向总是相反的，因此互阻均为负。"},{"id":3061,"c":3,"n":61,"code":"03-061","t":"网孔电流法","p":"对于具有 4 个网孔的电路，用网孔电流法求解时需要列写的方程数为（ ）","o":["2","3","4","5"],"a":2,"d":"低","e":"网孔电流法需要列写的方程数等于网孔数（独立回路数），4 个网孔需要列写 4 个 KVL 方程。"},{"id":3062,"c":3,"n":62,"code":"03-062","t":"网孔电流法","p":"关于网孔电流法，下列叙述中错误的是（ ）","o":["自电阻是网孔本身的电阻之和，恒为正","互电阻是网孔之间的电阻之和，根据网孔电流的方向有正、负之分","网孔电流法只适用于平面电路","网孔电流自动满足 KVL"],"a":3,"d":"高","e":"网孔电流沿网孔边界连续流动，在任一节点处流入与流出的网孔电流自动平衡，因此网孔电流自动满足 KCL；网孔方程本身正是依据 KVL 列写的，所以“网孔电流自动满足 KVL”的说法错误。A、B、C三项均正确，答案选D。"},{"id":3063,"c":3,"n":63,"code":"03-063","t":"网孔电流法","p":"在网孔电流法中，网孔电流自动满足的定律是（ ）","o":["KVL","KCL","欧姆定律","叠加定理"],"a":1,"d":"中","e":"网孔电流是沿网孔边界连续流动的假想电流，对每个节点而言，流入和流出的网孔电流自动平衡，因此网孔电流自动满足 KCL。这正是网孔电流法不需要列写 KCL 方程的原因。"},{"id":3064,"c":3,"n":64,"code":"03-064","t":"网孔电流法","p":"在网孔电流法中，各网孔电流的绕行方向（ ）","o":["必须全部为顺时针","可以任意假定","必须全部为逆时针","必须与外电路电流方向一致"],"a":1,"d":"低","e":"各网孔电流的绕行方向可以任意假定，通常为了便于计算，将所有网孔电流统一取顺时针或逆时针方向，使得互阻为负。"},{"id":3065,"c":3,"n":65,"code":"03-065","t":"网孔电流法","p":"用网孔电流法求解电路时，若电路有 3 个网孔，则需要列写的 KVL 方程数为（ ）","o":["1","2","3","4"],"a":2,"d":"低","e":"网孔电流法的方程数等于网孔数，3 个网孔需要列写 3 个 KVL 方程。"},{"id":3066,"c":3,"n":66,"code":"03-066","t":"网孔电流法","p":"在网孔电流方程中，等号右端的电压项表示（ ）","o":["网孔中各电压源电压的代数和","网孔中各电阻上电压的代数和","网孔电流在该网孔中产生的电压","相邻网孔对该网孔的影响"],"a":0,"d":"中","e":"网孔电流方程标准形式中，等号右端的电压项是网孔中各电压源电压的代数和，电压源电压方向与网孔绕行方向一致时取负号，相反时取正号。"},{"id":3067,"c":3,"n":67,"code":"03-067","t":"网孔电流法","p":"网孔电流法相对于支路电流法的优势是（ ）","o":["适用于非平面电路","方程数减少n − 1个","可以求解非线性电路","不需要列写 KVL 方程"],"a":1,"d":"中","e":"网孔电流法的方程数等于网孔数（b − n + 1），比支路电流法的b个方程减少了n − 1个，因此求解更为简便。"},{"id":3068,"c":3,"n":68,"code":"03-068","t":"网孔电流法","p":"关于网孔电流法的适用范围，下列说法正确的是（ ）","o":["只能用于含独立源的电路","只能用于线性电路","可用于平面电路","可用于所有电路"],"a":2,"d":"低","e":"网孔电流法仅适用于平面电路，因为网孔是平面电路特有的概念。对于非平面电路，需要用回路电流法。"},{"id":3069,"c":3,"n":69,"code":"03-069","t":"网孔电流法","p":"在网孔电流法中，若两个网孔之间没有公共电阻，则它们之间的互阻为（ ）","o":["正数","负数","零","无穷大"],"a":2,"d":"低","e":"互阻是两个相邻网孔之间的公共电阻，若两网孔没有公共电阻，则互阻为零。"},{"id":3070,"c":3,"n":70,"code":"03-070","t":"网孔电流法","p":"用网孔电流法求解电路时，网孔电流方程中的自阻项系数（ ）","o":["可正可负","恒为正","恒为负","恒为零"],"a":1,"d":"低","e":"自阻是该网孔中所有电阻的总和，由于电阻恒为正，自阻恒为正数。"},{"id":3071,"c":3,"n":71,"code":"03-071","t":"网孔电流法","p":"对于一个具有 3 个网孔的平面电路，若网孔电流分别为i1、i2、i3，且公共电阻上的电流方向均相同，则互阻R12（ ）","o":["恒为正","恒为负","为零","无法确定"],"a":0,"d":"中","e":"若两网孔电流通过公共电阻的方向相同，则互阻为正。但通常为了简化计算，将所有网孔电流取同一绕行方向，此时互阻为负。"},{"id":3072,"c":3,"n":72,"code":"03-072","t":"网孔电流法","p":"关于网孔电流法方程的一般形式，下列说法正确的是（ ）","o":["系数矩阵为非对称矩阵","当所有网孔电流取同一绕行方向时，系数矩阵为对称矩阵","系数矩阵中自阻为负","方程数与支路数相等"],"a":1,"d":"中","e":"对于无受控源的线性电阻电路，当所有网孔电流取同一绕行方向时，Rjk= Rkj，系数矩阵为对称矩阵。"},{"id":3073,"c":3,"n":73,"code":"03-073","t":"网孔电流法","p":"用网孔电流法求解含受控源的电路时，正确的处理方法是（ ）","o":["受控源不能出现在网孔电流法中","先将受控源视为独立源列写方程，再将控制量用网孔电流表示并代入","受控源不需要补充方程","将受控源所在网孔从电路中移除"],"a":1,"d":"中","e":"网孔电流法处理受控源时，先将受控源当作独立源列写方程，然后补充将控制量用网孔电流表示的方程，代入消去控制量。"},{"id":3074,"c":3,"n":74,"code":"03-074","t":"网孔电流法","p":"网孔电流法中的网孔电流是（ ）","o":["实际存在于电路中的物理电流","沿网孔边界流动的假想电流","支路电流的代数和","节点电压的线性组合"],"a":1,"d":"低","e":"网孔电流是假想的沿网孔边界连续流动的电流，不是实际存在于电路中的物理电流。实际支路电流可以通过网孔电流的代数和求得。"},{"id":3075,"c":3,"n":75,"code":"03-075","t":"网孔电流法","p":"对于一个具有 5 个节点、8 条支路的平面电路，网孔数为（ ）","o":["3","4","5","8"],"a":1,"d":"低","e":"平面电路的网孔数等于独立回路数b − n + 1 = 8 − 5 + 1 = 4。"},{"id":3076,"c":3,"n":76,"code":"03-076","t":"回路电流法","p":"回路电流法与网孔电流法的主要区别是（ ）","o":["回路电流法只适用于平面电路","回路电流法适用于平面和非平面电路","回路电流法不需要列写 KVL 方程","回路电流法以节点电压为未知量"],"a":1,"d":"低","e":"回路电流法以基本回路中的回路电流为未知量，适用于平面和非平面电路，而网孔电流法仅适用于平面电路。"},{"id":3077,"c":3,"n":77,"code":"03-077","t":"回路电流法","p":"回路电流法是对独立回路列写（ ）方程","o":["KCL","KVL","VCR","功率"],"a":1,"d":"低","e":"回路电流法对独立回路列写 KVL 方程，方程数为b − n + 1，与网孔电流法相同。"},{"id":3078,"c":3,"n":78,"code":"03-078","t":"回路电流法","p":"回路电流法相对于支路电流法，方程数减少了（ ）","o":["b个","n − 1个","b − n + 1个","n个"],"a":1,"d":"中","e":"支路电流法需要b个方程，回路电流法需要b − n + 1个方程，减少了n − 1个方程。"},{"id":3079,"c":3,"n":79,"code":"03-079","t":"回路电流法","p":"关于回路电流法，下列说法正确的是（ ）","o":["回路电流法是只运用基尔霍夫电压定律的求解方法","回路电流法需要同时列写 KCL 和 KVL 方程","回路电流法以支路电流为未知量","回路电流法只适用于线性电路"],"a":0,"d":"中","e":"回路电流法以回路电流为未知量，对独立回路列写 KVL 方程，是只运用基尔霍夫电压定律的求解方法，KCL 自动满足。"},{"id":3080,"c":3,"n":80,"code":"03-080","t":"回路电流法","p":"用回路电流法求解电路时，回路电流自动满足的定律是（ ）","o":["KVL","KCL","欧姆定律","功率守恒"],"a":1,"d":"低","e":"回路电流沿回路连续流动，对每个节点而言，流入和流出的回路电流自动平衡，因此回路电流自动满足 KCL。"},{"id":3081,"c":3,"n":81,"code":"03-081","t":"回路电流法","p":"回路电流法中，回路电流的参考方向可以（ ）","o":["只能取顺时针","只能取逆时针","任意假定","必须与支路电流方向一致"],"a":2,"d":"低","e":"回路电流的参考方向可以任意假定，与网孔电流法类似，不同的参考方向选择不会影响最终结果的正确性。"},{"id":3082,"c":3,"n":82,"code":"03-082","t":"回路电流法","p":"用回路电流法求解电路时，若电路有b条支路、n个节点，则需要列写的方程数为（ ）","o":["b个","n − 1个","b − n + 1个","n个"],"a":2,"d":"低","e":"回路电流法需要列写b − n + 1个 KVL 方程，对应独立回路数。"},{"id":3083,"c":3,"n":83,"code":"03-083","t":"回路电流法","p":"回路电流法中的自阻是（ ）","o":["回路中所有电阻之和，恒为正","回路中所有电阻之和，可正可负","相邻回路之间的公共电阻","回路中电压源的内阻"],"a":0,"d":"低","e":"自阻是回路中所有电阻的总和，由于电阻恒为正，自阻恒为正数。"},{"id":3084,"c":3,"n":84,"code":"03-084","t":"回路电流法","p":"关于回路电流法中的互阻，下列说法正确的是（ ）","o":["互阻恒为正","互阻为相邻回路的公共电阻，符号取决于回路电流通过公共电阻的方向","互阻恒为负","互阻与回路电流方向无关"],"a":1,"d":"中","e":"互阻是相邻回路之间的公共电阻，其符号取决于两回路电流通过公共电阻的方向关系：方向相同时为正，相反时为负。"},{"id":3085,"c":3,"n":85,"code":"03-085","t":"回路电流法","p":"回路电流法适用于（ ）","o":["仅平面电路","仅非平面电路","平面电路和非平面电路","仅含独立源的电路"],"a":2,"d":"低","e":"回路电流法以独立回路电流为未知量，独立回路可以是基本回路，适用于平面电路和非平面电路。"},{"id":3086,"c":3,"n":86,"code":"03-086","t":"回路电流法","p":"在回路电流法中，若两个回路没有公共支路，则互阻为（ ）","o":["正数","负数","零","无穷大"],"a":2,"d":"低","e":"若两回路没有公共支路，则没有公共电阻，互阻为零。"},{"id":3087,"c":3,"n":87,"code":"03-087","t":"回路电流法","p":"回路电流法与网孔电流法相比，其方程数（ ）","o":["更多","更少","相同","无法比较"],"a":2,"d":"低","e":"回路电流法和网孔电流法的方程数都等于独立回路数b − n + 1，因此在同一电路中方程数相同。"},{"id":3088,"c":3,"n":88,"code":"03-088","t":"回路电流法","p":"用回路电流法求解含受控源的电路时，正确的处理方法是（ ）","o":["受控源不能出现在回路电流法中","先将受控源视为独立源列写方程，再补充控制量与回路电流的关系方程","受控源不需要补充方程","将受控源从电路中移除"],"a":1,"d":"中","e":"与网孔电流法类似，回路电流法处理受控源时，先将受控源当作独立源列写方程，再补充控制量用回路电流表示的方程，代入消去控制量。"},{"id":3089,"c":3,"n":89,"code":"03-089","t":"节点电压法","p":"节点电压法基于（ ）","o":["戴维南定理","诺顿定理","基尔霍夫电压定律","基尔霍夫电流定律"],"a":3,"d":"低","e":"节点电压法以节点电压为未知量，对独立节点列写 KCL 方程，因此基于基尔霍夫电流定律。"},{"id":3090,"c":3,"n":90,"code":"03-090","t":"节点电压法","p":"必须设立电路参考点后才能求解电路的方法是（ ）","o":["支路电流法","回路电流法","节点电压法","2b法"],"a":2,"d":"低","e":"节点电压法需要选取一个参考节点（零电位点），其余节点的电压都是相对于参考节点的电压，因此必须先设立参考点才能求解。"},{"id":3091,"c":3,"n":91,"code":"03-091","t":"节点电压法","p":"用节点电压法求解电路时，参考节点通常取（ ）","o":["电压最高的节点","连接支路最多的节点","任意一个节点，通常取接地节点","电压源的正极节点"],"a":2,"d":"低","e":"参考节点可以任意选取，通常选择接地节点或连接支路最多的节点，以便于列写方程。参考节点的电位规定为零。"},{"id":3092,"c":3,"n":92,"code":"03-092","t":"节点电压法","p":"对于一个具有n个节点的电路，用节点电压法求解时需要列写的方程数为（ ）","o":["n","n − 1","b − n + 1","b"],"a":1,"d":"低","e":"节点电压法以除参考节点外的n − 1个节点电压为未知量，对n − 1个独立节点列写 KCL 方程。"},{"id":3093,"c":3,"n":93,"code":"03-093","t":"节点电压法","p":"节点电压法中的自导是（ ）","o":["与节点相连的所有支路电阻之和","与节点相连的所有支路电导之和，恒为正","相邻节点之间的互导","与节点相连的电压源个数"],"a":1,"d":"中","e":"自导是连接到该节点的所有支路电导之和，由于电导恒为正，自导恒为正数。"},{"id":3094,"c":3,"n":94,"code":"03-094","t":"节点电压法","p":"节点电压法中的互导是（ ）","o":["两节点之间公共支路的电导，恒为负","两节点之间公共支路的电导，恒为正","两节点之间公共支路的电导，符号可正可负","两节点之间公共支路的电阻"],"a":0,"d":"中","e":"互导是两个节点之间公共支路的电导，由于节点电压方程中互导项前带负号，因此互导（在方程中）恒为负。"},{"id":3095,"c":3,"n":95,"code":"03-095","t":"节点电压法","p":"用节点电压法求解电路时，若电路中有无伴电压源，正确的处理方法是（ ）","o":["将电压源视为电流源","设电压源的一端为参考节点，或增设电流为未知量","将电压源从电路中移除","电压源不需要特殊处理"],"a":1,"d":"高","e":"含无伴电压源时，可将电压源的一端选为参考节点，使另一端电压已知；或设电压源电流为未知量，补充电压约束方程。"},{"id":3096,"c":3,"n":96,"code":"03-096","t":"节点电压法","p":"节点电压法适用于（ ）","o":["仅平面电路","仅非平面电路","平面电路和非平面电路均适用","仅含独立源的电路"],"a":2,"d":"低","e":"节点电压法基于 KCL，对任何电路拓扑结构都适用，不受平面/非平面限制。"},{"id":3097,"c":3,"n":97,"code":"03-097","t":"节点电压法","p":"对于具有 4 个节点、6 条支路的电路，用节点电压法求解时需要列写的方程数为（ ）","o":["3","4","6","5"],"a":0,"d":"低","e":"节点电压法需要列写n − 1 = 4 − 1 = 3个 KCL 方程。"},{"id 的分析","p":"电阻、电感串联电路的电压相量图通常构成（ ）","o":["直角三角形","等边三角形","圆形","直线"],"a":0,"d":"中","e":"电阻电压与电感电压相位相差九十度，合成电压构成直角三角形。"},{"id":9035,"c":9,"n":35,"code":"09-035","t":"正弦稳态电路的分析","p":"阻抗三角形与电压三角形之间的关系是（ ）","o":["完全无关","相似","互为倒数","方向相反"],"a":1,"d":"中","e":"在电流相同的串联电路中，电压三角形各边除以电流即得到阻抗三角形，二者相似。"},{"id":9036,"c":9,"n":36,"code":"09-036","t":"正弦稳态电路的分析","p":"相量法主要适用于哪类电路（ ）？","o":["非线性时变电路","线性正弦稳态电路","直流暂态电路","任意非正弦电路"],"a":1,"d":"低","e":"相量法用于线性电路在单一频率正弦激励下的稳态分析。"},{"id":9037,"c":9,"n":37,"code":"09-037","t":"正弦稳态电路的分析","p":"不同频率的两个正弦量能否画在同一相量图中进行相量加减（ ）？","o":["能，且与频率无关","不能，因为相量旋转速度不同","能，只要有效值相同","能，只要初相位相同"],"a":1,"d":"中","e":"不同频率正弦量的相量相对旋转速度不同，不能直接用同一相量图做加减。"},{"id":9038,"c":9,"n":38,"code":"09-038","t":"正弦稳态电路的分析","p":"在单一频率正弦激励的线性稳态电路中，各支路电压和电流的频率关系是（ ）","o":["各不相同","都与电源频率相同","都是电源频率的两倍","都是电源频率的一半"],"a":1,"d":"低","e":"线性正弦稳态电路中，各电压电流均为与激励同频率的正弦量。"},{"id":9039,"c":9,"n":39,"code":"09-039","t":"正弦稳态电路的分析","p":"相量形式的基尔霍夫电压定律表明，回路中各电压相量的关系是（ ）","o":["代数和为零","算术和为零","有效值和为零","最大值和为零"],"a":0,"d":"低","e":"正弦稳态中，回路各电压相量的代数和为零。"},{"id":9040,"c":9,"n":40,"code":"09-040","t":"正弦稳态电路的分析","p":"用节点法分析正弦稳态电路时，通常建立的是哪类方程（ ）？","o":["电流相量方程","电压瞬时值方程","功率方程","磁通方程"],"a":0,"d":"中","e":"节点法以节点电压相量为未知量，列写电流相量方程。"},{"id":9041,"c":9,"n":41,"code":"09-041","t":"正弦稳态电路的分析","p":"用网孔法分析正弦稳态电路时，通常建立的是哪类方程（ ）？","o":["电压相量方程","电流瞬时值方程","功率方程","电荷方程"],"a":0,"d":"中","e":"网孔法以网孔电流相量为未知量，列写电压相量方程。"},{"id":9042,"c":9,"n":42,"code":"09-042","t":"正弦稳态电路的分析","p":"叠加定理在正弦稳态相量分析中适用的条件是（ ）","o":["线性电路","非线性电路","时变电路","任意电路"],"a":0,"d":"低","e":"叠加定理只适用于线性电路，正弦稳态线性电路可用相量形式叠加。"},{"id":9043,"c":9,"n":43,"code":"09-043","t":"正弦稳态电路的分析","p":"正弦稳态电路的戴维南等效电路包括（ ）","o":["一个电压源和一个阻抗","一个电流源和一个导纳","两个电压源","两个电容"],"a":0,"d":"低","e":"戴维南等效为一个开路电压相量源与一个等效阻抗串联。"},{"id":9044,"c":9,"n":44,"code":"09-044","t":"正弦稳态电路的分析","p":"正弦稳态电路的诺顿等效电路包括（ ）","o":["一个电流源和一个导纳","一个电压源和一个阻抗","两个电流源","两个电感"],"a":0,"d":"低","e":"诺顿等效为一个短路电流相量源与一个等效导纳并联。"},{"id":9045,"c":9,"n":45,"code":"09-045","t":"正弦稳态电路的分析","p":"相量法把正弦稳态电路中的微分方程转化为（ ）","o":["代数方程","高阶微分方程","积分方程","差分方程"],"a":0,"d":"中","e":"通过相量表示，电感和电容的微分关系变为代数关系。"},{"id":9046,"c":9,"n":46,"code":"09-046","t":"正弦稳态电路的分析","p":"电感电压相量超前电流相量九十度，说明电感对电流变化的反应是（ ）","o":["阻止电流突变","阻止电压突变","不储存能量","只消耗有功"],"a":0,"d":"中","e":"电感储存磁场能量，电流不能突变，因此电压超前电流。"},{"id":9047,"c":9,"n":47,"code":"09-047","t":"正弦稳态电路的分析","p":"电容电流相量超前电压相量九十度，说明电容对电压变化的反应是（ ）","o":["阻止电压突变","阻止电流突变","不储存能量","只消耗有功"],"a":0,"d":"中","e":"电容储存电场能量，电压不能突变，因此电流超前电压。"},{"id":9048,"c":9,"n":48,"code":"09-048","t":"正弦稳态电路的分析","p":"两个阻抗串联后的等效阻抗等于各阻抗相量之和，这是因为串联时（ ）","o":["电流相同","电压相同","功率相同","频率相同"],"a":0,"d":"低","e":"串联各元件电流相同，总电压相量等于各元件电压相量之和。"},{"id":9049,"c":9,"n":49,"code":"09-049","t":"正弦稳态电路的分析","p":"两个导纳并联后的等效导纳等于各导纳之和，这是因为并联时（ ）","o":["电压相同","电流相同","功率相同","频率相同"],"a":0,"d":"低","e":"并联各支路电压相同，总电流相量等于各支路电流相量之和。"},{"id":9050,"c":9,"n":50,"code":"09-050","t":"正弦稳态电路的分析","p":"若某无源二端网络的等效阻抗为纯虚数且为正，则该网络等效为（ ）","o":["电阻","电感","电容","负电阻"],"a":1,"d":"中","e":"正虚部阻抗表示感性，等效为电感性质。"},{"id":9051,"c":9,"n":51,"code":"09-051","t":"正弦稳态电路的分析","p":"功率因数通常定义为什么的比值（ ）？","o":["有功功率与视在功率之比","无功功率与有功功率之比","视在功率与有功功率之比","无功功率与视在功率之比"],"a":0,"d":"低","e":"功率因数是有功功率与视在功率的比值，反映有功利用程度。"},{"id":9052,"c":9,"n":52,"code":"09-052","t":"正弦稳态电路的分析","p":"有功功率的单位是（ ）","o":["瓦","乏","伏安","焦耳"],"a":0,"d":"低","e":"有功功率表示实际消耗或转换的功率，单位为瓦。"},{"id":9053,"c":9,"n":53,"code":"09-053","t":"正弦稳态电路的分析","p":"无功功率的单位是（ ）","o":["瓦","乏","伏安","焦耳"],"a":1,"d":"低","e":"无功功率表示储能元件与电源间能量交换的规模，单位为乏。"},{"id":9054,"c":9,"n":54,"code":"09-054","t":"正弦稳态电路的分析","p":"视在功率的单位是（ ）","o":["瓦","乏","伏安","焦耳"],"a":2,"d":"低","e":"视在功率为电压有效值与电流有效值的乘积，单位为伏安。"},{"id":9055,"c":9,"n":55,"code":"09-055","t":"正弦稳态电路的分析","p":"电阻元件在正弦稳态中消耗的功率主要是（ ）","o":["有功功率","无功功率","视在功率","复功率的虚部"],"a":0,"d":"低","e":"电阻将电能转化为热能，消耗有功功率。"},{"id":9056,"c":9,"n":56,"code":"09-056","t":"正弦稳态电路的分析","p":"理想电感元件在正弦稳态中的平均功率为（ ）","o":["正有功","负有功","零","视在功率"],"a":2,"d":"低","e":"理想电感不消耗有功，只与电源交换无功，平均功率为零。"},{"id":9057,"c":9,"n":57,"code":"09-057","t":"正弦稳态电路的分析","p":"理想电容元件在正弦稳态中的平均功率为（ ）","o":["正有功","负有功","零","视在功率"],"a":2,"d":"低","e":"理想电容不消耗有功，只与电源交换无功，平均功率为零。"},{"id":9058,"c":9,"n":58,"code":"09-058","t":"正弦稳态电路的分析","p":"感性电路的无功功率通常取什么符号（ ）？","o":["正号","负号","零","不确定"],"a":0,"d":"中","e":"按常见约定，感性无功功率为正，表示电感吸收无功。"},{"id":9059,"c":9,"n":59,"code":"09-059","t":"正弦稳态电路的分析","p":"容性电路的无功功率通常取什么符号（ ）？","o":["正号","负号","零","不确定"],"a":1,"d":"中","e":"按常见约定，容性无功功率为负，表示电容发出无功。"},{"id":9060,"c":9,"n":60,"code":"09-060","t":"正弦稳态电路的分析","p":"视在功率等于什么（ ）？","o":["电压有效值与电流有效值的乘积","电压最大值与电流最大值的乘积","有功功率与无功功率之和","有功功率与功率因数之和"],"a":0,"d":"低","e":"视在功率表示设备容量，等于电压有效值与电流有效值的乘积。"},{"id":9061,"c":9,"n":61,"code":"09-061","t":"正弦稳态电路的分析","p":"功率因数角通常等于（ ）","o":["电压与电流的相位差","电压与电流的初相位之和","阻抗角的两倍","频率与相位之差"],"a":0,"d":"中","e":"功率因数角是电压与电流的相位差，也等于等效阻抗角。"},{"id":9062,"c":9,"n":62,"code":"09-062","t":"正弦稳态电路的分析","p":"功率因数过低的主要危害是（ ）","o":["线路电流增大，损耗增加","电源频率下降","电压频率升高","电阻消失"],"a":0,"d":"中","e":"功率因数低时，为输送同样有功需要更大电流，导致线路损耗增加。"},{"id":9063,"c":9,"n":63,"code":"09-063","t":"正弦稳态电路的分析","p":"提高感性负载功率因数常用的方法是（ ）","o":["并联电容","串联电容","并联电阻","串联电阻"],"a":0,"d":"低","e":"并联电容可提供容性无功，补偿感性无功，提高功率因数。"},{"id":9064,"c":9,"n":64,"code":"09-064","t":"正弦稳态电路的分析","p":"在感性负载两端并联电容后，负载本身消耗的有功功率（ ）","o":["增大","减小","不变","变为零"],"a":2,"d":"中","e":"并联电容只改变无功分布，不改变负载电阻消耗的有功功率。"},{"id":9065,"c":9,"n":65,"code":"09-065","t":"正弦稳态电路的分析","p":"在感性负载两端并联电容后，电源提供的总无功功率通常（ ）","o":["增大","减小","不变","变为纯感性"],"a":1,"d":"中","e":"电容提供容性无功，抵消部分感性无功，使电源提供的总无功减小。"},{"id":9066,"c":9,"n":66,"code":"09-066","t":"正弦稳态电路的分析","p":"正弦稳态电路中，瞬时功率的变化频率通常是电源频率的（ ）","o":["一半","相同","两倍","四倍"],"a":2,"d":"中","e":"电压与电流均为正弦量，其乘积的瞬时功率以两倍电源频率变化。"},{"id":9067,"c":9,"n":67,"code":"09-067","t":"正弦稳态电路的分析","p":"平均功率可以理解为什么（ ）？","o":["瞬时功率在一个周期内的平均值","瞬时功率的最大值","瞬时功率的最小值","瞬时功率的绝对值"],"a":0,"d":"低","e":"平均功率是有功功率，等于瞬时功率在一个周期内的平均值。"},{"id":9068,"c":9,"n":68,"code":"09-068","t":"正弦稳态电路的分析","p":"无功功率主要反映什么（ ）？","o":["电阻消耗的能量","储能元件与电源之间的能量交换","电源发出的总能量","线路电阻的温度"],"a":1,"d":"中","e":"无功功率表示电感、电容等储能元件与电源之间往复交换能量的规模。"},{"id":9069,"c":9,"n":69,"code":"09-069","t":"正弦稳态电路的分析","p":"视在功率主要反映什么（ ）？","o":["设备容量或电压电流乘积规模","电阻消耗的有功","电感储存的磁场能","电容储存的电场能"],"a":0,"d":"中","e":"视在功率等于电压有效值与电流有效值乘积，常用于表示电气设备容量。"},{"id":9070,"c":9,"n":70,"code":"09-070","t":"正弦稳态电路的分析","p":"功率三角形中，有功功率、无功功率和视在功率的关系是（ ）","o":["构成直角三角形","构成等边三角形","构成圆形","没有几何关系"],"a":0,"d":"中","e":"有功功率为邻边，无功功率为对边，视在功率为斜边，构成功率三角形。"},{"id":9071,"c":9,"n":71,"code":"09-071","t":"正弦稳态电路的分析","p":"复功率通常定义为什么（ ）？","o":["电压相量与电流相量共轭的乘积","电压相量与电流相量的乘积","电压有效值与电流有效值之和","有功功率与功率因数之和"],"a":0,"d":"中","e":"复功率由电压相量乘以电流相量的共轭得到，可同时表示有功和无功。"},{"id":9072,"c":9,"n":72,"code":"09-072","t":"正弦稳态电路的分析","p":"复功率的实部对应（ ）","o":["有功功率","无功功率","视在功率","功率因数"],"a":0,"d":"中","e":"复功率的实部为有功功率，表示实际消耗或转换的功率。"},{"id":9073,"c":9,"n":73,"code":"09-073","t":"正弦稳态电路的分析","p":"复功率的虚部对应（ ）","o":["有功功率","无功功率","视在功率","功率因数"],"a":1,"d":"中","e":"复功率的虚部为无功功率，表示储能元件与电源交换的功率规模。"},{"id":9074,"c":9,"n":74,"code":"09-074","t":"正弦稳态电路的分析","p":"复功率的模对应（ ）","o":["有功功率","无功功率","视在功率","功率因数"],"a":2,"d":"中","e":"复功率的模为视在功率，表示电压有效值与电流有效值的乘积。"},{"id":9075,"c":9,"n":75,"code":"09-075","t":"正弦稳态电路的分析","p":"复功率的辐角对应（ ）","o":["功率因数角","电源频率","阻抗模","导纳模"],"a":0,"d":"中","e":"复功率的辐角等于电压与电流的相位差，即功率因数角。"},{"id":9076,"c":9,"n":76,"code":"09-076","t":"正弦稳态电路的分析","p":"复功率守恒说明，电路中各支路复功率之和与总复功率的关系是（ ）","o":["总复功率等于各支路复功率之和","总复功率等于各支路复功率之差","总复功率等于各支路视在功率之和","没有关系"],"a":0,"d":"中","e":"复功率满足守恒关系，电源提供的总复功率等于各支路吸收复功率之和。"},{"id":9077,"c":9,"n":77,"code":"09-077","t":"正弦稳态电路的分析","p":"有功功率在电路中是否满足守恒关系（ ）？","o":["满足","不满足","只对纯电阻满足","只对纯电感满足"],"a":0,"d":"低","e":"有功功率表示实际能量转换，电路中电源提供的有功等于各元件消耗的有功之和。"},{"id":9078,"c":9,"n":78,"code":"09-078","t":"正弦稳态电路的分析","p":"无功功率在电路中是否满足守恒关系（ ）？","o":["满足","不满足","只对纯电阻满足","只对纯电容满足"],"a":0,"d":"中","e":"无功功率也满足守恒关系，电源提供的无功等于各储能元件吸收或发出的无功代数和。"},{"id":9079,"c":9,"n":79,"code":"09-079","t":"正弦稳态电路的分析","p":"视在功率在电路中一般是否满足直接相加守恒（ ）？","o":["一般满足","一般不满足","总是满足","只对感性满足"],"a":1,"d":"高","e":"视在功率不是相量，不能简单代数相加，通常不满足直接相加守恒。"},{"id":9080,"c":9,"n":80,"code":"09-080","t":"正弦稳态电路的分析","p":"复功率的单位通常采用（ ）","o":["瓦","乏","伏安","焦耳"],"a":2,"d":"低","e":"复功率的模为视在功率，因此单位通常用伏安表示。"},{"id":9081,"c":9,"n":81,"code":"09-081","t":"正弦稳态电路的分析","p":"正弦稳态电路中，负载获得最大有功功率的条件通常是（ ）","o":["负载阻抗等于电源内阻抗","负载阻抗等于电源内阻抗的共轭","负载电阻等于电源内电阻的两倍","负载阻抗为零"],"a":1,"d":"中","e":"共轭匹配时，负载阻抗与电源内阻抗的共轭相等，负载获得最大有功功率。"},{"id":9082,"c":9,"n":82,"code":"09-082","t":"正弦稳态电路的分析","p":"共轭匹配时，负载获得的是什么功率最大（ ）？","o":["有功功率","无功功率","视在功率","复功率的虚部"],"a":0,"d":"中","e":"共轭匹配的目的是使负载获得最大有功功率。"},{"id":9083,"c":9,"n":83,"code":"09-083","t":"正弦稳态电路的分析","p":"共轭匹配时，电源的效率是否一定很高（ ）？","o":["一定很高","不一定高","一定为百分之百","一定为零"],"a":1,"d":"中","e":"最大功率传输追求负载功率最大，不保证电源效率最高，电力系统通常不采用这种状态。"},{"id":9084,"c":9,"n":84,"code":"09-084","t":"正弦稳态电路的分析","p":"若电源内阻抗为感性，则实现共轭匹配时负载应呈（ ）","o":["感性且相等","容性且电抗相互抵消","纯电阻且为零","纯感性且无穷大"],"a":1,"d":"高","e":"共轭匹配要求负载电抗与电源内阻抗电抗相反，因此电源内阻抗为感性时负载应呈容性。"},{"id":9085,"c":9,"n":85,"code":"09-085","t":"正弦稳态电路的分析","p":"若电源内阻抗为纯电阻，则负载获得最大有功功率时，负载阻抗应为（ ）","o":["纯电阻且等于电源内电阻","纯电容且等于电源内电阻","纯电感且等于电源内电阻","短路"],"a":0,"d":"中","e":"电源内阻抗为纯电阻时，其共轭仍为同一纯电阻，因此负载应取相同纯电阻。"},{"id":9086,"c":9,"n":86,"code":"09-086","t":"正弦稳态电路的分析","p":"在共轭匹配状态下，负载的无功功率与电源内阻抗的无功功率关系是（ ）","o":["相互抵消","完全相同","都为零","都为正"],"a":0,"d":"高","e":"共轭匹配使负载电抗与电源内电抗相反，二者无功作用相互抵消。"},{"id":9087,"c":9,"n":87,"code":"09-087","t":"正弦稳态电路的分析","p":"最大功率传输定理在电力系统中通常不采用，主要原因是为了（ ）","o":["提高效率","增大频率","减小电压","增大无功"],"a":0,"d":"中","e":"电力系统强调高效率和经济运行，最大功率传输时效率往往不高。"},{"id":9088,"c":9,"n":88,"code":"09-088","t":"正弦稳态电路的分析","p":"最大功率传输定理常用于哪类场合（ ）？","o":["通信和电子小信号电路","高压远距离输电","发电厂主接线","大功率电动机启动"],"a":0,"d":"中","e":"通信和电子电路中常希望负载获得最大信号功率，因此常用共轭匹配。"},{"id":9089,"c":9,"n":89,"code":"09-089","t":"正弦稳态电路的分析","p":"共轭匹配时，负载电流通常会怎样变化（ ）？","o":["可能较大","一定为零","一定很小","与匹配无关"],"a":0,"d":"中","e":"为了获得最大有功功率，负载电流可能较大，因此电源负担也会增加。"},{"id":9090,"c":9,"n":90,"code":"09-090","t":"正弦稳态电路的分析","p":"复功率定义中使用电流相量的共轭，主要目的是（ ）","o":["使复功率的辐角为电压相位减电流相位","使复功率变为实数","使无功功率消失","使视在功率为零"],"a":0,"d":"高","e":"采用电流共轭后，复功率的辐角正好等于电压与电流的相位差。"},{"id":9091,"c":9,"n":91,"code":"09-091","t":"正弦稳态电路的分析","p":"感性负载并联电容进行功率因数校正后，电源提供的总电流通常（ ）","o":["增大","减小","不变","变为零"],"a":1,"d":"中","e":"功率因数提高后，输送同样有功所需电流减小，因此总电流通常减小。"},{"id":9092,"c":9,"n":92,"code":"09-092","t":"正弦稳态电路的分析","p":"功率因数校正后，线路上的有功损耗通常（ ）","o":["增大","减小","不变","变为负"],"a":1,"d":"中","e":"线路电流减小后，线路电阻上的有功损耗减小。"},{"id":9093,"c":9,"n":93,"code":"09-093","t":"正弦稳态电路的分析","p":"功率因数校正后，负载消耗的有功功率通常（ ）","o":["增大","减小","基本不变","变为零"],"a":2,"d":"中","e":"校正主要改变无功功率，不改变负载本身完成的有功转换。"},{"id":9094,"c":9,"n":94,"code":"09-094","t":"正弦稳态电路的分析","p":"功率因数校正后，电源提供的视在功率通常（ ）","o":["增大","减小","不变","变为零"],"a":1,"d":"中","e":"有功基本不变而功率因数提高，因此视在功率减小。"},{"id":9095,"c":9,"n":95,"code":"09-095","t":"正弦稳态电路的分析","p":"阻抗匹配与共轭匹配的主要区别是（ ）","o":["共轭匹配同时考虑电阻和电抗关系","阻抗匹配只考虑频率","共轭匹配只考虑电阻","二者完全相同"],"a":0,"d":"高","e":"共轭匹配要求负载阻抗等于电源内阻抗的共轭，既处理电阻也处理电抗。"},{"id":9096,"c":9,"n":96,"code":"09-096","t":"正弦稳态电路的分析","p":"若电源内阻抗为容性，则实现共轭匹配时负载应呈（ ）","o":["感性","容性","纯电阻","开路"],"a":0,"d":"高","e":"容性内阻抗的共轭为感性，因此负载应呈感性并与内电抗相互抵消。"},{"id":9097,"c":9,"n":97,"code":"09-097","t":"正弦稳态电路的分析","p":"最大功率传输条件用阻抗语言描述为（ ）","o":["负载阻抗等于电源内阻抗的共轭","负载阻抗等于电源内阻抗","负载导纳等于电源内导纳","负载电阻等于零"],"a":0,"d":"中","e":"正弦稳态最大有功功率传输要求负载阻抗与电源内阻抗共轭相等。"},{"id":9098,"c":9,"n":98,"code":"09-098","t":"正弦稳态电路的分析","p":"在共轭匹配时，负载获得最大有功功率，但电源内阻抗上的有功损耗（ ）","o":["为零","与负载有功可能相当","一定大于负载有功","一定小于负载有功"],"a":1,"d":"高","e":"共轭匹配时电源内阻也消耗有功，效率不一定高，内阻损耗可能与负载功率相当。"},{"id":9099,"c":9,"n":99,"code":"09-099","t":"正弦稳态电路的分析","p":"若正弦稳态电源内阻抗为纯电阻，负载为纯电阻且等于内电阻，此时负载获得（ ）","o":["最大有功功率","最大无功功率","最大视在功率且无功最大","零有功功率"],"a":0,"d":"中","e":"这是共轭匹配在纯电阻情况下的特例，负载获得最大有功功率。"},{"id":9100,"c":9,"n":100,"code":"09-100","t":"正弦稳态电路的分析","p":"正弦稳态最大功率传输与直流最大功率传输相比，主要增加了哪一方面的考虑（ ）？","o":["电抗的共轭匹配","频率为零","电阻不存在","电容不能使用"],"a":0,"d":"高","e":"正弦稳态中不仅有电阻，还有电抗，因此最大功率传输需要考虑电抗的共轭抵消。"},{"id":10001,"c":10,"n":1,"code":"10-001","t":"含有耦合电感的电路","p":"两个线圈之间存在磁耦合时，一个线圈中的电流变化会在另一个线圈中产生什么（ ）？","o":["电阻压降","互感电压","电容电流","恒定磁通"],"a":1,"d":"低","e":"互感现象是一个线圈电流变化通过磁场在另一个线圈中感应电压。"},{"id":10002,"c":10,"n":2,"code":"10-002","t":"含有耦合电感的电路","p":"互感现象的本质是下列哪种耦合（ ）？","o":["电场耦合","磁场耦合","电阻耦合","电容耦合 function writeMath(target, source) {
  target.replaceChildren();
  let offset = 0;
  const appendText = value => { if (value) target.append(value); };
  for (const match of source.matchAll(mathParts)) {
    appendText(source.slice(offset, match.index));
    const [raw, numerator, denominator, exponent, symbol, index, power] = match;
    const part = document.createElement('span');
    part.className = 'math';
    if (numerator && !/^(?:[0-9.]+V|[A-Za-z]{2,})$/.test(numerator.replace(/^(?:Us|Is|Rs|Ri)$/, 'R'))) {
      part.className += ' fraction';
      part.setAttribute('role', 'math');
      part.setAttribute('aria-label', numerator + ' 除以 ' + denominator);
      for (const operand of [numerator, denominator]) {
        const row = document.createElement('span');
        writeMath(row, operand.startsWith('(') ? operand.slice(1,-1) : operand);
        part.append(row);
      }
    } else if (symbol || exponent || power) {
      const affix = document.createElement(symbol ? 'sub' : 'sup');
      affix.textContent = index?.replace(/^_/, '') ?? exponent ?? (power === '²' ? '2' : '3');
      if (symbol || exponent) part.append(symbol ?? '10');
      part.append(affix);
    } else {
      part.textContent = raw;
    }
    target.append(part);
    offset = match.index + raw.length;
  }
  appendText(source.slice(offset));
}

function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch{}}
function scope(){
  return bank.filter(q=>(!s.chapter||q.c===s.chapter)&&(!s.difficulty||q.d===s.difficulty));
}
function shuffle(ids){
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  return ids;
}
function setup(){
  s.ids=scope().filter(q=>(s.mode!=='wrong'||s.records[q.id]?.choice!==undefined&&s.records[q.id].choice!==q.a)).map(q=>q.id);
  if(s.mode==='random')shuffle(s.ids);
  s.index=0;s.redo=s.mode==='wrong'?(s.ids[0]??null):null;
}
function examInProgress(){ return s.mode==='exam' && s.exam && !s.exam.finished; }
function finishExam(){
  if(!examInProgress())return;
  s.exam.finished=true;
  s.index=0;
  render(true);
}
function examClock(){
  if(!examInProgress())return;
  const seconds=Math.max(0,Math.ceil((s.exam.deadline-Date.now())/1000));
  if(!seconds){finishExam();return;}
  const answered=Object.keys(s.exam.answers).length;
  $('examStatus').textContent='剩余 '+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')+' · 已答 '+answered+' / '+s.ids.length;
}
function render(focus=false){
  if(examInProgress() && Date.now()>=s.exam.deadline){
    s.exam.finished=true;
    s.index=0;
  }
  save();
  const exam=s.mode==='exam'?s.exam:null;
  const active=!!examInProgress();
  const configuring=s.mode==='exam'&&!exam;
  const available=scope().length;
  $('examConfig').hidden=!configuring;
  $('examCount').max=Math.max(1,available);
  if(configuring && Number($('examCount').value)>available){
    $('examCount').value=Math.max(1,available);
  }
  $('startExam').disabled=!available;
  $('examAvailable').textContent='当前范围可抽取 '+available+' 题';
  $('examMode').classList.toggle('primary',s.mode==='exam');
  $('examMode').setAttribute('aria-pressed',s.mode==='exam');
  $('examMode').disabled=active;
  $('chapter').disabled=!!exam;
  $('difficulty').disabled=!!exam;
  $('submitExam').hidden=!active;
  $('examStatus').hidden=!exam;
  $('humanForm').hidden=configuring;
  if(exam?.finished){
    const correct=s.ids.filter(id=>exam.answers[id]===byId.get(id).a).length;
    const unanswered=s.ids.length-Object.keys(exam.answers).length;
    $('examStatus').textContent='得分 '+correct+' / '+s.ids.length+' · 答错 '+(s.ids.length-correct-unanswered)+' · 未答 '+unanswered;
  }else if(active){examClock();}

  const q=byId.get(s.ids[s.index]), history=bank.filter(q=>s.records[q.id]), errors=history.filter(q=>s.records[q.id].choice!==q.a).length;
  $('chapter').value=s.chapter;$('difficulty').value=s.difficulty;
  $('stats').textContent='已做 '+history.length+' / '+bank.length+' · 错题 '+errors;
  $('progress').value=history.length;
  for(const m of ['order','random','wrong']){$(m).disabled=active;$(m).classList.toggle('primary',s.mode===m);$(m).setAttribute('aria-pressed',s.mode===m)}
  $('position').textContent=q?'第 '+(s.index+1)+' / '+s.ids.length+' 题':configuring?'设置试卷':'当前没有题目';
  $('question').hidden=!q;$('empty').hidden=!!q;
  $('emptyText').textContent=configuring?'选择题数与限时后开始答卷。':s.mode==='wrong'?'当前范围没有待重练的错题。':'当前范围没有题目，请切换章节或难度。';
  $('prev').disabled=s.index<=0;$('next').disabled=s.index>=s.ids.length-1;
  $('choices').replaceChildren();$('feedback').hidden=true;$('retry').hidden=true;
  $('questionGrid').replaceChildren(...s.ids.map((id,i)=>{
    const b=document.createElement('button'), item=byId.get(id);
    const r=exam?(Object.hasOwn(exam.answers,id)?{choice:exam.answers[id]}:null):s.records[id];
    b.textContent=item.code;
    b.setAttribute('aria-label','第 '+item.c+' 章第 '+item.n+' 题'+(r?(active?'，已作答':r.choice===item.a?'，已答对':'，待重练'):'，未作答'));
    if(i===s.index)b.setAttribute('aria-current','true');
    if(active ? r : r?.choice===item.a)b.className='primary';
    b.onclick=()=>go(i);return b;
  }));
  if(!q)return;
  $('label').textContent='第 '+q.c+' 章 · '+q.code;
  $('topic').textContent=q.t+' · 难度'+q.d;
  writeMath($('prompt'),q.p);
  const choice=exam?exam.answers[q.id]:s.redo===q.id?undefined:s.records[q.id]?.choice;
  q.o.forEach((option,i)=>{
    const b=document.createElement('button'), badge=document.createElement('b'), copy=document.createElement('span');
    badge.textContent='ABCD'[i];writeMath(copy,option);copy.className='choiceCopy';b.append(badge,copy);
    if(active){
      b.dataset.selected=String(i===choice);
      b.setAttribute('aria-pressed',i===choice);
    }else if(exam?.finished||choice!==undefined){
      b.disabled=true;
      if(i===q.a)b.dataset.grade='correct';
      else if(i===choice)b.dataset.grade='wrong';
    }
    if(b.dataset.grade){
      const mark=document.createElement('span');mark.className='gradeBadge';
      mark.textContent=b.dataset.grade==='correct'?'✓ 正确答案':'✕ 你的错选';copy.append(mark);
    }
    b.onclick=()=>{
      if(active){
        if(Date.now()>=exam.deadline){finishExam();return;}
        exam.answers[q.id]=i;
        render();
        $('choices').children[i].focus();
        return;
      }
      if(exam)return;
      s.records[q.id]={choice:i};s.redo=null;render();(s.index<s.ids.length-1?$('next'):$('retry')).focus()};
    $('choices').append(b);
  });
  if(!active&&(exam?.finished||choice!==undefined)){
    $('feedback').dataset.kind=choice===q.a?'表决':'质疑';
    $('grade').textContent=(choice===undefined?'未作答':choice===q.a?'✓ 回答正确':'✕ 回答错误 · 你的选择：'+'ABCD'[choice])+' · 正确答案：'+'ABCD'[q.a];
    writeMath($('explanation'),q.e);$('feedback').hidden=false;$('retry').hidden=!!exam;
  }
  if(focus)$('prompt').focus();
}
function go(i){if(i>=0&&i<s.ids.length){s.index=i;const q=byId.get(s.ids[i]);s.redo=s.mode==='wrong'&&s.records[q.id]?.choice!==q.a?q.id:null;render(true)}}
for(const m of ['order','random','wrong'])$(m).onclick=()=>{if(examInProgress())return;s.mode=m;s.exam=null;setup();render()};
$('chapter').onchange=()=>{s.chapter=Number($('chapter').value);if(s.mode!=='exam')setup();render()};
$('difficulty').onchange=()=>{s.difficulty=$('difficulty').value;if(s.mode!=='exam')setup();render()};
$('prev').onclick=()=>go(s.index-1);$('next').onclick=()=>go(s.index+1);
$('retry').onclick=()=>{s.redo=s.ids[s.index];render();$('choices').firstElementChild?.focus()};
$('examMode').onclick=()=>{
  if(examInProgress())return;
  s.mode='exam';
  s.exam=null;
  s.ids=[];
  s.index=0;
  $('examCount').value=Math.min(20,scope().length)||1;
  $('examError').hidden=true;
  render();
};
$('examConfig').onsubmit=event=>{
  event.preventDefault();
  if(s.mode!=='exam'||s.exam)return;
  const count=Number($('examCount').value);
  const minutes=Number($('examMinutes').value);
  const pool=scope();
  if(!Number.isInteger(count)||count<1||count>pool.length||!Number.isInteger(minutes)||minutes<1||minutes>999){
    $('examError').textContent='请输入有效题数和限时。';
    $('examError').hidden=false;
    return;
  }
  s.ids=shuffle(pool.map(q=>q.id)).slice(0,count);
  s.index=0;
  s.redo=null;
  s.exam={deadline:Date.now()+minutes*60000,answers:{},finished:false};
  render(true);
};
$('submitExam').onclick=()=>{
  if(!examInProgress())return;
  const remaining=s.ids.length-Object.keys(s.exam.answers).length;
  if(!remaining||confirm('还有 '+remaining+' 题未答，确认交卷？'))finishExam();
};
if(!s.ids.length&&s.mode!=='exam')setup();
render();
setInterval(examClock,250);
</script>
