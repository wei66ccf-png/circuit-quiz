<!doctype html>
<html lang="zh-CN" data-type="software">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>电路 · 刷题室</title>
<style>
:root {
  color-scheme: light;
  --paper: #faf9f5;
  --surface: #fffefa;
  --ink: #29251f;
  --muted: #665e52;
  --line: #dfdad1;
  --accent: #9c432b;
  --serif: "Iowan Old Style", "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", Georgia, "SimSun", serif;
  --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.65 var(--sans); }
main { max-width: 1120px; margin: auto; padding: 42px 24px 56px; }
h1, h2, h3, p { margin: 0; }
h1 { font: 500 clamp(32px, 5vw, 48px)/1.2 var(--serif); }
h2, h3 { font-size: 16px; }
small, .eyebrow, .messageMeta span { color: var(--muted); }
.eyebrow { font-size: 13px; margin-bottom: 6px; }
.roomHeader { border-bottom: 1px solid var(--line); padding-bottom: 22px; margin-bottom: 24px; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.roomTitle { margin-right: auto; }
.roomLayout { display: grid; grid-template-columns: 224px minmax(0, 1fr); gap: 26px; align-items: start; }
.roomSidebar { min-width: 0; padding: 16px; background: #f2efe8; border: 1px solid var(--line); border-radius: 12px; }
.roomStatus { margin: 12px 0; font-size: 13px; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-weight: 600; }
label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
button, select, input { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
button { padding: 8px 13px; cursor: pointer; }
button:not(:disabled):hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: white; }
button:disabled { opacity: .45; cursor: default; }
select, input { min-width: 0; width: 100%; padding: 7px 8px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.roomChat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.chatHeading { padding: 14px 24px; border-bottom: 1px solid var(--line); }
.chatMark, .avatar { display: none; }
#results { padding: 22px 24px; }
.messageCard, .messageBody { min-width: 0; overflow-wrap: anywhere; }
.messageMeta { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 10px; }
.messageMeta span { font-size: 13px; }
#prompt { font: 500 20px/1.7 var(--serif); }
#feedback { margin-top: 18px; padding: 14px; border-radius: 9px; background: #f2f5ed; }
#feedback[data-kind="质疑"] { background: #fbefeb; }
#humanForm { padding: 12px 24px; gap: 8px; border-top: 1px solid var(--line); }
#choices b { background: #eee9e0; }
#choices button[data-selected=true] { background: #f9e9df; border-color: var(--accent); }
#examConfig { margin-top: 12px; display: grid; gap: 10px; }
#examStatus { padding: 10px 24px; border-bottom: 1px solid var(--line); background: #f7f1e8; font-variant-numeric: tabular-nums; }
#examError { color: #a52e29; }
.math { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; }
.fraction { display: inline-flex; vertical-align: middle; flex-direction: column; align-items: stretch; text-align: center; line-height: 1.18; margin: .12em .14em; max-width: 100%; }
.fraction > span { padding: .12em .24em; }
.fraction > span:first-child { border-bottom: 1px solid currentColor; }
.math sub, .math sup { font-size: .72em; line-height: 0; }
@media (max-width: 740px) {
  main { padding: 20px 12px 32px; }
  .roomTitle { flex-basis: 100%; margin-bottom: 5px; }
  .roomLayout { gap: 12px; }
  .chatHeading, #results, #humanForm, #examStatus { padding-inline: 14px; }
  #prompt { font-size: 18px; }
}

#meetingRoom #results{height:auto;min-height:310px;overflow:visible}
#results .messageCard{width:100%}
#choices{display:grid;gap:8px;margin-top:14px}
#choices button{display:flex;align-items:center;gap:10px;text-align:left;border-radius:12px;min-height:44px;overflow-wrap:anywhere}
#choices b{flex:none;min-width:27px;text-align:center;background:#eee9e0;border-radius:7px}
#choices button[data-grade=correct]{background:#d6f4e2;border-color:#248154;color:#10442b;box-shadow:inset 4px 0 #248154}
#choices button[data-grade=wrong]{background:#ffdedb;border-color:#b83a34;color:#701e1a;box-shadow:inset 4px 0 #b83a34}
#choices .choiceCopy{display:block;min-width:0}
#choices .gradeBadge{display:table;margin-top:3px;border-radius:6px;padding:1px 8px;color:white;background:#176641;font-size:12px;font-weight:750}
#choices [data-grade=wrong] .gradeBadge{background:#a52e29}
#feedback #grade{font-size:15px;color:#176641}
#feedback[data-kind="质疑"] #grade{color:#a52e29}
#choices button:disabled{opacity:1;cursor:default}
#humanForm{display:flex;flex-wrap:wrap;align-items:center}
#next{margin-left:auto}
#questionGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;max-height:256px;overflow:auto;padding:4px}
#questionGrid button{padding:5px;min-height:42px}
#questionGrid [aria-current=true]{outline:2px solid var(--accent)}
#filters{display:grid;gap:9px}
progress{width:100%;height:8px;accent-color:var(--accent)}
@media(max-width:740px){#meetingRoom .roomLayout{grid-template-columns:minmax(0,1fr)}#meetingRoom .roomSidebar{max-height:none;overflow:visible}#filters{grid-template-columns:repeat(2,minmax(0,1fr))}#meetingRoom button,#meetingRoom select{min-height:44px}#meetingRoom select{font-size:16px}}
</style>
<main>
<section class="panel" id="meetingRoom">
<div class="roomHeader"><div class="bar"><div class="roomTitle"><div class="eyebrow">电路 · 课内测验</div><h1>电路刷题室</h1></div><button id="order" class="primary" aria-pressed="true">顺序练习</button><button id="random" aria-pressed="false">随机练习</button><button id="wrong" aria-pressed="false">错题重练</button><button id="examMode" aria-pressed="false">随机组卷</button></div></div>
<div class="roomLayout">
<aside class="roomSidebar" aria-label="练习设置">
<div id="filters"><label>章节<select id="chapter"><option value="0">全部章节</option><option value="1">第 1 章 · 电路模型和电路定律</option><option value="2">第 2 章 · 电阻电路的等效变换</option><option value="3">第 3 章 · 电阻电路的一般分析</option></select></label><label>难度<select id="difficulty"><option value="">全部难度</option><option>低</option><option>中</option><option>高</option></select></label></div>
<form id="examConfig" hidden>
<label>题目数量<input id="examCount" type="number" min="1" max="300" value="20" required></label>
<label>限时（分钟）<input id="examMinutes" type="number" min="1" max="999" value="30" required></label>
<small id="examAvailable"></small>
<small id="examError" role="alert" hidden></small>
<button id="startExam" class="primary" type="submit">开始答卷</button>
</form>
<div class="roomStatus"><p id="stats"></p><progress id="progress" max="300" value="0" aria-label="题库完成进度"></progress></div>
<details><summary>答题卡</summary><div id="questionGrid"></div></details>
</aside>
<div class="roomChat">
<div class="chatHeading"><div class="chatMark" aria-hidden="true">•••</div><div><h3>单项选择</h3><small id="position"></small></div></div>
<div id="examStatus" hidden></div>
<div id="results">
<article id="question"><div class="avatar" style="--avatar-hue:196" aria-hidden="true">题</div><div class="messageCard"><div class="messageMeta"><h3 id="label"></h3><span id="topic"></span></div><div class="messageBubble messageBody"><p id="prompt" tabindex="-1"></p><div id="choices" aria-label="答案选项"></div></div></div></article>
<article id="feedback" data-kind="表决" role="status" hidden><div class="avatar" style="--avatar-hue:153" aria-hidden="true">解</div><div class="messageCard"><div class="messageMeta"><h3 id="grade"></h3></div><div class="messageBubble messageBody"><p id="explanation"></p></div></div></article>
<article id="empty" data-kind="系统" hidden><div class="messageBubble" id="emptyText"></div></article>
</div>
<div id="humanForm" class="liquidGlass"><button id="prev">上一题</button><button id="retry" hidden>重答本题</button><button id="submitExam" hidden>交卷</button><button id="next" class="primary">下一题</button></div>
</div>
</div>
</section>
</main>
<script id="bank" type="application/json">[{"id":1,"c":1,"n":1,"t":"电路模型","p":"电路模型是由若干（ ）组成的。","o":["实际器件","理想化元件","导线和开关","电源和负载"],"a":1,"d":"低","e":"电路模型是将实际电路中的器件用其理想化模型符号表示，由若干理想化元件组成。"},{"id":2,"c":1,"n":2,"t":"电路模型","p":"将实际电路中的各个器件用其模型符号表示后画出的图，称为（ ）。","o":["电路模型图","安装图","布线图","原理框图"],"a":0,"d":"低","e":"将实际电路中各个器件用其模型符号表示，这样画出的图称为实际电路的电路模型图。"},{"id":3,"c":1,"n":3,"t":"电路模型","p":"任何实际电路都不可缺少的组成部分是（ ）。","o":["电阻、电容、电感","电源、负载、导线","开关、熔断器、导线","晶体管、电阻、电容"],"a":1,"d":"低","e":"电源、负载、导线是任何实际电路都不可缺少的三个组成部分。"},{"id":4,"c":1,"n":4,"t":"电路模型","p":"电路的主要作用可概括为（ ）。","o":["仅进行能量的传输与转换","仅实现信号的传递与处理","进行能量的传输与转换，以及实现信号的传递与处理","仅进行电能的存储"],"a":2,"d":"低","e":"电路的主要作用可概括为两个方面：进行能量的传输与转换；实现信号的传递与处理。"},{"id":5,"c":1,"n":5,"t":"电路模型","p":"当实际电路的几何尺寸远小于其工作时电磁波的波长时，该电路可视为（ ）。","o":["分布参数电路","集中参数电路","非线性电路","时变电路"],"a":1,"d":"低","e":"电路几何尺寸远小于其工作时电磁波波长的电路称为集中参数电路。"},{"id":6,"c":1,"n":6,"t":"电路模型","p":"下列关于集中参数电路的说法中，正确的是（ ）。","o":["电磁能量在电路各处的传播需要考虑时间延迟","可以认为传送到电路各处的电磁能量是同时到达的","适用于高频长距离传输线","导线的电阻、电感和电容特性必须分开考虑"],"a":1,"d":"中","e":"如果实际电路的几何尺寸远小于其工作时电磁波的波长，可以认为传送到电路各处的电磁能量是同时到达的。"},{"id":7,"c":1,"n":7,"t":"电路模型","p":"完全由线性元件、独立源或线性受控源构成的电路称为（ ）。","o":["非线性电路","线性电路","时变电路","分布参数电路"],"a":1,"d":"低","e":"线性电路是指完全由线性元件、独立源或线性受控源构成的电路。"},{"id":8,"c":1,"n":8,"t":"电路模型","p":"含有非线性元件的电路称为（ ）。","o":["线性电路","时不变电路","非线性电路","集中参数电路"],"a":2,"d":"低","e":"非线性电路是指含有非线性元件的电路。"},{"id":9,"c":1,"n":9,"t":"电路模型","p":"电路中的耗能现象集中于（ ）。","o":["电阻元件","电容元件","电感元件","电源元件"],"a":0,"d":"低","e":"在集中参数电路中，耗能都集中于电阻元件，电能只集中于电容元件，磁能只集中于电感元件。"},{"id":10,"c":1,"n":10,"t":"电路模型","p":"电容元件反映的电路特征是（ ）。","o":["消耗电能","储存电能","储存磁能","发出电能"],"a":1,"d":"低","e":"理想电容元件只储存电能，可以用理想电容来反映其储存电能的特征。"},{"id":11,"c":1,"n":11,"t":"电流和电压的参考方向","p":"电流与电压为关联参考方向是指（ ）。","o":["电流参考方向与电压参考方向一致","电流参考方向与电压参考方向相反","电流实际方向与电压实际方向一致","电流实际方向与电压实际方向相反"],"a":0,"d":"低","e":"关联参考方向是指电流参考方向与电压参考方向一致，即电流从电压的正极流入。"},{"id":12,"c":1,"n":12,"t":"电流和电压的参考方向","p":"当电路中电流的参考方向与电流的真实方向相反时，该电流（ ）。","o":["一定为正值","一定为负值","不能肯定是正值或负值","有时是正值、有时为负值"],"a":1,"d":"低","e":"当实际方向和参考方向一致时 i>0，不一致时 i\u003c0。"},{"id":13,"c":1,"n":13,"t":"电流和电压的参考方向","p":"已知空间有 a、b 两点，电压 Uab = 10V，a 点电位为 Va = 4V，则 b 点电位 Vb 为（ ）。","o":["6V","−6V","14V","10V"],"a":1,"d":"中","e":"Uab = Va - Vb，因此 Vb = Va - Uab = 4 - 10 = −6V。"},{"id":14,"c":1,"n":14,"t":"电流和电压的参考方向","p":"电路中 a 点电位为 5V，b 点电位为-3V，则电压 Uab 为（ ）。","o":["8V","−8V","2V","−2V"],"a":0,"d":"中","e":"Uab = Va - Vb = 5 - (-3) = 8V。"},{"id":15,"c":1,"n":15,"t":"电流和电压的参考方向","p":"非关联参考方向是指（ ）。","o":["电流从电压的正极流入","电流从电压的负极流入","电流参考方向与电压参考方向相同","电流和电压都取正值"],"a":1,"d":"低","e":"非关联参考方向是指电流参考方向与电压参考方向不同，即电流从电压的负极流入。"},{"id":16,"c":1,"n":16,"t":"电流和电压的参考方向","p":"关于电流的参考方向，下列说法正确的是（ ）。","o":["参考方向就是实际方向","参考方向是任意假定的方向","参考方向一旦选定就不能改变","电流为负值时说明电流不存在"],"a":1,"d":"低","e":"分析电路时，我们可以假定一个电流和电压的方向，称之为参考方向。"},{"id":17,"c":1,"n":17,"t":"电流和电压的参考方向","p":"电流的实际方向通常规定为（ ）。","o":["负电荷移动的方向","正电荷移动的方向","电子移动的方向","与电压降方向相反"],"a":1,"d":"低","e":"电流的实际方向规定为正电荷移动的方向。"},{"id":18,"c":1,"n":18,"t":"电流和电压的参考方向","p":"电压的实际方向规定为（ ）。","o":["电位升高的方向","电位降低的方向","电流流动的方向","与参考方向一致的方向"],"a":1,"d":"低","e":"电压的实际方向规定为电位降低的方向，即从高电位指向低电位。"},{"id":19,"c":1,"n":19,"t":"电流和电压的参考方向","p":"在电路分析中，引入参考方向的概念是因为（ ）。","o":["实际方向无法确定","电流和电压的实际方向可能随时间变化","使电路计算更加复杂","参考方向就是实际方向"],"a":1,"d":"中","e":"在交流电路或某些复杂电路中，电流和电压的实际方向可能随时间变化，引入参考方向便于统一分析和计算。"},{"id":20,"c":1,"n":20,"t":"电流和电压的参考方向","p":"某元件两端电压的参考方向为上正下负，电流参考方向从上端流入，则（ ）。","o":["该元件的电压电流为关联参考方向","该元件的电压电流为非关联参考方向","无法判断是否关联","电压一定为正"],"a":0,"d":"中","e":"电流从上端（正极）流入，与电压参考方向一致，属于关联参考方向。"},{"id":21,"c":1,"n":21,"t":"电流和电压的参考方向","p":"若某元件 u 和 i 采用非关联参考方向，且 u = 5V，i = 2A，则该元件（ ）。","o":["吸收功率 10W","发出功率 10W","吸收功率-10W","功率为零"],"a":1,"d":"中","e":"非关联参考方向下，p = -ui = -(5×2) = −10W \u003c 0，表示发出功率 10W。"},{"id":22,"c":1,"n":22,"t":"电流和电压的参考方向","p":"在关联参考方向下，若某元件吸收功率为负值，则该元件（ ）。","o":["实际吸收功率","实际发出功率","不消耗也不发出功率","无法判断"],"a":1,"d":"中","e":"关联参考方向下 p = ui，若 p \u003c 0 则表示实际发出功率。"},{"id":23,"c":1,"n":23,"t":"电流和电压的参考方向","p":"电位与电压的关系是（ ）。","o":["电压就是电位","电压是两点之间的电位差","电位是两点之间的电压差","电压和电位没有关系"],"a":1,"d":"低","e":"电压（电位差）等于两点电位之差，Uab = Va - Vb。"},{"id":24,"c":1,"n":24,"t":"电流和电压的参考方向","p":"参考点改变时，各点的电位将（ ），而任意两点间的电压将（ ）。","o":["不变，改变","改变，不变","改变，改变","不变，不变"],"a":1,"d":"中","e":"电位是相对于参考点的，参考点改变则电位改变；但两点间的电压（电位差）与参考点选择无关。"},{"id":25,"c":1,"n":25,"t":"电流和电压的参考方向","p":"电流参考方向从 a 点指向 b 点，若 i = −3A，则电流实际方向是（ ）。","o":["从 a 到 b","从 b 到 a","不能确定","先 a 后 b"],"a":1,"d":"中","e":"电流为负值说明实际方向与参考方向相反，参考方向从 a 到 b，故实际方向从 b 到 a。"},{"id":26,"c":1,"n":26,"t":"电功率和能量","p":"在关联参考方向下，功率的计算公式为（ ）。","o":["p = -ui","p = ui","p = u/i","p = i/u"],"a":1,"d":"低","e":"关联参考方向下，功率定义为 p = ui。"},{"id":27,"c":1,"n":27,"t":"电功率和能量","p":"在非关联参考方向下，功率的计算公式为（ ）。","o":["p = ui","p = -ui","p = u/i","p = i/u"],"a":1,"d":"低","e":"非关联参考方向下，功率计算式为 p = -ui。"},{"id":28,"c":1,"n":28,"t":"电功率和能量","p":"若某元件在关联参考方向下，u = −5V，i = 2A，则该元件（ ）。","o":["吸收功率 10W","发出功率 10W","吸收功率-10W","功率为零"],"a":1,"d":"中","e":"p = ui = (-5)×2 = −10W，p \u003c 0 表示发出功率 10W。"},{"id":29,"c":1,"n":29,"t":"电功率和能量","p":"功率为正，元件（ ）；功率为负，元件（ ）。","o":["发出功率，吸收功率","吸收功率，发出功率","吸收功率，吸收功率","发出功率，发出功率"],"a":1,"d":"低","e":"功率为正表示元件吸收功率（作为负载），功率为负表示元件发出功率（作为电源）。"},{"id":30,"c":1,"n":30,"t":"电功率和能量","p":"电阻元件在关联参考方向下，功率的计算式可以是（ ）。","o":["p = ui = i²R = u²/R","p = ui = i²/R = u²R","p = -ui = i²R = u²/R","p = ui = iR = u/R"],"a":0,"d":"中","e":"电阻元件在关联参考方向下满足欧姆定律 u = iR，因此 p = ui = i²R = u²/R。"},{"id":31,"c":1,"n":31,"t":"电功率和能量","p":"某电阻 R = 10Ω，两端电压为 20V，则其消耗的功率为（ ）。","o":["2W","20W","40W","200W"],"a":2,"d":"低","e":"p = u²/R = 20²/10 = 400/10 = 40W。"},{"id":32,"c":1,"n":32,"t":"电功率和能量","p":"某电阻 R = 5Ω，通过电流为 4A，则其消耗的功率为（ ）。","o":["20W","40W","80W","100W"],"a":2,"d":"低","e":"p = i²R = 4² × 5 = 16 × 5 = 80W。"},{"id":33,"c":1,"n":33,"t":"电功率和能量","p":"电功率的单位是（ ）。","o":["焦耳","瓦特","安培","伏特"],"a":1,"d":"低","e":"功率的单位是瓦特（W），焦耳是能量的单位。"},{"id":34,"c":1,"n":34,"t":"电功率和能量","p":"电能量的单位是（ ）。","o":["瓦特","焦耳","安培","伏特"],"a":1,"d":"低","e":"能量的单位是焦耳（J），功率的单位是瓦特。"},{"id":35,"c":1,"n":35,"t":"电功率和能量","p":"某元件发出功率为 50W，则在关联参考方向下，ui 的乘积为（ ）。","o":["50","−50","25","−25"],"a":1,"d":"中","e":"发出功率意味着 p = ui = −50W。"},{"id":36,"c":1,"n":36,"t":"电功率和能量","p":"一台标有“220V/2kW”的电热水器正常工作 2 小时消耗的电能为（ ）。","o":["2.0 kW·h","4.0 kW·h","1.0 kW·h","0.5 kW·h"],"a":1,"d":"低","e":"W = P × t = 2kW × 2h = 4kW·h。"},{"id":37,"c":1,"n":37,"t":"电功率和能量","p":"能量与功率的关系为（ ）。","o":["W = p × t（恒定功率时）","W = p / t","W = t / p","能量与功率无关"],"a":0,"d":"低","e":"恒定功率下，能量等于功率乘以时间，W = pt。"},{"id":38,"c":1,"n":38,"t":"电功率和能量","p":"若某元件在 t = 0 到 t = 5s 内吸收功率为 20W 恒定，则该元件吸收的能量为（ ）。","o":["4J","25J","100J","0.25J"],"a":2,"d":"低","e":"W = p × t = 20 × 5 = 100J。"},{"id":39,"c":1,"n":39,"t":"电功率和能量","p":"电阻元件是（ ）元件。","o":["储能","耗能","发出能量","不耗能"],"a":1,"d":"低","e":"电阻元件只消耗电能，属于耗能元件。"},{"id":40,"c":1,"n":40,"t":"电功率和能量","p":"电容元件是（ ）元件。","o":["耗能","储存电场能量","储存磁场能量","发出电能"],"a":1,"d":"低","e":"电容元件是储存电场能量的元件。"},{"id":41,"c":1,"n":41,"t":"电功率和能量","p":"电感元件是（ ）元件。","o":["耗能","储存电场能量","储存磁场能量","发出电能"],"a":2,"d":"低","e":"电感元件是储存磁场能量的元件。"},{"id":42,"c":1,"n":42,"t":"电功率和能量","p":"三个无源元件按能量特性分类，正确的是（ ）。","o":["电阻耗能、电容储能、电感耗能","电阻耗能、电容储能、电感储能","电阻储能、电容耗能、电感储能","电阻储能、电容储能、电感储能"],"a":1,"d":"中","e":"电阻是耗能元件，电容储存电场能量，电感储存磁场能量。"},{"id":43,"c":1,"n":43,"t":"电功率和能量","p":"在非关联参考方向下，若元件吸收功率为 20W，则 ui 的乘积为（ ）。","o":["20","−20","10","−10"],"a":1,"d":"中","e":"非关联参考方向下 p = -ui，吸收功率 20W 意味着 p = 20W，故 ui = −20。"},{"id":44,"c":1,"n":44,"t":"电功率和能量","p":"关于功率正负的判断，下列说法正确的是（ ）。","o":["无论关联与否，p = ui 都成立","先判断参考方向是否关联，再决定是否加负号","功率的正负只取决于电压的正负","功率的正负只取决于电流的正负"],"a":1,"d":"中","e":"判断吸收还是发出功率时，先看参考方向是否关联，关联则 p = ui，不关联则 p = -ui，代入带正负号的数值，结果大于 0 为吸收，小于 0 为发出。"},{"id":45,"c":1,"n":45,"t":"电功率和能量","p":"某元件 u 与 i 为关联参考方向，已知 p = −30W，则表明该元件（ ）。","o":["吸收功率 30W","发出功率 30W","既不吸收也不发出","无法判断"],"a":1,"d":"中","e":"关联参考方向下 p = ui = −30W，负值表示发出功率 30W。"},{"id":46,"c":1,"n":46,"t":"电路元件、电阻元件","p":"理想电阻元件的伏安关系在 u-i 平面上是一条（ ）。","o":["平行于 u 轴的直线","平行于 i 轴的直线","过原点的直线","曲线"],"a":2,"d":"低","e":"线性电阻满足欧姆定律 u = iR，在 u-i 平面上是一条过原点的直线。"},{"id":47,"c":1,"n":47,"t":"电路元件、电阻元件","p":"线性电阻的伏安特性曲线在 u-i 坐标系中是（ ）。","o":["一条曲线","一条过原点的直线","一条不经过原点的直线","一条平 路，回路"],"a":1,"d":"低","e":"KCL 应用于节点，KVL 应用于回路。"},{"id":96,"c":1,"n":96,"t":"基尔霍夫定律","p":"某节点有 3 条支路，已知两条支路电流分别为流入 2A、流出 5A，则第三条支路电流（ ）。","o":["流入 3A","流出 3A","流入 7A","流出 7A"],"a":0,"d":"中","e":"根据 KCL，ΣI = 0，设流出为正，则流入 2A 记为-2，流出 5A 记为+5，则第三条支路电流 = -(-2+5) = −3A，即流入 3A。"},{"id":97,"c":1,"n":97,"t":"基尔霍夫定律","p":"某闭合回路中有三个元件，已知两个元件的电压分别为 6V 和-2V（沿回路方向），则第三个元件的电压为（ ）。","o":["4V","−4V","8V","−8V"],"a":1,"d":"中","e":"根据 KVL，ΣU = 0，6 + (-2) + U3 = 0，U3 = −4V。"},{"id":98,"c":1,"n":98,"t":"基尔霍夫定律","p":"KCL 的实质是（ ）。","o":["能量守恒","电荷守恒","磁通守恒","功率守恒"],"a":1,"d":"中","e":"KCL 反映了电荷守恒定律，即流入节点的电荷等于流出节点的电荷，节点上不能积累电荷。"},{"id":99,"c":1,"n":99,"t":"基尔霍夫定律","p":"KVL 的实质是（ ）。","o":["电荷守恒","能量守恒","磁通守恒","电流守恒"],"a":1,"d":"中","e":"KVL 反映了能量守恒定律，即单位正电荷沿闭合回路一周，电场力做功的代数和为零。"},{"id":100,"c":1,"n":100,"t":"基尔霍夫定律","p":"关于 KCL 和 KVL 的适用条件，下列说法正确的是（ ）。","o":["仅适用于线性电路","仅适用于直流电路","仅适用于集中参数电路","适用于任何集中参数电路，与元件性质无关"],"a":3,"d":"中","e":"KCL 和 KVL 适用于任何集中参数电路，无论电路是线性的还是非线性的，直流的还是交流的，都与元件性质无关。"},{"id":101,"c":2,"n":1,"t":"电路的等效变换","p":"两个二端电路等效的条件是（ ）。","o":["两个电路的结构完全相同","两个电路具有相同的伏安特性","两个电路包含相同的元件数量","两个电路的功率相等"],"a":1,"d":"低","e":"电路等效是指两个二端电路端口具有相同的电压、电流关系（即相同的 VC R），与内部结构无关。"},{"id":102,"c":2,"n":2,"t":"电路的等效变换","p":"电路等效变换的对象是（ ）。","o":["外电路中的电压、电流和功率","变换部分内部的电压、电流","变换部分内部消耗的功率","变换部分内部的元件参数"],"a":0,"d":"中","e":"等效变换的对象是外电路（未变化部分）中的电压、电流和功率，对变换部分内部是不等效的。"},{"id":103,"c":2,"n":3,"t":"电路的等效变换","p":"对 A 电路而言，B 电路与 C 电路等效意味着（ ）。","o":["B 与 C 内部的功率相等","B 与 C 的端口伏安特性相同","B 与 C 的元件参数相同","B 与 C 的电路结构相同"],"a":1,"d":"低","e":"两个二端电路等效的核心条件是端口伏安特性完全相同。"},{"id":104,"c":2,"n":4,"t":"电路的等效变换","p":"关于等效变换，以下说法正确的是（ ）。","o":["等效变换后，外电路中的电流会发生改变","等效变换后，变换部分内部的电压、电流也保持不变","等效变换的目的是简化电路，方便求解","等效变换要求两个电路的结构必须相似"],"a":2,"d":"低","e":"等效变换的目的是简化电路，方便求出需要的结果。等效是对外电路而言的，内部并不等效。"},{"id":105,"c":2,"n":5,"t":"电路的等效变换","p":"二端网络是指（ ）。","o":["具有两个元件的电路","向外引出两个端钮，且从一个端子流入的电流等于从另一端子流出的电流的电路","只有两个节点的电路","具有两条支路的电路"],"a":1,"d":"低","e":"二端网络的定义是向外引出两个端钮，且满足电流连续性条件（流入电流等于流出电流）。"},{"id":106,"c":2,"n":6,"t":"电路的等效变换","p":"两个二端电路等效，意味着它们（ ）。","o":["内部所有元件的电压、电流都相等","端口具有相同的电压、电流关系","消耗的功率相等","包含的电源数量相等"],"a":1,"d":"低","e":"等效的核心在于端口伏安特性相同，而非内部参数或功率相等。"},{"id":107,"c":2,"n":7,"t":"电路的等效变换","p":"等效变换的“等效”指的是（ ）。","o":["变换前后电路内部完全一样","变换前后对任意外部电路的作用效果相同","变换前后电路的功率相同","变换前后电路的元件参数相同"],"a":1,"d":"中","e":"等效变换是对外电路而言的，即变换前后对外部电路的作用效果相同。"},{"id":108,"c":2,"n":8,"t":"电路的等效变换","p":"以下关于等效变换的说法，错误的是（ ）。","o":["等效变换可以简化电路结构","等效变换后，变换部分内部的电压和电流可能改变","等效变换要求两个二端网络的伏安特性完全相同","等效变换后，外电路的响应也会改变"],"a":3,"d":"中","e":"等效变换后，外电路的电压、电流和功率均保持不变，否则就不叫等效。"},{"id":109,"c":2,"n":9,"t":"电路的等效变换","p":"“输入电阻”通常是指（ ）。","o":["电路中某个电阻的阻值","从电路输入端看进去的等效电阻","电路中的总电阻","电源的内阻"],"a":1,"d":"低","e":"输入电阻是从端口看进去的等效电阻，等于端口电压与端口电流之比。"},{"id":110,"c":2,"n":10,"t":"电路的等效变换","p":"含源二端网络的输入电阻定义为（ ）。","o":["端口电压与电流之比（独立源置零后）","端口电压与电流之比（独立源保留）","开路电压与短路电流之比","电路总电阻"],"a":1,"d":"中","e":"输入电阻一般定义为端口电压与输入电流之比。对于含源网络，也可通过独立源置零后求等效电阻， 但定义本身不要求置零。"},{"id":111,"c":2,"n":11,"t":"电阻的串联和并联","p":"两个电阻 R1=4Ω、R2=6Ω 串联，等效电阻为（ ）。","o":["2.4Ω","10Ω","24Ω","1.5Ω"],"a":1,"d":"低","e":"串联等效电阻等于各电阻之和，R=R1+R2=4+6=10Ω。"},{"id":112,"c":2,"n":12,"t":"电阻的串联和并联","p":"两个电阻 R1=4Ω、R2=6Ω 并联，等效电阻为（ ）。","o":["10Ω","24Ω","2.4Ω","1.5Ω"],"a":2,"d":"低","e":"并联等效电阻 R=(R1R2)/(R1+R2)=24/10=2.4Ω。"},{"id":113,"c":2,"n":13,"t":"电阻的串联和并联","p":"电阻串联时，各电阻上的电流（ ）。","o":["与电阻成正比","与电阻成反比","相等","之和为总电流"],"a":2,"d":"低","e":"串联电路只有一条通路，流过各串联电阻的电流相同。"},{"id":114,"c":2,"n":14,"t":"电阻的串联和并联","p":"电阻并联时，各电阻两端的电压（ ）。","o":["与电阻成正比","与电阻成反比","相等","之和为总电压"],"a":2,"d":"低","e":"并联电路各支路承受同一电压。"},{"id":115,"c":2,"n":15,"t":"电阻的串联和并联","p":"电阻串联电路中，各电阻分得的电压与电阻值（ ）。","o":["成反比","成正比","无关","成平方关系"],"a":1,"d":"低","e":"分压公式 uk = (Rk/R)u，各电阻电压与电阻值成正比。"},{"id":116,"c":2,"n":16,"t":"电阻的串联和并联","p":"电阻并联电路中，各电阻分得的电流与电阻值（ ）。","o":["成正比","成反比","无关","成平方关系"],"a":1,"d":"低","e":"分流公式 ik = (Gk/G)i，电流与电导成正比，即与电阻成反比。"},{"id":117,"c":2,"n":17,"t":"电阻的串联和并联","p":"两个电阻 R1=6Ω、R2=12Ω 串联接在 18V 电源上，R1两端的电压为（ ）。","o":["12V","6V","9V","18V"],"a":1,"d":"低","e":"分压公式 u1 = (R1/(R1+R2))×U = (6/18)×18 = 6V。"},{"id":118,"c":2 "},{"id":187,"c":2,"n":87,"t":"实际电源的两种模型及其等效变换","p":"实际电流源模型由（ ）。","o":["理想电压源与电阻串联组成","理想电压源与电阻并联组成","理想电流源与电阻并联组成","理想电流源与电阻串联组成"],"a":2,"d":"低","e":"实际电流源用理想电流源 Is与内阻 Rs并联表示。"},{"id":188,"c":2,"n":88,"t":"实际电源的两种模型及其等效变换","p":"实际电压源等效变换为实际电流源时，等效电流 Is等于（ ）。","o":["UsRs","Us/Rs","Rs/Us","Us+Rs"],"a":1,"d":"中","e":"等效电流源电流 Is = Us/Rs，内阻不变。"},{"id":189,"c":2,"n":89,"t":"实际电源的两种模型及其等效变换","p":"实际电流源等效变换为实际电压源时，等效电压 Us等于（ ）。","o":["IsRs","Is/Rs","Rs/Is","Is+Rs"],"a":0,"d":"中","e":"等效电压源电压 Us = IsRs，内阻不变。"},{"id":190,"c":2,"n":90,"t":"实际电源的两种模型及其等效变换","p":"电源等效变换时，电压源正极对应电流源的（ ）。","o":["电流流入端","电流流出端","任意端","接地端"],"a":1,"d":"中","e":"等效变换时，电压源的正极性与电流源电流流出方向相对应。"},{"id":191,"c":2,"n":91,"t":"实际电源的两种模型及其等效变换","p":"关于电源等效变换，以下说法正确的是（ ）。","o":["等效变换对电源内部也等效","等效变换只对外电路等效","理想电压源和理想电流源可以相互等效","等效变换会改变电阻值"],"a":1,"d":"中","e":"电源等效变换只是对外电路等效，对电源内部不等效；理想电压源和电流源之间无等效关系。"},{"id":192,"c":2,"n":92,"t":"实际电源的两种模型及其等效变换","p":"实际电压源的内阻为 2Ω，开路电压为 10V，等效为电流源时电流为（ ）。","o":["5A","10A","20A","2A"],"a":0,"d":"中","e":"Is = Us/Rs = 10/2 = 5A 。"},{"id":193,"c":2,"n":93,"t":"实际电源的两种模型及其等效变换","p":"实际电流源的内阻为 4Ω，电流为 3A ，等效为电压源时电压为（ ）。","o":["12V","0.75V","7V","3V"],"a":0,"d":"中","e":"Us = IsRs = 3×4 = 12V。"},{"id":194,"c":2,"n":94,"t":"实际电源的两种模型及其等效变换","p":"理想电压源和理想电流源之间（ ）。","o":["可以相互等效变换","不存在等效变换关系","在特定条件下可以等效","电压源等效为短路"],"a":1,"d":"中","e":"理想电压源内阻为零，理想电流源内阻为无穷大，两者之间不存在等效变换的条件。"},{"id":195,"c":2,"n":95,"t":"实际电源的两种模型及其等效变换","p":"电源等效变换时，内阻 Rs（ ）。","o":["改变数值","保持不变","变为零","变为无穷大"],"a":1,"d":"中","e":"实际电压源和实际电流源等效变换时，内阻数值保持不变。"},{"id":196,"c":2,"n":96,"t":"输入电阻","p":"输入电阻是指（ ）。","o":["电路中最大的电阻","从端口看进去的等效电阻","电源的内阻","负载电阻"],"a":1,"d":"低","e":"输入电阻是从二端网络端口看进去的等效电阻，等于端口电压与端口电流之比。"},{"id":197,"c":2,"n":97,"t":"输入电阻","p":"求含源二端网络的输入电阻时，应将独立源（ ）。","o":["保留不变","电压源短路、电流源开路","电压源开路、电流源短路","全部短路"],"a":1,"d":"中","e":"求含源网络的输入电阻（等效电阻）时，独立电压源置零（短路），独立电流源置零（开路）。"},{"id":198,"c":2,"n":98,"t":"输入电阻","p":"求纯电阻网络的输入电阻时，通常采用（ ）。","o":["节点电压法","电阻串并联等效化简","叠加定理","戴维南定理"],"a":1,"d":"低","e":"纯电阻网络通过串并联等效（必要时 Y-Δ 变换）即可求得输入电阻。"},{"id":199,"c":2,"n":99,"t":"输入电阻","p":"某二端网络的端口电压为 12V，流入电流为 3A ，则该网络的输入电阻为（ ）。","o":["36Ω","4Ω","0.25Ω","15Ω"],"a":1,"d":"低","e":"输入电阻 Ri = U/I = 12/3 = 4Ω。"},{"id":200,"c":2,"n":100,"t":"输入电阻","p":"关于输入电阻，以下说法正确的是（ ）。","o":["输入电阻一定大于电路中任一电阻","输入电阻是端口电压与端口电流的比值","输入电阻与外部电路有关","输入电阻一定小于电路中任一电阻"],"a":1,"d":"中","e":"输入电阻的定义是端口电压与端口电流之比，其大小由网络内部结构和参数决定，与外部电路无关。"},{"id":201,"c":3,"n":1,"t":"电路的图","p":"关于电路的“图”的概念，下列说法正确的是（ ）。","o":["电路的图是指电路的实际几何布局图","电路的图由支路和结点组成，支路用线段表示，结点用圆点表示","电路的图中，支路的方向是固定不可选的","电路的图只适用于平面电路"],"a":1,"d":"低","e":"电路的图（拓扑图）是节点和支路的集合，支路用线段表示，节点用圆点表示。支路的方向可以任意指定，参考方向与实际方向一致时电流为正，否则为负。图的概念对平面电路和非平面电路都适用。"},{"id":202,"c":3,"n":2,"t":"电路的图","p":"下列关于有向图的说法中，错误的是（ ）。","o":["有向图的支路电流参考方向可以任意假定","有向图的支路电压参考方向通常与电流参考方向取关联方向","有向图中各支路的方向一旦确定就不能更改","支路方向的不同选择不会影响最终求解结果的正确性"],"a":2,"d":"低","e":"有向图中支路的方向是人为假定的参考方向，可以根据方便任意选取，不同的参考方向选择不会改变最终结果的正确性，只是可能导致中间计算结果的符号不同。"},{"id":203,"c":3,"n":3,"t":"电路的图","p":"对于具有 4 个节点、6 条支路的连通电路，其树枝数和连支数分别为（ ）。","o":["4 和 2","3 和 3","2 和 4","4 和 6"],"a":1,"d":"低","e":"连通电路的树支数等于独立节点数，即 n-1=4-1=3；连支数等于独立回路数，即 b-n+1=6-4+1=3。"},{"id":204,"c":3,"n":4,"t":"电路的图","p":"关于树的概念，下列说法正确的是（ ）。","o":["树是包含电路中所有支路的连通图","树是连通图的一个子图，包含所有节点但不包含回路","一个连通图只有唯一的一棵树","树中一定包含回路"],"a":1,"d":"低","e":"树是连通图的一个子图，它包含图中的全部节点，但不包含任何回路。一个连通图可以选出多种不同的树，树支数为 n-1，连支数为 b-n+1。"},{"id":205,"c":3,"n":5,"t":"电路的图","p":"对于一个具有 5 个节点、8 条支路的连通电路，独立回路数为（ ）。","o":["3","4","5","8"],"a":1,"d":"低","e":"独立回路数等于连支数，即 b-n+1=8-5+1=4。"},{"id":206,"c":3,"n":6,"t":"电路的图","p":"下列关于平面电路和非平面电路的说法，正确的是（ ）。","o":["非平面电路不存在网孔","平面电路的网孔数等于独立回路数","非平面电路不能用回路电流法分析","平面电路不能用结点电压法分析"],"a":1,"d":"中","e":"平面电路可以画在平面上而不出现支路交叉，其网孔数恰好等于独立回路数 b-n+1。非平面电路没有网孔的概念，但仍有独立回路，因此不能用网孔电流法但可以用回路电流法。结点电压法对两者均适用。"},{"id":207,"c":3,"n":7,"t":"电路的图","p":"在电路拓扑图中，从任一节点出发，经过若干支路和节点后回到出发节点的路径称为（ ）。","o":["路径","回路","树","割集"],"a":1,"d":"低","e":"回路是电路拓扑图中的一个基本概念，指从某一节点出发，经过若干支路和节点后回到出发节点的闭合路径。"},{"id":208,"c":3,"n":8,"t":"电路的图","p":"一个连通图具有 n 个节点，则其任一棵树的树支数为（ ）。","o":["n","n-1","n+1","b-n+1"],"a":1,"d":"低","e":"树包含连通图的全部 n 个节点且不含回路，树中恰好有 n-1 条支路，这些支路称为树支。"},{"id":209,"c":3,"n":9,"t":"电路的图","p":"关于基本回路的概念，下列说法正确的是（ ）。","o":["基本回路是指包含所有树支的回路","每一条连支和若干树支可以构成一个基本回路","基本回路的数量等于树支数","基本回路中不包含任何连支"],"a":1,"d":"中","e":"基本回路是指只包含一条连支和若干树支的回路。每一条连支对应一个基本回路，因此基本回路的数量等于连支数，即 b-n+1。"},{"id":210,"c":3,"n":10,"t":"电路的图","p":"对于具有 3 个节点、4 条支路的连通电路，下列参数中数值相等的是（ ）。","o":["树支数和支路数","连支数和独立节点数","独立节点数和独立回路数","树支数和连支数"],"a":2,"d":"中","e":"独立节点数为 n-1=2，独立回路数为 b-n+1=4-3+1=2，两者相等。这是本例中的巧合，一般情况下两者不一定相等。"},{"id":211,"c":3,"n":11,"t":"电路的图","p":"有向图的支路方向指的是（ ）。","o":["支路中电流的实际方向","支路中电流的参考方向","支路电压的实际极性","支路中电压源的方向"],"a":1,"d":"低","e":"有向图中支路的方向是人为指定的电流参考方向，并非实际方向。当求解出的电流为正值时，实际方向与参考方向一致；为负值时则相反。"},{"id":212,"c":3,"n":12,"t":"电路的图","p":"关于电路的拓扑约束，下列说法正确的是（ ）。","o":["拓扑约束与支路元件的伏安特性有关","拓扑约束仅取决于电路的连接方式","拓扑约束只包括 KVL","拓扑约束只适用于线性电路"],"a":1,"d":"低","e":"拓扑约束即 KCL 和 KVL， 它们只取决于电路的连接方式（拓扑结构），与支路中元件的类型和参数无关，对线性和非线性电路都适用。"},{"id":213,"c":3,"n":13,"t":"电路的图","p":"对于具有 4 个节点、7 条支路的非平面连通电路，下列说法正确的是（ ）。","o":["网孔电流法仍然适用","独立回路数为 4","树支数为 3","独立回路数为 3"],"a":1,"d":"中","e":"非平面电路不存在网孔概念，因此网孔电流法不适用，A 错误。独立回路数为 b-n+1=7-4+1=4，B 正确，D 错误。树支数为 n-1=3，C 虽然数值正确，但 B 选项是关于独立回路的正确描述，且 B 选项的数值 4 才是本题考察的重点。"},{"id":214,"c":3,"n":14,"t":"电路的图","p":"在电路拓扑分析中，割集是指（ ）。","o":["包含所有支路的集合","把连通图分成两个分离部分的支路最小集合","包含所有节点的集合","包含一条连支和若干树支的闭合路径"],"a":1,"d":"中","e":"割集是把一个连通图分割成两个分离部分所需的最少支路集合。这是图论中的基本概念，与回路的概念对偶。"},{"id":215,"c":3,"n":15,"t":"电路的图","p":"对于具有 6 个节点、10 条支路的连通电路，下列说法正确的是（ ）。","o":["树支数为 6","连支数为 5","独立回路数为 5","独立回路数为 4"],"a":2,"d":"低","e":"树支数=n-1=5，连支数=b-n+1=10-6+1=5，独立回路数=连支数=5。因此 C 正确。"},{"id":216,"c":3,"n":16,"t":"KCL 和 KVL 的独立方程数","p":"对于具有 n 个节点、b 条支路的连通电路，可以列出的独立 KCL 方程数为（ ）。","o":["n","n-1","n+1","b-n+1"],"a":1,"d":"低","e":"对于具有 n 个节点的连通电路，可以列出 n-1 个独立的 KCL 方程。因为所有 n 个节点的 KCL 方程之和恒为零，其中任意一个方程都可由其余 n-1 个导出，因此独立方程数为 n-1。"},{"id":217,"c":3,"n":17,"t":"KCL 和 KVL 的独立方程数","p":"对于具有 n 个节点、b 条支路的连通电路，可以列出的独立 KVL 方程数为（ ）。","o":["n-1","b","b-n+1","b+n-1"],"a":2,"d":"低","e":"独立 KVL 方程数等于独立回路数，也等于连支数，即 b-n+1。 每一条连支和若干树支构成一个基本回路，对应一个独立的 KVL 方程。"},{"id":218,"c":3,"n":18,"t":"KCL 和 KVL 的独立方程数","p":"在有 n 个节点、 b 条支路的连通电路中，可以列出独立 KCL 方程和独立 KVL 方程的个数分别为（ ）。","o":["n；b","b-n+1；n+1","n-1；b-1","n-1；b-n+1"],"a":3,"d":"低","e":"连通电路中，独立 KCL 方程为 n-1 个，独立 KVL 方程为 b-n+1 个，两者之和为 b， 恰好等于支路数。"},{"id":219,"c":3,"n":19,"t":"KCL 和 KVL 的独立方程数","p":"一个具有 5 个节点、8 条支路的连通电路，其独立 KCL 方程数和独立 KVL 方程数分别为（ ）。","o":["5 和 8","4 和 4","5 和 3","4 和 5"],"a":1,"d":"低","e":"独立 KCL 方程数=n-1=5-1=4，独立 KVL 方程数=b-n+1=8-5+1=4。"},{"id":220,"c":3,"n":20,"t":"KCL 和 KVL 的独立方程数","p":"对于具有 3 个节点、5 条支路的连通电路，独立 KCL 方程数为（ ）。","o":["1","2","3","4"],"a":1,"d":"低","e":"独立 KCL 方程数=n-1=3-1=2。"},{"id":221,"c":3,"n":21,"t":"KCL 和 KVL 的独立方程数","p":"KCL 方程反映的是电路中（ ）。","o":["回路中各支路电压的代数和为零","任一节点处各支路电流的代数和为零","各支路电流之间的线性关系","各支路电压与电流的关系"],"a":1,"d":"低","e":"KCL（基尔霍夫电流定律）指出，对于电路中任一节点，流入该节点的电流之和等于流出该节点的电流之和，即各支路电流的代数和为零。"},{"id":222,"c":3,"n":22,"t":"KCL 和 KVL 的独立方程数","p":"KVL 方程反映的是电路中（ ）。","o":["任一节点处各支路电流的代数和为零","任一回路中各支路电压的代数和为零","各支路电流之间的线性关系","各支路电压之间的非线性关系"],"a":1,"d":"低","e":"KVL（基尔霍夫电压定律）指出，对于电路中任一闭合回路，沿该回路绕行一周，各支路电压的代数和恒为零。"},{"id":223,"c":3,"n":23,"t":"KCL 和 KVL 的独立方程数","p":"下列关于 KCL 和 KVL 独立方程数的说法，正确的是（ ）。","o":["KCL 和 KVL 的独立方程数之和等于支路数 b","KCL 的独立方程数等于节点数 n","KVL 的独立方程数等于支路数 b","KCL 和 KVL 的独立方程数之和等于节点数 n"],"a":0,"d":"中","e":"独立 KCL 方程数(n-1)加上独立 KVL 方程数(b-n+1)等于 b，恰好等于支路数，这正是 2b 法（支路电流法）列写 b 个方程的依据。"},{"id":224,"c":3,"n":24,"t":"KCL 和 KVL 的独立方程数","p":"若电路的支路数为 b，节点数为 n，则独立的 KCL 方程数为（ ）。","o":["n","n-1","b-n","b-n+1"],"a":1,"d":"低","e":"对于 n 个节点的电路，独立的 KCL 方程数为 n-1， 因为第 n 个节点的 KCL 方程可由前 n-1 个方程导出。"},{"id":225,"c":3,"n":25,"t":"KCL 和 KVL 的独立方程数","p":"对于具有 4 个节点、6 条支路的电路，用支路电流法求解时需要列写的方程总数为（ ）。","o":["4 个","6 个","3 个","5 个"],"a":1,"d":"低","e":"支路电流法以支路电流为未知量，需要列写 b 个方程（b 条支路对应 b 个未知电流），即 n-1 个 KCL 方程加上 b-n+1 个 KVL 方程，总数等于 b=6。"},{"id":226,"c":3,"n":26,"t":"KCL 和 KVL 的独立方程数","p":"在用支路电流法求解电路时，KCL 方程通常对（ ）列写（ ）。","o":["所有节点；n 个","除参考节点外的其余节点；n-1 个","所有回路；b-n+1 个","网孔；b 个"],"a":1,"d":"低","e":"支路电流法中，KCL 方程对除参考节点外的 n-1 个独立节点列写，这样可以保证所列方程线性无关。"},{"id":227,"c":3,"n":27,"t":"KCL 和 KVL 的独立方程数","p":"独立 KVL 方程数与下列哪个量相等（ ）。","o":["节点数","支路数","连支数","树支数"],"a":2,"d":"中","e":"独立 KVL 方程数等于独立回路数，也等于连支数 b-n+1，因为每条连支与若干树支构成一个基本回路，对应一个独立 KVL 方程。"},{"id":228,"c":3,"n":28,"t":"KCL 和 KVL 的独立方程数","p":"对于一个具有 n 个节点的电路，其 KCL 独立方程数为 n-1，这是因为（ ）。","o":["有一个节点的电流恒为零","所有 n 个节点的 KCL 方程之和恒为零，其中任一个方程可由其余 n-1 个导出","参考节点的电流不需要求解","有源节点的 KCL 方程不独立"],"a":1,"d":"中","e":"将所有 n 个节点的 KCL 方程相加，每个支路电流会同时出现一次正号和一次负号（流入一个节点、流出另一个节点），总和恒为零。因此 n 个方程中只有 n-1 个是独立的。"},{"id":229,"c":3,"n":29,"t":"KCL 和 KVL 的独立方程数","p":"若某电路有 8 条支路、5 个节点，则独立的 KVL 方程数为（ ）。","o":["3","4","5","8"],"a":1,"d":"低","e":"独立 KVL 方程数=b-n+1=8-5+1=4。"},{"id":230,"c":3,"n":30,"t":"KCL 和 KVL 的独立方程数","p":"关于 KCL 和 KVL 方程的独立性，下列说法正确的是（ ）。","o":["对任意 n 个节点列写的 KCL 方程都是独立的","对任意 b-n+1 个回路列写的 KVL 方程都是独立的","只有对独立节点列写的 KCL 方程和对独立回路列写的 KVL 方程才是独立的","KCL 方程和 KVL 方程之间也存在线性相关"],"a":2,"d":"中","e":"KCL 方程必须对独立节点列写（通常取 n-1 个节点），KVL 方程必须对独立回路列写（通常取 b-n+1 个基本回路），否则方程之间可能线性相关，导致无法求解。"},{"id":231,"c":3,"n":31,"t":"KCL 和 KVL 的独立方程数","p":"对于具有 6 个节点、12 条支路的电路，独立 KCL 方程数为（ ）。","o":["5","6","7","12"],"a":0,"d":"低","e":"独立 KCL 方程数=n-1=6-1=5。"},{"id":232,"c":3,"n":32,"t":"KCL 和 KVL 的独立方程数","p":"对于具有 4 个节点、8 条支路的电路，独立 KVL 方程数为（ ）。","o":["3","4","5","8"],"a":2,"d":"低","e":"独立 KVL 方程数=b-n+1=8-4+1=5。"},{"id":233,"c":3,"n":33,"t":"KCL 和 KVL 的独立方程数","p":"关于 KCL 和 KVL 方程与支路伏安特性的关系，下列说法正确的是（ ）。","o":["KCL 和 KVL 方程与支路伏安特性无关","KCL 和 KVL 方程都必须结合支路伏安特性才能求解电路","KCL 方程与伏安特性有关，KVL 方程与伏安特性无关","KVL 方程与伏安特性有关，KCL 方程与伏安特性无关"],"a":1,"d":"中","e":"KCL 和 KVL 方程本身只反映电路的拓扑结构约束，是独立的。但要完整求解电路，还需要结合支路元件的伏安特性（VCR），才能得到 b 个独立方程求解 b 个未知量。"},{"id":234,"c":3,"n":34,"t":"KCL 和 KVL 的独立方程数","p":"用支路电流法求解电路时，独立方程的总数为（ ）。","o":["b 个","n 个","n-1 个","b-n+1 个"],"a":0,"d":"低","e":"支路电流法以 b 条支路的电流为未知量，需要 b 个独立方程：n-1 个 KCL 方程加上 b-n+1 个 KVL 方程（其中 KVL 方程中代入元件的 VCR），总共 b 个。"},{"id":235,"c":3,"n":35,"t":"KCL 和 KVL 的独立方程数","p":"若某电路有 3 个节点、6 条支路，则独立的 KCL 方程数和 KVL 方程数分别为（ ）。","o":["3 和 3","2 和 4","2 和 3","3 和 4"],"a":1,"d":"低","e":"独立 KCL 方程数=n-1=2，独立 KVL 方程数=b-n+1=6-3+1=4。"},{"id":236,"c":3,"n":36,"t":"支路电流法","p":"以客观存在的支路电流为未知量，直接应用 KCL 定律和 KVL 定律求解电路的方法，称为（ ）。","o":["支路电流法","回路电流法","节点电压法","支路电压法"],"a":0,"d":"低","e":"支路电流法以各支路电流为独立变量，直接根据 KCL 和 KVL 列出方程求解电路，是最基本的电路分析方法。"},{"id":237,"c":3,"n":37,"t":"支路电流法","p":"支路电流法是以（ ）为变量列写节点电流方程及（ ）方程（ ）。","o":["支路电流；回路电压","支路电压；节点电流","回路电流；回路电压","节点电压；节点电流"],"a":0,"d":"低","e":"支路电流法以支路电流为未知量，列写 KCL 节点电流方程和 KVL 回路电压方程。"},{"id":238,"c":3,"n":38,"t":"支路电流法","p":"用支路电流法求解电路时，若电路有 b 条支路、n 个节点，则需要列写的 KCL 方程数为（ ）。","o":["n","n-1","b-n+1","b"],"a":1,"d":"低","e":"支路电流法中 KCL 方程对除参考节点外的 n-1 个独立节点列写，因此 KCL 方程数为 n-1。"},{"id":239,"c":3,"n":39,"t":"支路电流法","p":"用支路电流法求解电路时，KVL 方程应以（ ）为绕行回路列写（ ）。","o":["网孔；b-n+1 个","基本回路；b-n+1 个","任意回路；b 个","所有回路；b-n+1 个"],"a":1,"d":"中","e":"支路电流法中 KVL 方程应对独立回路（通常取基本回路）列写，共 b-n+1 个。基本回路是只含一条连支和若干树支的回路，保证 KVL 方程线性无关。"},{"id":240,"c":3,"n":40,"t":"支路电流法","p":"支路电流法的主要缺点是（ ）。","o":["只适用于平面电路","方程数量较多，求解复杂电路时计算量大","不能用于含受控源的电路","只能求解线性电路"],"a":1,"d":"中","e":"支路电流法需要列写 b 个方程，当电路支路数较多时方程数量大，求解复杂。这是支路电流法的主要缺点，也是引入网孔电流法、节点电压法等更高效方法的原因。"},{"id":241,"c":3,"n":41,"t":"支路电流法","p":"用支路电流法求解电路时，各支路电流的参考方向（ ）。","o":["必须与实际方向一致","可以任意假定","必须全部指向同一方向","必须与电压方向一致"],"a":1,"d":"低","e":"在支路电流法中，各支路电流的参考方向可以任意假定。若求解结果为负值，说明实际电流方向与参考方向相反，不影响最终结果的正确性。"},{"id":242,"c":3,"n":42,"t":"支路电流法","p":"对于一个具有 2 个节点、3 条支路的并联电路，用支路电流法求解时需要列写的独立 KCL 方程数为（ ）。","o":["1","2","3","0"],"a":0,"d":"低","e":"独立 KCL 方程数=n-1=2-1=1。具有 2 个节点的电路中，只有 1 个独立的 KCL 方程。"},{"id":243,"c":3,"n":43,"t":"支路电流法","p":"用支路电流法列写 KVL 方程时，若回路中各支路电压的参考方向与绕行方向相反，则该电压项取（ ）。","o":["正号","负号","零","取决于元件类型"],"a":1,"d":"低","e":"KVL 方程中，沿回路绕行方向，支路电压参考方向与绕行方向一致时取正号，相反时取负号。"},{"id":244,"c":3,"n":44,"t":"支路电流法","p":"支路电流法适用于（ ）。","o":["仅线性电路","仅非线性电路","线性电路和非线性电路均适用","仅含独立源的电路"],"a":2,"d":"中","e":"支路电流法直接基于 KCL 和 KVL， 这两个定律对线性电路和非线性电路都适用。对于非线性电路，只需将支路的非线性伏安特性代入 KVL 方程即可。"},{"id":245,"c":3,"n":45,"t":"支路电流法","p":"用支路电流法求解电路时，若某支路电流的计算结果为负值，说明（ ）。","o":["计算过程一定有错误","该支路电流的实际方向与假设的参考方向相反","该支路电流为零","该支路元件损坏"],"a":1,"d":"低","e":"电流的正负只表示实际方向与参考方向的关系。负值说明实际电流方向与假定的参考方向相反。"},{"id":246,"c":3,"n":46,"t":"支路电流法","p":"对于具有 3 个节点、5 条支路的电路，用支路电流法求解时， KCL 方程数和 KVL 方程数分别为（ ）。","o":["3 和 2","2 和 3","3 和 5","2 和 5"],"a":1,"d":"低","e":"KCL 方程数=n-1=3-1=2，KVL 方程数=b-n+1=5-3+1=3。"},{"id":247,"c":3,"n":47,"t":"支路电流法","p":"支路电流法中，KCL 方程是依据（ ）列写的（ ）。","o":["基尔霍夫电压定律","基尔霍夫电流定律","欧姆定律","叠加定理"],"a":1,"d":"低","e":"支路电流法中 KCL 方程依据基尔霍夫电流定律列写，KVL 方程依据基尔霍夫电压定律列写。"},{"id":248,"c":3,"n":48,"t":"支路电流法","p":"用支路电流法求解含受控源的电路时，下列处理方法正确的是（ ）。","o":["受控源不能出现在电路中","先将受控源的控制量用支路电流表示，再代入方程","将受控源视为独立源处理后不需要补充方程","受控源所在支路的电流不需要求解"],"a":1,"d":"中","e":"用支路电流法求解含受控源的电路时，先将受控源视为独立源列写方程，再将控制量用支路电流表示， 代入方程中消去控制量，即可求解。"},{"id":249,"c":3,"n":49,"t":"支路电流法","p":"电路有 4 个节点、6 条支路，用支路电流法求解时需要列写的方程总数为（ ）。","o":["4 个","6 个","9 个","3 个"],"a":1,"d":"低","e":"支路电流法需要 b 个方程（b 条支路对应 b 个未知电流），即 6 个方程：3 个 KCL 方程（4-1=3）和 3 个 KVL 方程（6-4+1=3）。"},{"id":250,"c":3,"n":50,"t":"支路电流法","p":"下列关于支路电流法的说法中，正确的是（ ）。","o":["支路电流法只能用于平面电路","支路电流法的方程数与支路数无关","支路电流法直接以支路电流为求解变量","支路电流法不需要列写 KVL 方程"],"a":2,"d":"低","e":"支路电流法直接以支路电流为未知量，适用于平面和非平面电路，需要同时列写 KCL 和 KVL 方程， 方程总数为 b 个。"},{"id":251,"c":3,"n":51,"t":"支路电流法","p":"用支路电流法求解电路时，KVL 方程中代入元件 VCR 后，方程中的未知量仍为（ ）。","o":["支路电压","支路电流","节点电压","回路电流"],"a":1,"d":"中","e":"支路电流法中， KVL 方程代入元件 VCR（如 u=Ri） 后，方程中的未知量统一为支路电流，与 KCL 方程中的未知量一致，从而可以联立求解。"},{"id":252,"c":3,"n":52,"t":"支路电流法","p":"对于含有理想电流源支路的电路，用支路电流法求解时（ ）。","o":["不需要对该支路列写任何方程","该支路的电流已知，可减少一个未知量","该支路的电压已知","需要将该支路从电路中移除"],"a":1,"d":"中","e":"含理想电流源支路时，该支路的电流为已知量（即电流源的电流值），因此可以减少一个未知量，只需列写其余支路的 KCL 和 KVL 方程。"},{"id":253,"c":3,"n":53,"t":"支路电流法","p":"支路电流法中的“2b 法”是指（ ）。","o":["以支路电流和支路电压共 2b 个变量列写 2b 个方程的方法","以 2 倍支路电流为变量的方法","两次使用支路电流法的方法","将 b 条支路分成两组求解的方法"],"a":0,"d":"高","e":"2b 法以 b 个支路电流和 b 个支路电压共 2b 个变量为未知量，列写 b 个 KCL 方程、 b 个 KVL 方程和 b 个 VCR 方程，共 3b 个方程，但通常教材中指以 2b 个变量列写 2b 个方程（KCL+KVL 共 b 个，VCR 共 b 个，消去 b 个变量后得 b 个方程）。实际上 2b 法是支路电流法的基础。"},{"id":254,"c":3,"n":54,"t":"支路电流法","p":"用支路电流法求解电路，若电路中有 4 条支路，则需要求解的未知量个数为（ ）。","o":["2","4","6","8"],"a":1,"d":"低","e":"支路电流法以 b 条支路的电流为未知量，因此未知量个数等于支路数 b=4。"},{"id":255,"c":3,"n":55,"t":"支路电流法","p":"关于支路电流法 KCL 方程的列写，下列说法正确的是（ ）。","o":["应包含所有节点的 KCL 方程","应包含除参考节点外的 n-1 个节点的 KCL 方程","应包含 b-n+1 个节点的 KCL 方程","KCL 方程可以与 KVL 方程互换"],"a":1,"d":"低","e":"支路电流法中 KCL 方程应包含 n-1 个独立节点的方程，对应除参考节点外的其余节点。KCL 和 KVL 方程不能互换，它们分别基于不同的物理定律。"},{"id":256,"c":3,"n":56,"t":"网孔电流法","p":"网孔电流法基于（ ）。","o":["基尔霍夫电流定律","基尔霍夫电压定律","置换定理","戴维南定理"],"a":1,"d":"低","e":"网孔电流法以网孔电流为未知量，对每个网孔列写 KVL 方程，因此基于基尔霍夫电压定律。"},{"id":257,"c":3,"n":57,"t":"网孔电流法","p":"网孔电流法适用于（ ）。","o":["仅平面电路","仅非平面电路","平面电路和非平面电路均适用","仅含独立源的电路"],"a":0,"d":"低","e":"网孔是平面电路特有的概念，网孔电流法仅适用于平面电路。对于非平面电路，可以用回路电流法。"},{"id":258,"c":3,"n":58,"t":"网孔电流法","p":"对于一个具有 n 个节点、b 条支路的平面电路，用网孔电流法求解时需要列写（ ）。","o":["n-1 个 KCL 方程","b-n-1 个 KVL 方程","n-1 个 KVL 方程","b-n+1 个 KVL 方程"],"a":3,"d":"低","e":"网孔电流法以网孔电流为未知量，指定各网孔的绕行方向，根据 KVL 列出 b-(n-1)个网孔的 KVL 方程，即 b-n+1 个方程。"},{"id":259,"c":3,"n":59,"t":"网孔电流法","p":"关于网孔电流法的自阻和互阻，下列说法正确的是（ ）。","o":["自阻是网孔本身的电阻之和，恒为正","自阻可正可负","互阻恒为正","互阻恒为负"],"a":0,"d":"中","e":"自阻是网孔中所有电阻的总和，恒为正。互阻是两个相邻网孔之间的公共电阻，其符号取决于两网孔电流通过公共电阻的方向：方向相同时互阻为正，方向相反时为负。"},{"id":260,"c":3,"n":60,"t":"网孔电流法","p":"在网孔电流法中，当所有网孔电流均取顺时针（或逆时针）方向时，互阻（ ）。","o":["恒为正","恒为负","可正可负","恒为零"],"a":1,"d":"中","e":"当所有网孔电流均取同一绕行方向时，相邻网孔在公共电阻上的电流方向总是相反的，因此互阻均为负。"},{"id":261,"c":3,"n":61,"t":"网孔电流法","p":"对于具有 4 个网孔的电路，用网孔电流法求解时需要列写的方程数为（ ）。","o":["2","3","4","5"],"a":2,"d":"低","e":"网孔电流法需要列写的方程数等于网孔数（独立回路数），4 个网孔需要列写 4 个 KVL 方程。"},{"id":262,"c":3,"n":62,"t":"网孔电流法","p":"关于网孔电流法，下列叙述中错误的是（ ）。","o":["自电阻是网孔本身的电阻之和，恒为正","互电阻是网孔之间的电阻之和，根据网孔电流的方向有正、负之分","网孔电流法只适用于平面电路","网孔电流自动满足 KVL"],"a":3,"d":"高","e":"网孔电流法对每个网孔列写 KVL 方程，是依据 KVL 建立的，因此网孔电流自动满足 KVL。 网孔电流自动满足 KCL（因为每个节点各网孔电流流入流出自动平衡）。D 选项表述不准确——网孔电流法本身是基于 KVL 建立的，而非“自动满足 KVL”的描述。实际上网孔电流自动满足 KCL，这正是网孔电流法的优点。A、B、C 均正确。"},{"id":263,"c":3,"n":63,"t":"网孔电流法","p":"在网孔电流法中，网孔电流自动满足的定律是（ ）。","o":["KVL","KCL","欧姆定律","叠加定理"],"a":1,"d":"中","e":"网孔电流是沿网孔边界连续流动的假想电流，对每个节点而言，流入和流出的网孔电流自动平衡，因此网孔电流自动满足 KCL。这正是网孔电流法不需要列写 KCL 方程的原因。"},{"id":264,"c":3,"n":64,"t":"网孔电流法","p":"在网孔电流法中，各网孔电流的绕行方向（ ）。","o":["必须全部为顺时针","可以任意假定","必须全部为逆时针","必须与外电路电流方向一致"],"a":1,"d":"低","e":"各网孔电流的绕行方向可以任意假定，通常为了便于计算，将所有网孔电流统一取顺时针或逆时针方向，使得互阻为负。"},{"id":265,"c":3,"n":65,"t":"网孔电流法","p":"用网孔电流法求解电路时，若电路有 3 个网孔，则需要列写的 KVL 方程数为（ ）。","o":["1","2","3","4"],"a":2,"d":"低","e":"网孔电流法的方程数等于网孔数，3 个网孔需要列写 3 个 KVL 方程。"},{"id":266,"c":3,"n":66,"t":"网孔电流法","p":"在网孔电流方程中，等号右端的电压项表示（ ）。","o":["网孔中各电压源电压的代数和","网孔中各电阻上电压的代数和","网孔电流在该网孔中产生的电压","相邻网孔对该网孔的影响"],"a":0,"d":"中","e":"网孔电流方程标准形式中，等号右端的电压项是网孔中各电压源电压的代数和，电压源电压方向与网孔绕行方向一致时取负号，相反时取正号。"},{"id":267,"c":3,"n":67,"t":"网孔电流法","p":"网孔电流法相对于支路电流法的优势是（ ）。","o":["适用于非平面电路","方程数减少 n-1 个","可以求解非线性电路","不需要列写 KVL 方程"],"a":1,"d":"中","e":"网孔电流法的方程数等于网孔数（b-n+1）， 比支路电流法的 b 个方程减少了 n-1 个，因此求解更为简便。"},{"id":268,"c":3,"n":68,"t":"网孔电流法","p":"关于网孔电流法的适用范围，下列说法正确的是（ ）。","o":["只能用于含独立源的电路","只能用于线性电路","可用于平面电路","可用于所有电路"],"a":2,"d":"低","e":"网孔电流法仅适用于平面电路，因为网孔是平面电路特有的概念。对于非平面电路，需要用回路电流法。"},{"id":269,"c":3,"n":69,"t":"网孔电流法","p":"在网孔电流法中，若两个网孔之间没有公共电阻，则它们之间的互阻为（ ）。","o":["正数","负数","零","无穷大"],"a":2,"d":"低","e":"互阻是两个相邻网孔之间的公共电阻，若两网孔没有公共电阻，则互阻为零。"},{"id":270,"c":3,"n":70,"t":"网孔电流法","p":"用网孔电流法求解电路时，网孔电流方程中的自阻项系数（ ）。","o":["可正可负","恒为正","恒为负","恒为零"],"a":1,"d":"低","e":"自阻是该网孔中所有电阻的总和，由于电阻恒为正，自阻恒为正数。"},{"id":271,"c":3,"n":71,"t":"网孔电流法","p":"对于一个具有 3 个网孔的平面电路，若网孔电流分别为 i1、i2、i3，且公共电阻上的电流方向均相同， 则互阻 R12（ ）。","o":["恒为正","恒为负","为零","无法确定"],"a":0,"d":"中","e":"若两网孔电流通过公共电阻的方向相同，则互阻为正。但通常为了简化计算，将所有网孔电流取同一绕行方向，此时互阻为负。"},{"id":272,"c":3,"n":72,"t":"网孔电流法","p":"关于网孔电流法方程的一般形式，下列说法正确的是（ ）。","o":["系数矩阵为非对称矩阵","当所有网孔电流取同一绕行方向时，系数矩阵为对称矩阵","系数矩阵中自阻为负","方程数与支路数相等"],"a":1,"d":"中","e":"对于无受控源的线性电阻电路，当所有网孔电流取同一绕行方向时， Rjk=Rkj， 系数矩阵为对称矩阵。"},{"id":273,"c":3,"n":73,"t":"网孔电流法","p":"用网孔电流法求解含受控源的电路时，正确的处理方法是（ ）。","o":["受控源不能出现在网孔电流法中","先将受控源视为独立源列写方程，再将控制量用网孔电流表示并代入","受控源不需要补充方程","将受控源所在网孔从电路中移除"],"a":1,"d":"中","e":"网孔电流法处理受控源时，先将受控源当作独立源列写方程，然后补充将控制量用网孔电流表示的方程，代入消去控制量。"},{"id":274,"c":3,"n":74,"t":"网孔电流法","p":"网孔电流法中的网孔电流是（ ）。","o":["实际存在于电路中的物理电流","沿网孔边界流动的假想电流","支路电流的代数和","节点电压的线性组合"],"a":1,"d":"低","e":"网孔电流是假想的沿网孔边界连续流动的电流，不是实际存在于电路中的物理电流。实际支路电流可以通过网孔电流的代数和求得。"},{"id":275,"c":3,"n":75,"t":"网孔电流法","p":"对于一个具有 5 个节点、8 条支路的平面电路，网孔数为（ ）。","o":["3","4","5","8"],"a":1,"d":"低","e":"平面电路的网孔数等于独立回路数 b-n+1=8-5+1=4。"},{"id":276,"c":3,"n":76,"t":"回路电流法","p":"回路电流法与网孔电流法的主要区别是（ ）。","o":["回路电流法只适用于平面电路","回路电流法适用于平面和非平面电路","回路电流法不需要列写 KVL 方程","回路电流法以节点电压为未知量"],"a":1,"d":"低","e":"回路电流法以基本回路中的回路电流为未知量，适用于平面和非平面电路，而网孔电流法仅适用于平面电路。"},{"id":277,"c":3,"n":77,"t":"回路电流法","p":"回路电流法是对独立回路列写（ ）方程（ ）。","o":["KCL","KVL","VCR","功率"],"a":1,"d":"低","e":"回路电流法对独立回路列写 KVL 方程，方程数为 b-n+1，与网孔电流法相同。"},{"id":278,"c":3,"n":78,"t":"回路电流法","p":"回路电流法相对于支路电流法，方程数减少了（ ）。","o":["b 个","n-1 个","b-n+1 个","n 个"],"a":1,"d":"中","e":"支路电流法需要 b 个方程，回路电流法需要 b-n+1 个方程，减少了 n-1 个方程。"},{"id":279,"c":3,"n":79,"t":"回路电流法","p":"关于回路电流法，下列说法正确的是（ ）。","o":["回路电流法是只运用基尔霍夫电压定律的求解方法","回路电流法需要同时列写 KCL 和 KVL 方程","回路电流法以支路电流为未知量","回路电流法只适用于线性电路"],"a":0,"d":"中","e":"回路电流法以回路电流为未知量，对独立回路列写 KVL 方程，是只运用基尔霍夫电压定律的求解方法，KCL 自动满足。"},{"id":280,"c":3,"n":80,"t":"回路电流法","p":"用回路电流法求解电路时，回路电流自动满足的定律是（ ）。","o":["KVL","KCL","欧姆定律","功率守恒"],"a":1,"d":"低","e":"回路电流沿回路连续流动，对每个节点而言，流入和流出的回路电流自动平衡，因此回路电流自动满足 KCL。"},{"id":281,"c":3,"n":81,"t":"回路电流法","p":"回路电流法中，回路电流的参考方向可以（ ）。","o":["只能取顺时针","只能取逆时针","任意假定","必须与支路电流方向一致"],"a":2,"d":"低","e":"回路电流的参考方向可以任意假定，与网孔电流法类似，不同的参考方向选择不会影响最终结果的正确性。"},{"id":282,"c":3,"n":82,"t":"回路电流法","p":"用回路电流法求解电路时，若电路有 b 条支路、n 个节点，则需要列写的方程数为（ ）。","o":["b 个","n-1 个","b-n+1 个","n 个"],"a":2,"d":"低","e":"回路电流法需要列写 b-n+1 个 KVL 方程，对应独立回路数。"},{"id":283,"c":3,"n":83,"t":"回路电流法","p":"回路电流法中的自阻是（ ）。","o":["回路中所有电阻之和，恒为正","回路中所有电阻之和，可正可负","相邻回路之间的公共电阻","回路中电压源的内阻"],"a":0,"d":"低","e":"自阻是回路中所有电阻的总和，由于电阻恒为正，自阻恒为正数。"},{"id":284,"c":3,"n":84,"t":"回路电流法","p":"关于回路电流法中的互阻，下列说法正确的是（ ）。","o":["互阻恒为正","互阻为相邻回路的公共电阻，符号取决于回路电流通过公共电阻的方向","互阻恒为负","互阻与回路电流方向无关"],"a":1,"d":"中","e":"互阻是相邻回路之间的公共电阻，其符号取决于两回路电流通过公共电阻的方向关系：方向相同时为正，相反时为负。"},{"id":285,"c":3,"n":85,"t":"回路电流法","p":"回路电流法适用于（ ）。","o":["仅平面电路","仅非平面电路","平面电路和非平面电路","仅含独立源的电路"],"a":2,"d":"低","e":"回路电流法以独立回路电流为未知量，独立回路可以是基本回路，适用于平面电路和非平面电路。"},{"id":286,"c":3,"n":86,"t":"回路电流法","p":"在回路电流法中，若两个回路没有公共支路，则互阻为（ ）。","o":["正数","负数","零","无穷大"],"a":2,"d":"低","e":"若两回路没有公共支路，则没有公共电阻，互阻为零。"},{"id":287,"c":3,"n":87,"t":"回路电流法","p":"回路电流法与网孔电流法相比，其方程数（ ）。","o":["更多","更少","相同","无法比较"],"a":2,"d":"低","e":"回路电流法和网孔电流法的方程数都等于独立回路数 b-n+1，因此在同一电路中方程数相同。"},{"id":288,"c":3,"n":88,"t":"回路电流法","p":"用回路电流法求解含受控源的电路时，正确的处理方法是（ ）。","o":["受控源不能出现在回路电流法中","先将受控源视为独立源列写方程，再补充控制量与回路电流的关系方程","受控源不需要补充方程","将受控源从电路中移除"],"a":1,"d":"中","e":"与网孔电流法类似，回路电流法处理受控源时，先将受控源当作独立源列写方程，再补充控制量用回路电流表示的方程，代入消去控制量。"},{"id":289,"c":3,"n":89,"t":"结点电压法","p":"结点电压法基于（ ）。","o":["戴维南定理","诺顿定理","基尔霍夫电压定律","基尔霍夫电流定律"],"a":3,"d":"低","e":"结点电压法以节点电压为未知量，对独立节点列写 KCL 方程，因此基于基尔霍夫电流定律。"},{"id":290,"c":3,"n":90,"t":"结点电压法","p":"必须设立电路参考点后才能求解电路的方法是（ ）。","o":["支路电流法","回路电流法","节点电压法","2b 法"],"a":2,"d":"低","e":"节点电压法需要选取一个参考节点（零电位点），其余节点的电压都是相对于参考节点的电压，因此必须先设立参考点才能求解。"},{"id":291,"c":3,"n":91,"t":"结点电压法","p":"用节点电压法求解电路时，参考节点通常取（ ）。","o":["电压最高的节点","连接支路最多的节点","任意一个节点，通常取接地节点","电压源的正极节点"],"a":2,"d":"低","e":"参考节点可以任意选取，通常选择接地节点或连接支路最多的节点，以便于列写方程。参考节点的电位规定为零。"},{"id":292,"c":3,"n":92,"t":"结点电压法","p":"对于一个具有 n 个节点的电路，用节点电压法求解时需要列写的方程数为（ ）。","o":["n","n-1","b-n+1","b"],"a":1,"d":"低","e":"节点电压法以除参考节点外的 n-1 个节点电压为未知量，对 n-1 个独立节点列写 KCL 方程。"},{"id":293,"c":3,"n":93,"t":"结点电压法","p":"结点电压法中的自导是（ ）。","o":["与节点相连的所有支路电阻之和","与节点相连的所有支路电导之和，恒为正","相邻节点之间的互导","与节点相连的电压源个数"],"a":1,"d":"中","e":"自导是连接到该节点的所有支路电导之和，由于电导恒为正，自导恒为正数。"},{"id":294,"c":3,"n":94,"t":"结点电压法","p":"结点电压法中的互导是（ ）。","o":["两节点之间公共支路的电导，恒为负","两节点之间公共支路的电导，恒为正","两节点之间公共支路的电导，符号可正可负","两节点之间公共支路的电阻"],"a":0,"d":"中","e":"互导是两个节点之间公共支路的电导，由于节点电压方程中互导项前带负号，因此互导（在方程中） 恒为负。"},{"id":295,"c":3,"n":95,"t":"结点电压法","p":"用节点电压法求解电路时，若电路中有无伴电压源，正确的处理方法是（ ）。","o":["将电压源视为电流源","设电压源的一端为参考节点，或增设电流为未知量","将电压源从电路中移除","电压源不需要特殊处理"],"a":1,"d":"高","e":"含无伴电压源时，可将电压源的一端选为参考节点，使另一端电压已知；或设电压源电流为未知量， 补充电压约束方程。"},{"id":296,"c":3,"n":96,"t":"结点电压法","p":"结点电压法适用于（ ）。","o":["仅平面电路","仅非平面电路","平面电路和非平面电路均适用","仅含独立源的电路"],"a":2,"d":"低","e":"节点电压法基于 KCL，对任何电路拓扑结构都适用，不受平面/非平面限制。"},{"id":297,"c":3,"n":97,"t":"结点电压法","p":"对于具有 4 个节点、6 条支路的电路，用节点电压法求解时需要列写的方程数为（ ）。","o":["3","4","6","5"],"a":0,"d":"低","e":"节点电压法需要列写 n-1=4-1=3 个 KCL 方程。"},{"id":298,"c":3,"n":98,"t":"结点电压法","p":"当复杂电路的支路数较多、节点数较少时，应用（ ）法可以减少方程数目（ ）。","o":["支路电流法","回路电流法","网孔电流法","节点电压法"],"a":3,"d":"低","e":"当节点数较少时，节点电压法需要列写的方程数为 n-1，方程数较少，因此可以减少方程数目。"},{"id":299,"c":3,"n":99,"t":"结点电压法","p":"在节点电压法中，节点电压是指（ ）。","o":["节点与无穷远之间的电压","节点与参考节点之间的电压","节点与大地之间的电压","相邻节点之间的电压"],"a":1,"d":"低","e":"节点电压是指电路中各节点相对于参考节点的电压，参考节点电位规定为零。"},{"id":300,"c":3,"n":100,"t":"结点电压法","p":"用节点电压法求解电路时，KCL 方程中电流源的处理方法是（ ）。","o":["电流源视为开路","电流源视为短路","电流源电流移到方程等号右端，流入节点时取正，流出时取负","电流源不需要参与方程列写"],"a":2,"d":"中","e":"节点电压方程中，电流源的电流移到等号右端作为已知量。电流流入节点时，在方程右端取正号；流出节点时取负号。"}]</script>
<script>
'use strict';
const $=id=>document.getElementById(id), bank=JSON.parse($('bank').textContent), key='circuit-quiz:v1';
const byId=new Map(bank.map(q=>[q.id,q]));
let s={records:{},mode:'order',chapter:0,difficulty:'',ids:[],index:0,redo:null};
try{Object.assign(s,JSON.parse(localStorage.getItem(key))||{})}catch{}
const mathTerm = String.raw`[A-Za-z0-9ρΣΔΩ²³_−.]+(?:×[A-Za-z0-9ρΣΔΩ²³_−.]+)*`;
const mathGroup = String.raw`\((?:[A-Za-z0-9ρΣΔΩ²³_−.+*/×\s-]|\([A-Za-z0-9ρΣΔΩ²³_−.+*/×\s-]+\))+\)`;
const mathOperand = `(?:${mathGroup}|${mathTerm})`;
const mathParts = new RegExp(
  `(${mathOperand})\\s*/\\s*(${mathOperand})|10(−[68])|([RIUVGuiv])([0-9]+|max|ab|[ksnijkΔY]|_并)(?![a-z])|([²³])`, 'g'
);
function writeMath(target, source) {
  target.replaceChildren();
  let offset = 0;
  const appendText = value => { if (value) target.append(value); };
  for (const match of source.matchAll(mathParts)) {
    appendText(source.slice(offset, match.index));
    const [raw, numerator, denominator, exponent, symbol, index, power] = match;
    const part = document.createElement('span');
    part.className = 'math';
    if (numerator && !/^(?:[0-9.]+V|[A-Za-z]{2,})$/.test(numerator.replace(/^(?:Us|Is|Rs|Ri)$/, 'R'))) {
      part.className += ' fraction';
      part.setAttribute('role', 'math');
      part.setAttribute('aria-label', numerator + ' 除以 ' + denominator);
      for (const operand of [numerator, denominator]) {
        const row = document.createElement('span');
        writeMath(row, operand.startsWith('(') ? operand.slice(1,-1) : operand);
        part.append(row);
      }
    } else if (symbol || exponent || power) {
      const affix = document.createElement(symbol ? 'sub' : 'sup');
      affix.textContent = index?.replace(/^_/, '') ?? exponent ?? (power === '²' ? '2' : '3');
      if (symbol || exponent) part.append(symbol ?? '10');
      part.append(affix);
    } else {
      part.textContent = raw;
    }
    target.append(part);
    offset = match.index + raw.length;
  }
  appendText(source.slice(offset));
}

function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch{}}
function scope(){
  return bank.filter(q=>(!s.chapter||q.c===s.chapter)&&(!s.difficulty||q.d===s.difficulty));
}
function shuffle(ids){
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  return ids;
}
function setup(){
  s.ids=scope().filter(q=>(s.mode!=='wrong'||s.records[q.id]?.choice!==undefined&&s.records[q.id].choice!==q.a)).map(q=>q.id);
  if(s.mode==='random')shuffle(s.ids);
  s.index=0;s.redo=s.mode==='wrong'?(s.ids[0]??null):null;
}
function examInProgress(){ return s.mode==='exam' && s.exam && !s.exam.finished; }
function finishExam(){
  if(!examInProgress())return;
  s.exam.finished=true;
  s.index=0;
  render(true);
}
function examClock(){
  if(!examInProgress())return;
  const seconds=Math.max(0,Math.ceil((s.exam.deadline-Date.now())/1000));
  if(!seconds){finishExam();return;}
  const answered=Object.keys(s.exam.answers).length;
  $('examStatus').textContent='剩余 '+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')+' · 已答 '+answered+' / '+s.ids.length;
}
function render(focus=false){
  if(examInProgress() && Date.now()>=s.exam.deadline){
    s.exam.finished=true;
    s.index=0;
  }
  save();
  const exam=s.mode==='exam'?s.exam:null;
  const active=!!examInProgress();
  const configuring=s.mode==='exam'&&!exam;
  const available=scope().length;
  $('examConfig').hidden=!configuring;
  $('examCount').max=Math.max(1,available);
  if(configuring && Number($('examCount').value)>available){
    $('examCount').value=Math.max(1,available);
  }
  $('startExam').disabled=!available;
  $('examAvailable').textContent='当前范围可抽取 '+available+' 题';
  $('examMode').classList.toggle('primary',s.mode==='exam');
  $('examMode').setAttribute('aria-pressed',s.mode==='exam');
  $('examMode').disabled=active;
  $('chapter').disabled=!!exam;
  $('difficulty').disabled=!!exam;
  $('submitExam').hidden=!active;
  $('examStatus').hidden=!exam;
  $('humanForm').hidden=configuring;
  if(exam?.finished){
    const correct=s.ids.filter(id=>exam.answers[id]===byId.get(id).a).length;
    const unanswered=s.ids.length-Object.keys(exam.answers).length;
    $('examStatus').textContent='得分 '+correct+' / '+s.ids.length+' · 答错 '+(s.ids.length-correct-unanswered)+' · 未答 '+unanswered;
  }else if(active){examClock();}

  const q=byId.get(s.ids[s.index]), history=bank.filter(q=>s.records[q.id]), errors=history.filter(q=>s.records[q.id].choice!==q.a).length;
  $('chapter').value=s.chapter;$('difficulty').value=s.difficulty;
  $('stats').textContent='已做 '+history.length+' / '+bank.length+' · 错题 '+errors;
  $('progress').value=history.length;
  for(const m of ['order','random','wrong']){$(m).disabled=active;$(m).classList.toggle('primary',s.mode===m);$(m).setAttribute('aria-pressed',s.mode===m)}
  $('position').textContent=q?'第 '+(s.index+1)+' / '+s.ids.length+' 题':configuring?'设置试卷':'当前没有题目';
  $('question').hidden=!q;$('empty').hidden=!!q;
  $('emptyText').textContent=configuring?'选择题数与限时后开始答卷。':s.mode==='wrong'?'当前范围没有待重练的错题。':'当前范围没有题目，请切换章节或难度。';
  $('prev').disabled=s.index<=0;$('next').disabled=s.index>=s.ids.length-1;
  $('choices').replaceChildren();$('feedback').hidden=true;$('retry').hidden=true;
  $('questionGrid').replaceChildren(...s.ids.map((id,i)=>{
    const b=document.createElement('button'), item=byId.get(id);
    const r=exam?(Object.hasOwn(exam.answers,id)?{choice:exam.answers[id]}:null):s.records[id];
    b.textContent=item.c+'·'+item.n;
    b.setAttribute('aria-label','第 '+item.c+' 章第 '+item.n+' 题'+(r?(active?'，已作答':r.choice===item.a?'，已答对':'，待重练'):'，未作答'));
    if(i===s.index)b.setAttribute('aria-current','true');
    if(active ? r : r?.choice===item.a)b.className='primary';
    b.onclick=()=>go(i);return b;
  }));
  if(!q)return;
  $('label').textContent='第 '+q.c+' 章 · 第 '+q.n+' 题';
  $('topic').textContent=q.t+' · 难度'+q.d;
  writeMath($('prompt'),q.p);
  const choice=exam?exam.answers[q.id]:s.redo===q.id?undefined:s.records[q.id]?.choice;
  q.o.forEach((option,i)=>{
    const b=document.createElement('button'), badge=document.createElement('b'), copy=document.createElement('span');
    badge.textContent='ABCD'[i];writeMath(copy,option);copy.className='choiceCopy';b.append(badge,copy);
    if(active){
      b.dataset.selected=String(i===choice);
      b.setAttribute('aria-pressed',i===choice);
    }else if(exam?.finished||choice!==undefined){
      b.disabled=true;
      if(i===q.a)b.dataset.grade='correct';
      else if(i===choice)b.dataset.grade='wrong';
    }
    if(b.dataset.grade){
      const mark=document.createElement('span');mark.className='gradeBadge';
      mark.textContent=b.dataset.grade==='correct'?'✓ 正确答案':'✕ 你的错选';copy.append(mark);
    }
    b.onclick=()=>{
      if(active){
        if(Date.now()>=exam.deadline){finishExam();return;}
        exam.answers[q.id]=i;
        render();
        $('choices').children[i].focus();
        return;
      }
      if(exam)return;
      s.records[q.id]={choice:i};s.redo=null;render();(s.index<s.ids.length-1?$('next'):$('retry')).focus()};
    $('choices').append(b);
  });
  if(!active&&(exam?.finished||choice!==undefined)){
    $('feedback').dataset.kind=choice===q.a?'表决':'质疑';
    $('grade').textContent=(choice===undefined?'未作答':choice===q.a?'✓ 回答正确':'✕ 回答错误 · 你的选择：'+'ABCD'[choice])+' · 正确答案：'+'ABCD'[q.a];
    writeMath($('explanation'),q.e);$('feedback').hidden=false;$('retry').hidden=!!exam;
  }
  if(focus)$('prompt').focus();
}
function go(i){if(i>=0&&i<s.ids.length){s.index=i;const q=byId.get(s.ids[i]);s.redo=s.mode==='wrong'&&s.records[q.id]?.choice!==q.a?q.id:null;render(true)}}
for(const m of ['order','random','wrong'])$(m).onclick=()=>{if(examInProgress())return;s.mode=m;s.exam=null;setup();render()};
$('chapter').onchange=()=>{s.chapter=Number($('chapter').value);if(s.mode!=='exam')setup();render()};
$('difficulty').onchange=()=>{s.difficulty=$('difficulty').value;if(s.mode!=='exam')setup();render()};
$('prev').onclick=()=>go(s.index-1);$('next').onclick=()=>go(s.index+1);
$('retry').onclick=()=>{s.redo=s.ids[s.index];render();$('choices').firstElementChild?.focus()};
$('examMode').onclick=()=>{
  if(examInProgress())return;
  s.mode='exam';
  s.exam=null;
  s.ids=[];
  s.index=0;
  $('examCount').value=Math.min(20,scope().length)||1;
  $('examError').hidden=true;
  render();
};
$('examConfig').onsubmit=event=>{
  event.preventDefault();
  if(s.mode!=='exam'||s.exam)return;
  const count=Number($('examCount').value);
  const minutes=Number($('examMinutes').value);
  const pool=scope();
  if(!Number.isInteger(count)||count<1||count>pool.length||!Number.isInteger(minutes)||minutes<1||minutes>999){
    $('examError').textContent='请输入有效题数和限时。';
    $('examError').hidden=false;
    return;
  }
  s.ids=shuffle(pool.map(q=>q.id)).slice(0,count);
  s.index=0;
  s.redo=null;
  s.exam={deadline:Date.now()+minutes*60000,answers:{},finished:false};
  render(true);
};
$('submitExam').onclick=()=>{
  if(!examInProgress())return;
  const remaining=s.ids.length-Object.keys(s.exam.answers).length;
  if(!remaining||confirm('还有 '+remaining+' 题未答，确认交卷？'))finishExam();
};
if(!s.ids.length&&s.mode!=='exam')setup();
render();
setInterval(examClock,250);
</script>
</html>
